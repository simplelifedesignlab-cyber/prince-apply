<!DOCTYPE html>
<html lang="ja"><head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>マイページ</title><meta name="apple-mobile-web-app-title" content="マイページ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#E8578A"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--pri:#E8578A;--priD:#C2336A;--priL:#FFF0F5;--line:#F6D3E0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.6;background:#FFFFFF;color:#333;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--priL);color:var(--priD);padding:16px 16px 14px;border-bottom:2px solid var(--pri)}
header .in{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:16px;color:#888}
.note{margin:14px 0;font-size:16px;color:#888}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--line);box-shadow:0 1px 3px rgba(232,87,138,.08)}
.card.rest{background:#FAF5F7}
.card h2{margin:0 0 8px;font-size:18px;color:var(--priD)}
label.t{display:block;font-size:16px;font-weight:600;margin:10px 0 4px}
select,input[type=text]{width:100%;min-height:44px;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
.sub{margin:8px 0 0;padding:8px 10px;background:var(--priL);border-radius:10px}
.sub label.t{margin:6px 0 4px;font-size:15px}
.sub input[type=text]{margin-top:6px}
.sub select{margin-top:6px}
.hint{margin:6px 0 0;font-size:14px;color:#888}
.prio{display:inline-block;margin:6px 0 0;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:#e8710a;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;font-size:16px;padding:6px 14px;border:1px solid var(--line);border-radius:22px;background:#fff;color:#333;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.plan{display:flex;gap:6px;align-items:center;margin:6px 0}
.plan select{flex:0 0 112px;width:112px}
.plan input{flex:1;min-width:0}
.plan .sama{flex:0 0 auto;font-size:16px}
.plan2{display:flex;gap:6px;margin:0 0 6px}
.plan2 select{flex:1;min-width:0;width:auto;margin:0}
.pbox{margin:6px 0 10px;padding:6px 8px;background:var(--priL);border-radius:10px}
.pbox .plan{margin-top:0}
.add{margin-top:6px;min-height:44px;font-size:16px;background:var(--priL);color:var(--priD);border:0;border-radius:10px;padding:6px 14px;font-family:inherit;cursor:pointer}
.ptog{display:block;width:100%;text-align:left;margin-top:12px;min-height:44px;font-size:16px;font-weight:700;background:var(--priL);color:var(--priD);border:0;border-radius:10px;padding:8px 14px;font-family:inherit;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 6px rgba(232,87,138,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
#save{width:100%;min-height:48px;font-size:18px;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:12px;font-family:inherit;cursor:pointer}
#save:disabled{opacity:.6}
#msg{min-height:24px;text-align:center;font-size:16px;margin-bottom:6px}
#msg.ok{color:var(--priD)}#msg.ng{color:#d93025}
#load{padding:40px 0;text-align:center}
.booked{margin:6px 0;font-weight:700;color:var(--priD)}
.hbtn{margin-top:8px;min-height:44px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:6px 18px;font-family:inherit;cursor:pointer}
.hbtn.sec{background:var(--priL);color:var(--priD)}
.hbtn:disabled{opacity:.6}
.hmsg{margin:6px 0 0;font-size:15px}.hmsg.ok{color:var(--priD)}.hmsg.ng{color:#d93025}
.sg{border:2px solid var(--pri);background:var(--priL)}
.sg h2{margin:0 0 6px;font-size:18px;color:var(--priD)}
.sg p{margin:4px 0;font-size:16px}
.sg .ng{color:#d93025;font-weight:700}
.a2hs{border:2px solid var(--pri);position:relative;padding-right:44px}
.a2hs h2{font-size:17px}
.a2hs p{margin:4px 0;font-size:16px}
.a2hs .x{position:absolute;top:6px;right:6px;min-width:44px;min-height:44px;border:0;background:none;font-size:15px;color:#888;font-family:inherit;cursor:pointer}
.a2hs .go{margin:6px 0 2px;min-height:44px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:6px 18px;font-family:inherit;cursor:pointer}
</style></head>
<body>
<header><div class="in"><h1 id="gen">マイページ</h1><p id="store"></p></div></header>
<div class="wrap">
  <div id="load">読み込み中…</div>
  <div id="main" hidden>
    <div class="card a2hs" id="a2hs" hidden>
      <button type="button" class="x" id="a2hsX" aria-label="閉じる">閉じる</button>
      <h2>ホーム画面に追加してください</h2>
      <p>次からすぐ開けるように、ホーム画面に追加してください。</p>
      <p id="a2hsIos">iPhone(Safari): 下の共有ボタン(□↑)を押して「ホーム画面に追加」→「追加」</p>
      <p id="a2hsAnd">Android(Chrome): 右上の「︙」を押して「ホーム画面に追加」</p>
      <button type="button" class="go" id="a2hsGo" hidden>追加する</button>
    </div>
    <p class="note">日ごとに出勤・予定・送迎を入力して、いちばん下の「保存」を押してください。このページはあなた専用です。他の人に教えないでください。</p>
    <div id="sougei"></div>
    <div id="days"></div>
  </div>
</div>
<div class="bar" id="bar" hidden><div class="in"><div id="msg"></div><button id="save">保存</button></div></div>
<script>
// google.script.run 互換 shim: GAS の doPost へ fetch (Cookie なし・プリフライトなし)
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbzfib_u_lyJfa_fI58kyvWd2kTL85WKmTTES4HMST7sQoKeon1yjTsHnjrtUElo1PAc/exec";
  function call(fn, args, ok, ng) {
    fetch(EXEC, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { if (ok) ok(j.result); } else throw new Error(j && j.error || '送信に失敗しました'); })
      .catch(function (e) { if (ng) ng(e); else console.error(e); });
  }
  function make(ok, ng) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return make(f, ng); };
      if (k === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () { call(String(k), Array.prototype.slice.call(arguments), ok, ng); };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
<script>
var TOKEN = (function(){var t=new URLSearchParams(location.search).get('t');try{if(t)localStorage.setItem('castKey',t);else t=localStorage.getItem('castKey');}catch(e){}return t||'';})();
var data = null;

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function init() {
  var slow = setTimeout(function () { var l = document.getElementById('load'); if (!l.hidden) l.textContent = '読み込みに時間がかかっています。開き直してください。'; }, 20000);
  google.script.run.withSuccessHandler(function (r) {
    clearTimeout(slow);
    if (!r || !r.ok) { document.body.innerHTML = '<p style="padding:48px 20px;text-align:center">このページは使えません。お店にお問い合わせください</p>'; return; }
    data = r;
    document.getElementById('gen').textContent = r.gen + ' さん';
    document.getElementById('store').textContent = r.store;
    document.getElementById('load').hidden = true;
    document.getElementById('main').hidden = false;
    document.getElementById('bar').hidden = false;
    render();
  }).withFailureHandler(function (e) {
    clearTimeout(slow);
    document.getElementById('load').textContent = '読み込めませんでした。時間をおいて開き直してください。 (' + (e && e.message ? e.message : e) + ')';
  }).getPage(TOKEN);
}

function chip(label, on, fn) {
  var b = el('button', 'chip' + (on ? ' on' : ''), label);
  b.type = 'button';
  b.onclick = function () { fn(); render(); };
  return b;
}

function mkSel(opts, cur, blankLabel, onchg) {
  var sel = el('select');
  if (blankLabel != null) { var b = el('option', '', blankLabel); b.value = ''; sel.appendChild(b); }
  opts.forEach(function (o) { var op = el('option', '', o); op.value = o; if (o === cur) op.selected = true; sel.appendChild(op); });
  sel.onchange = function () { onchg(sel.value); };
  return sel;
}
function isT(s) { return /^\d\d:\d\d$/.test(s); }
function mins(s) { return Number(s.slice(0, 2)) * 60 + Number(s.slice(3)); }
function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
// ヘアメイクの候補: 出勤が時刻なら 2 時間前〜30 分前の 30 分刻み。それ以外は全時間帯。
// 19:30 より前の出勤の子は、出勤してから (出勤の時刻〜1 時間 30 分後) だけ (2026-11-24 山本さんの答え 3: 19:00・19:30 出勤のヘアセットは出勤してから)
function hairChoices(d) {
  if (!isT(d.shift)) return data.hairOpts;
  var t = mins(d.shift), a = [], from = t - 120, to = t - 30;
  if (t <= 19 * 60 + 30) { from = t; to = t + 90; }
  for (var m = from; m <= to; m += 30) { var h = hhmm(m); if (data.hairOpts.indexOf(h) >= 0) a.push(h); }
  if (d.hairTime && a.indexOf(d.hairTime) < 0) a.unshift(d.hairTime);
  return a.length ? a : data.hairOpts;
}

// 美容室の希望 (スイッチが入っている時だけ)。「保存」とは別に、押したその場で出す
// 2026-11-27 山本部長の流れ: 19:00〜22:00 の間に着いた順でできるだけ終わらせる。時間を決められるのは「同伴」と「撮影」の時だけ。ふつうは「指定なし (着いた順)」
function hairCall(d, fn, time, kind) {
  d.hbusy = true; d.hmsg = ''; render();
  var done = function (r) {
    d.hbusy = false;
    if (r) { d.hb = r.b; d.ho = r.o; d.hp = r.p || []; d.hnote = r.n || ''; d.ha = !!r.a; d.hdh = !!r.dh; d.hvs = !!r.hv; d.hair = !!r.b || !!r.a; d.hairTime = r.b ? r.b.time : ''; d.hpick = ''; d.hmsg = r.msg; d.hok = !!r.ok; if (r.ok && fn !== 'reserve') d.hkind = ''; }
    render();
  };
  var run = google.script.run.withSuccessHandler(done).withFailureHandler(function (e) { d.hbusy = false; d.hmsg = '通信できませんでした。もう一度押してください。'; d.hok = false; render(); });
  if (fn === 'reserve') run.reserveHair(TOKEN, d.date, time, kind); else if (fn === 'any') run.requestHairAny(TOKEN, d.date); else run.cancelHair(TOKEN, d.date);
}
// 送迎(行き)のある子の「一番早い時間」(未決・空 = 制限なし)。data.hairSougeiEarliest = 'HH:MM'
function hairEarliestOk(d, t) { return !(d.go && data.hairSougeiEarliest) || t >= data.hairSougeiEarliest; }
function hairBox(d) {
  var s = el('div', 'sub');
  s.appendChild(el('label', 't', 'ヘアメイク 希望'));
  s.appendChild(el('p', 'hint', 'ヘアメイクは 19:00〜22:00 の間に、着いた順でできるだけ終わらせます。時間を決められるのは「同伴」「撮影」がある時だけです'));
  var stale = d.shift !== d.savedShift, hp = d.hp || [];
  if (d.hnote) s.appendChild(el('p', 'hmsg ng', d.hnote));
  if (d.hb) s.appendChild(el('p', 'booked', '希望 ' + d.hb.time + ' ' + d.hb.place + ' (出ています)'));
  else if (d.ha) s.appendChild(el('p', 'booked', '希望 指定なし (着いた順) を出しています'));
  if (d.hb && d.hb.fixed) { s.appendChild(el('p', 'hint', '美容師が記録した時間です。変更・取り消しはお店へ連絡してください')); return s; } // 2026-11-20 中-1
  if (stale) s.appendChild(el('p', 'hint', '出勤を変えた時は、先に一番下の「保存」を押してください'));
  else {
    var kind = d.hkind == null ? (d.hb ? 'x' : '') : d.hkind; // 'x' = 時間を出している (どの種類かは画面では分からないので、どれも選ばれた形にしない)
    var ch = el('div', 'chips');
    ch.appendChild(chip('指定なし (着いた順)', kind === '', function () { d.hkind = ''; d.hpick = ''; }));
    ch.appendChild(chip('同伴 (時間を選ぶ)', kind === '同伴', function () { d.hkind = '同伴'; d.hpick = ''; }));
    ch.appendChild(chip('撮影 (時間を選ぶ)', kind === '撮影', function () { d.hkind = '撮影'; d.hpick = ''; }));
    s.appendChild(ch);
    if (!kind || kind === 'x') {
      if (!d.ha) {
        var ga = el('button', 'hbtn', d.hb ? '時間をやめて 指定なし (着いた順) にする' : '指定なし (着いた順) で希望を出す'); ga.type = 'button'; ga.disabled = !!d.hbusy;
        ga.onclick = function () { hairCall(d, 'any'); };
        s.appendChild(ga);
      }
    } else if (kind === '来店予定' && !d.hvs) {
      s.appendChild(el('p', 'hint', '来店予定が保存されていません。来店の予定 (時間・人数など) を入れて、一番下の「保存」を押してから選んでください'));
    } else if (kind === '同伴' && !d.hdh) {
      s.appendChild(el('p', 'hint', '同伴の予定が保存されていません。予定に「同伴」を入れて、一番下の「保存」を押してから選んでください'));
    } else {
      var opts0 = d.ho.map(function (t) { return { t: t, p: false }; }).concat(kind === '同伴' ? hp.map(function (t) { return { t: t, p: true }; }) : []).filter(function (o) { return hairEarliestOk(d, o.t); });
      if (opts0.length) {
        var sel = el('select'), b0 = el('option', '', d.hb ? '別の時間に変える' : kind + 'の時間を選んでください'); b0.value = ''; sel.appendChild(b0);
        opts0.sort(function (a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; }).forEach(function (o) {
          var op = el('option', '', o.t + (o.p ? ' (優先で入れます)' : '')); op.value = o.t; if (o.t === d.hpick) op.selected = true; sel.appendChild(op);
        });
        sel.onchange = function () { d.hpick = sel.value; };
        sel.disabled = !!d.hbusy; s.appendChild(sel);
        var go = el('button', 'hbtn', d.hb ? '希望の時間を変える' : kind + 'で希望を出す'); go.type = 'button'; go.disabled = !!d.hbusy;
        go.onclick = function () { if (!d.hpick) { d.hmsg = '時間を選んでください'; d.hok = false; render(); return; } hairCall(d, 'reserve', d.hpick, kind); };
        s.appendChild(go);
        s.appendChild(el('p', 'hint', 'お店が決めるまでは、時間が変わることがあります'));
      } else s.appendChild(el('p', 'hint', 'この日は空きがありません。お店へ連絡してください'));
    }
  }
  if (d.hb || d.ha) {
    s.appendChild(document.createElement('br'));
    var cx = el('button', 'hbtn sec', '希望を取り消す'); cx.type = 'button'; cx.disabled = !!d.hbusy;
    cx.onclick = function () { hairCall(d, 'cancel'); };
    s.appendChild(cx);
  }
  if (d.hmsg) s.appendChild(el('p', 'hmsg ' + (d.hok ? 'ok' : 'ng'), d.hmsg));
  return s;
}

// 車の表示 = 車種 (NO.番号)。番号は「3」「NO.3」「3番」のどれで入っていても NO.3。番号が空なら車種だけ (c.color = 送迎予定の「車の色」列 = 中身は車の番号)
function carLabel(c) {
  var no = String(c.color || '').replace(/^\s*(NO\.?|No\.?|no\.?|ＮＯ|№)\s*/, '').replace(/\s*番\s*$/, '').trim();
  return no ? 'NO.' + no : ''; // 2026-11-25 H: 車は「NO.3」だけ (車種・ナンバー下4桁は出さない)
}
function renderSougei() {
  var box = document.getElementById('sougei'), s = data.sougei;
  box.innerHTML = '';
  if (!s) return;
  var card = el('div', 'card sg');
  card.appendChild(el('h2', '', '今日の送迎 ' + s.label));
  function line(name, x, txt) {
    var p = el('p', x.cancel ? 'ng' : '', name + ': ' + (x.cancel ? 'キャンセルになりました' : txt));
    card.appendChild(p);
  }
  function car(x) { // 車の情報 (決まっている時だけ・2026-11-19 v2)
    var c = x.car; if (!c || x.cancel) return;
    var v = carLabel(c); // 2026-11-24: 車の色ではなく車の番号 (NO)
    if (v) card.appendChild(el('p', 'car', '車: ' + v));
    if (c.driver) card.appendChild(el('p', 'car', 'ドライバー: ' + c.driver));
  }
  if (s.go) {
    line('行き', s.go, s.go.pending ? '車は決まり次第ここに出ます' + (s.go.place ? ' ・ ' + s.go.place : '') :
      (s.go.bin ? s.go.bin + (s.go.time ? ' (お迎え ' + s.go.time + ' ごろ)' : '') : s.go.time ? 'お迎え ' + s.go.time + ' ごろ' : 'お迎えの時刻は決まり次第お知らせします') + (s.go.place ? ' ・ ' + s.go.place : ''));
    if (!s.go.pending) car(s.go);
  }
  if (s.back) {
    line('帰り', s.back, s.back.pending ? '帰りの車はお店でお伝えします' : s.back.kind === 'time' ? s.back.dep + ' 発' : s.back.kind === 'after' ? 'アフター (3:00 までにお店へ)' : s.back.kind === 'staff' ? 'お店のスタッフがお送りします' : '出発の時刻は決まり次第お知らせします');
    if (!s.back.pending) car(s.back);
  }
  box.appendChild(card);
}

function render() {
  renderSougei();
  var box = document.getElementById('days');
  box.innerHTML = '';
  data.days.forEach(function (d) {
    var rest = d.shift === '休み';
    var card = el('div', 'card' + (rest ? ' rest' : ''));
    card.appendChild(el('h2', '', d.label));

    card.appendChild(el('label', 't', '出勤'));
    var sel = el('select');
    [''].concat(data.shiftOpts).forEach(function (o) {
      var op = el('option', '', o === '' ? '選んでください' : o); op.value = o; if (o === d.shift) op.selected = true; sel.appendChild(op);
    });
    sel.onchange = function () { d.shift = sel.value; render(); };
    card.appendChild(sel);

    if (isT(d.shift)) {
      card.appendChild(el('label', 't', '退勤の希望'));
      card.appendChild(mkSel(data.leaveOpts, d.leave || data.leaveOpts[0], null, function (v) { d.leave = v; }));
    }

    // 2026-11-27 H「出勤だけの子もいる アコーディオンにして」: 予定は畳んでおき、入っている日だけ開いて出す
    var filled = d.plans.filter(function (p) { return String(p.n || '').trim() || p.c || p.s || p.t; }).length;
    if (d.popen === undefined) d.popen = filled > 0;
    var tg = el('button', 'ptog', (d.popen ? '▾ ' : '▸ ') + '予定 (同伴・来店予定)' + (filled ? ' ' + filled + '件' : '')); tg.type = 'button';
    tg.onclick = function () { d.popen = !d.popen; render(); };
    card.appendChild(tg);
    if (d.popen) {
    while (d.plans.length < 2) d.plans.push({ k: data.planKinds[0], n: '', c: '', s: '', t: '' }); // 空の行を最初から 2 つ出す
    d.plans.forEach(function (p, i) {
      var pb = el('div', 'pbox');
      var row = el('div', 'plan');
      var k = el('select');
      data.planKinds.forEach(function (o) { var op = el('option', '', o); op.value = o; if (o === p.k) op.selected = true; k.appendChild(op); });
      k.onchange = function () { p.k = k.value; if (p.k !== '来店予定') p.t = ''; render(); };
      var n = el('input'); n.type = 'text'; n.maxLength = 30; n.placeholder = 'お客様の名前 (ボトル名)'; n.value = p.n || '';
      n.oninput = function () { p.n = n.value; };
      row.appendChild(k); row.appendChild(n); row.appendChild(el('span', 'sama', '様'));
      pb.appendChild(row);
      var r2 = el('div', 'plan2');
      r2.appendChild(mkSel(data.visNums, p.c || '', '人数', function (v) { p.c = v; }));
      r2.appendChild(mkSel(data.visSeats, p.s || '', '席 (ホール / VIP)', function (v) { p.s = v; }));
      if (p.k === '来店予定') r2.appendChild(mkSel(data.visTimes, p.t || '', '時間', function (v) { p.t = v; }));
      pb.appendChild(r2);
      card.appendChild(pb);
    });
    var add = el('button', 'add', '＋ 予定を追加'); add.type = 'button';
    add.onclick = function () { d.plans.push({ k: data.planKinds[0], n: '', c: '', s: '', t: '' }); render(); };
    card.appendChild(add);
    }

    if (!rest) {
      card.appendChild(el('label', 't', data.hairOn ? '送迎' : '送迎・ヘアメイク'));
      var ch = el('div', 'chips');
      ch.appendChild(chip('送迎 行き(朝) ' + (d.go ? 'あり' : 'なし'), d.go, function () { d.go = !d.go; }));
      ch.appendChild(chip('送迎 帰り ' + (d.back ? 'あり' : 'なし'), d.back, function () { d.back = !d.back; }));
      if (!data.hairOn) ch.appendChild(chip('ヘアメイク ' + (d.hair ? 'あり' : 'なし'), d.hair, function () { d.hair = !d.hair; }));
      card.appendChild(ch);
      if (data.hairOn) card.appendChild(hairBox(d));

      if (d.go) {
        var s1 = el('div', 'sub');
        s1.appendChild(el('label', 't', '迎えの場所'));
        s1.appendChild(mkSel(data.pickOpts.map(function (o) { return o; }), d.pick || '自宅', null, function (v) { d.pick = v; render(); }));
        if ((d.pick || '自宅') === 'その他') {
          var po = el('input'); po.type = 'text'; po.maxLength = 40; po.placeholder = '場所を書いてください'; po.value = d.pickOther || '';
          po.oninput = function () { d.pickOther = po.value; };
          s1.appendChild(po);
        } else if ((d.pick || '自宅') === '自宅') s1.appendChild(el('p', 'hint', '登録してある住所に迎えに行きます'));
        s1.appendChild(el('label', 't', '到着の希望時刻'));
        s1.appendChild(mkSel(data.arriveOpts, d.arrive || (isT(d.shift) ? d.shift : ''), isT(d.shift) ? null : '出勤時刻に合わせる', function (v) { d.arrive = v; }));
        card.appendChild(s1);
      }
      if (d.back) {
        var s2 = el('div', 'sub');
        s2.appendChild(el('label', 't', '帰りの送り先'));
        s2.appendChild(mkSel(data.dropOpts, d.drop || '自宅', null, function (v) { d.drop = v; render(); }));
        if ((d.drop || '自宅') === 'その他') {
          var dof = el('input'); dof.type = 'text'; dof.maxLength = 40; dof.placeholder = '送り先を書いてください'; dof.value = d.dropOther || '';
          dof.oninput = function () { d.dropOther = dof.value; };
          s2.appendChild(dof);
        }
        var ac = el('div', 'chips'); ac.style.marginTop = '8px';
        ac.appendChild(chip('アフター ' + (d.after ? 'あり' : 'なし'), d.after, function () { d.after = !d.after; }));
        s2.appendChild(ac);
        if (d.after) s2.appendChild(el('p', 'hint', 'アフターの日は 3:00 までの帰りになります'));
        card.appendChild(s2);
      }
      if (d.hair && !data.hairOn) {
        var s3 = el('div', 'sub');
        s3.appendChild(el('label', 't', 'ヘアメイクの希望時間'));
        s3.appendChild(mkSel(hairChoices(d), d.hairTime, 'おまかせ', function (v) { d.hairTime = v; }));
        var hasPlan = d.plans.some(function (p) { return p.k === '同伴' && String(p.n || '').trim(); });
        if (hasPlan) { s3.appendChild(el('span', 'prio', '優先')); s3.appendChild(el('p', 'hint', '同伴の日は優先で入れます')); }
        card.appendChild(s3);
      }
    }

    card.appendChild(el('label', 't', '連絡(キャンセル・変更など)'));
    var nt = el('input'); nt.type = 'text'; nt.maxLength = 100; nt.placeholder = '店に伝えたいことがあれば'; nt.value = d.note || '';
    nt.oninput = function () { d.note = nt.value; };
    card.appendChild(nt);
    box.appendChild(card);
  });
}

// 画面の入力は再描画しても保持される (data に持つ)。空の予定行は保存しない (サーバー側でも除く)
var saving = false;
document.getElementById('save').onclick = function () {
  if (saving) return;
  saving = true;
  var btn = this, msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = '保存中…'; msg.className = ''; msg.textContent = '';
  var payload = data.days.map(function (d) {
    return { date: d.date, shift: d.shift, go: d.go, back: d.back, hair: d.hair,
      leave: d.leave, pick: d.pick, pickOther: d.pickOther, arrive: d.arrive, drop: d.drop, dropOther: d.dropOther, after: d.after, hairTime: d.hairTime, note: d.note,
      plans: d.plans.filter(function (p) { return String(p.n || '').trim() || p.c || p.s || p.t; }) };
  });
  google.script.run.withSuccessHandler(function (res) {
    saving = false; btn.disabled = false; btn.textContent = '保存';
    msg.className = 'ok'; msg.textContent = '保存しました';
    if (res && res.sougei !== undefined) data.sougei = res.sougei; // 送迎をなしにした時、「今日の送迎」を更新する (W9)
    if (res && res.pastDropped) { msg.className = 'ng'; msg.textContent = '日付が変わったので、昨日の分は保存しませんでした。開き直してください'; }
    data.days.forEach(function (d) { d.plans = d.plans.filter(function (p) { return String(p.n || '').trim() || p.c || p.s || p.t; }); });
    if (data.hairOn) { // 出勤を変えた日は空き時刻も変わるので読み直す
      google.script.run.withSuccessHandler(function (r) { if (r && r.ok) { data = r; render(); } }).withFailureHandler(function () {}).getPage(TOKEN);
      return;
    }
    render();
  }).withFailureHandler(function (e) {
    saving = false; btn.disabled = false; btn.textContent = '保存';
    msg.className = 'ng'; msg.textContent = '保存できませんでした。もう一度押してください。 (' + (e && e.message ? e.message : e) + ')';
  }).savePage(TOKEN, payload);
};
// ホーム画面への追加案内: 端末に合う方だけ出す。閉じたら覚える。ホーム画面から開いた時は出さない
(function () {
  var card = document.getElementById('a2hs');
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var closed = false;
  try { closed = localStorage.getItem('a2hsClosed') === '1'; } catch (e) {}
  if (standalone || closed) return;
  var ua = navigator.userAgent || '';
  var and = /Android/.test(ua);
  var ios = !and && (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  document.getElementById('a2hsIos').hidden = and && !ios;
  document.getElementById('a2hsAnd').hidden = ios && !and;
  card.hidden = false;
  document.getElementById('a2hsX').onclick = function () {
    card.hidden = true;
    try { localStorage.setItem('a2hsClosed', '1'); } catch (e) {}
  };
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    var go = document.getElementById('a2hsGo');
    go.hidden = false;
    go.onclick = function () { go.hidden = true; ev.prompt(); };
  });
})();
init();
</script>
