<!DOCTYPE html>
<html lang="ja"><head><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>シフト入力</title><meta name="apple-mobile-web-app-title" content="シフト入力"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#06C755"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--pri:#06C755;--priD:#048a3c;--priL:#e6f9ee}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6;background:#F5F6F8;color:#222;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--pri);color:#fff;padding:16px 16px 14px}
header .in{max-width:560px;margin:0 auto}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:16px;opacity:.95}
.note{margin:14px 0;font-size:16px;color:#555}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.rest{background:#f0f0f0}
.card h2{margin:0 0 8px;font-size:18px;color:var(--priD)}
label.t{display:block;font-size:16px;font-weight:600;margin:10px 0 4px}
select,input[type=text]{width:100%;min-height:44px;font-size:16px;padding:6px 10px;border:1px solid #cfd3d8;border-radius:10px;background:#fff;font-family:inherit}
.sub{margin:8px 0 0;padding:8px 10px;background:#f6f8f7;border-radius:10px}
.sub label.t{margin:6px 0 4px;font-size:15px}
.sub input[type=text]{margin-top:6px}
.hint{margin:6px 0 0;font-size:14px;color:#555}
.prio{display:inline-block;margin:6px 0 0;padding:2px 10px;font-size:14px;font-weight:700;color:#fff;background:#e8710a;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;font-size:16px;padding:6px 14px;border:1px solid #cfd3d8;border-radius:22px;background:#fff;color:#222;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.plan{display:flex;gap:6px;align-items:center;margin:6px 0}
.plan select{flex:0 0 112px;width:112px}
.plan input{flex:1;min-width:0}
.plan .sama{flex:0 0 auto;font-size:16px}
.add{margin-top:6px;min-height:44px;font-size:16px;background:var(--priL);color:var(--priD);border:0;border-radius:10px;padding:6px 14px;font-family:inherit;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 6px rgba(0,0,0,.1);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
#save{width:100%;min-height:48px;font-size:18px;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:12px;font-family:inherit;cursor:pointer}
#save:disabled{opacity:.6}
#msg{min-height:24px;text-align:center;font-size:16px;margin-bottom:6px}
#msg.ok{color:var(--priD)}#msg.ng{color:#d93025}
#load{padding:40px 0;text-align:center}
.a2hs{border:2px solid var(--pri);position:relative;padding-right:44px}
.a2hs h2{font-size:17px}
.a2hs p{margin:4px 0;font-size:16px}
.a2hs .x{position:absolute;top:6px;right:6px;min-width:44px;min-height:44px;border:0;background:none;font-size:15px;color:#555;font-family:inherit;cursor:pointer}
.a2hs .go{margin:6px 0 2px;min-height:44px;font-size:16px;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:6px 18px;font-family:inherit;cursor:pointer}
</style></head>
<body>
<header><div class="in"><h1 id="gen">シフト入力</h1><p id="store"></p></div></header>
<div class="wrap">
  <div id="load">読み込み中…</div>
  <div id="main" hidden>
    <div class="card a2hs" id="a2hs" hidden>
      <button type="button" class="x" id="a2hsX" aria-label="閉じる">閉じる</button>
      <h2>ホーム画面に追加してください</h2>
      <p>次からすぐ開けるように、ホーム画面に追加してください。</p>
      <p id="a2hsIos">iPhone(Safari): 下の共有ボタン(□↑)を押して「ホーム画面に追加」→「追加」</p>
      <p id="a2hsAnd">Android(Chrome): 右上の「︙」を押して「ホーム画面に追加」</p>
      <button type="button" class="go" id="a2hsGo" hidden>追加する</button>
    </div>
    <p class="note">日ごとに出勤・予定・送迎を入力して、いちばん下の「保存」を押してください。このページはあなた専用です。他の人に教えないでください。</p>
    <div id="days"></div>
  </div>
</div>
<div class="bar" id="bar" hidden><div class="in"><div id="msg"></div><button id="save">保存</button></div></div>
<script>
// google.script.run 互換 shim: GAS の doPost へ fetch (Cookie なし・プリフライトなし)
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbzfib_u_lyJfa_fI58kyvWd2kTL85WKmTTES4HMST7sQoKeon1yjTsHnjrtUElo1PAc/exec";
  function call(fn, args, ok, ng) {
    fetch(EXEC, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.ok) { if (ok) ok(j.result); } else throw new Error(j && j.error || '送信に失敗しました'); })
      .catch(function (e) { if (ng) ng(e); else console.error(e); });
  }
  function make(ok, ng) {
    return new Proxy({}, { get: function (t, k) {
      if (k === 'withSuccessHandler') return function (f) { return make(f, ng); };
      if (k === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () { call(String(k), Array.prototype.slice.call(arguments), ok, ng); };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
<script>
var TOKEN = (function(){var t=new URLSearchParams(location.search).get('t');try{if(t)localStorage.setItem('castKey',t);else t=localStorage.getItem('castKey');}catch(e){}return t||'';})();
var data = null;

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function init() {
  var slow = setTimeout(function () { var l = document.getElementById('load'); if (!l.hidden) l.textContent = '読み込みに時間がかかっています。開き直してください。'; }, 20000);
  google.script.run.withSuccessHandler(function (r) {
    clearTimeout(slow);
    if (!r || !r.ok) { document.body.innerHTML = '<p style="padding:48px 20px;text-align:center">このページは使えません。お店にお問い合わせください</p>'; return; }
    data = r;
    document.getElementById('gen').textContent = r.gen + ' さん';
    document.getElementById('store').textContent = r.store;
    document.getElementById('load').hidden = true;
    document.getElementById('main').hidden = false;
    document.getElementById('bar').hidden = false;
    render();
  }).withFailureHandler(function (e) {
    clearTimeout(slow);
    document.getElementById('load').textContent = '読み込めませんでした。時間をおいて開き直してください。 (' + (e && e.message ? e.message : e) + ')';
  }).getPage(TOKEN);
}

function chip(label, on, fn) {
  var b = el('button', 'chip' + (on ? ' on' : ''), label);
  b.type = 'button';
  b.onclick = function () { fn(); render(); };
  return b;
}

function mkSel(opts, cur, blankLabel, onchg) {
  var sel = el('select');
  if (blankLabel != null) { var b = el('option', '', blankLabel); b.value = ''; sel.appendChild(b); }
  opts.forEach(function (o) { var op = el('option', '', o); op.value = o; if (o === cur) op.selected = true; sel.appendChild(op); });
  sel.onchange = function () { onchg(sel.value); };
  return sel;
}
function isT(s) { return /^\d\d:\d\d$/.test(s); }
function mins(s) { return Number(s.slice(0, 2)) * 60 + Number(s.slice(3)); }
function hhmm(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2); }
// ヘアメイクの候補: 出勤が時刻なら 2 時間前〜30 分前の 30 分刻み。それ以外は全時間帯
function hairChoices(d) {
  if (!isT(d.shift)) return data.hairOpts;
  var t = mins(d.shift), a = [];
  for (var m = t - 120; m <= t - 30; m += 30) { var h = hhmm(m); if (data.hairOpts.indexOf(h) >= 0) a.push(h); }
  if (d.hairTime && a.indexOf(d.hairTime) < 0) a.unshift(d.hairTime);
  return a.length ? a : data.hairOpts;
}

function render() {
  var box = document.getElementById('days');
  box.innerHTML = '';
  data.days.forEach(function (d) {
    var rest = d.shift === '休み';
    var card = el('div', 'card' + (rest ? ' rest' : ''));
    card.appendChild(el('h2', '', d.label));

    card.appendChild(el('label', 't', '出勤'));
    var sel = el('select');
    [''].concat(data.shiftOpts).forEach(function (o) {
      var op = el('option', '', o === '' ? '選んでください' : o); op.value = o; if (o === d.shift) op.selected = true; sel.appendChild(op);
    });
    sel.onchange = function () { d.shift = sel.value; render(); };
    card.appendChild(sel);

    if (isT(d.shift)) {
      card.appendChild(el('label', 't', '退勤の希望'));
      card.appendChild(mkSel(data.leaveOpts, d.leave || data.leaveOpts[0], null, function (v) { d.leave = v; }));
    }

    card.appendChild(el('label', 't', '予定'));
    while (d.plans.length < 2) d.plans.push({ k: data.planKinds[0], n: '' }); // 空の行を最初から 2 つ出す
    d.plans.forEach(function (p, i) {
      var row = el('div', 'plan');
      var k = el('select');
      data.planKinds.forEach(function (o) { var op = el('option', '', o); op.value = o; if (o === p.k) op.selected = true; k.appendChild(op); });
      k.onchange = function () { p.k = k.value; };
      var n = el('input'); n.type = 'text'; n.maxLength = 30; n.placeholder = 'お客様の名前'; n.value = p.n || '';
      n.oninput = function () { p.n = n.value; };
      row.appendChild(k); row.appendChild(n); row.appendChild(el('span', 'sama', '様'));
      card.appendChild(row);
    });
    var add = el('button', 'add', '＋ 予定を追加'); add.type = 'button';
    add.onclick = function () { d.plans.push({ k: data.planKinds[0], n: '' }); render(); };
    card.appendChild(add);

    if (!rest) {
      card.appendChild(el('label', 't', '送迎・ヘアメイク'));
      var ch = el('div', 'chips');
      ch.appendChild(chip('送迎 行き(朝) ' + (d.go ? 'あり' : 'なし'), d.go, function () { d.go = !d.go; }));
      ch.appendChild(chip('送迎 帰り ' + (d.back ? 'あり' : 'なし'), d.back, function () { d.back = !d.back; }));
      ch.appendChild(chip('ヘアメイク ' + (d.hair ? 'あり' : 'なし'), d.hair, function () { d.hair = !d.hair; }));
      card.appendChild(ch);

      if (d.go) {
        var s1 = el('div', 'sub');
        s1.appendChild(el('label', 't', '迎えの場所'));
        s1.appendChild(mkSel(data.pickOpts.map(function (o) { return o; }), d.pick || '自宅', null, function (v) { d.pick = v; render(); }));
        if ((d.pick || '自宅') === 'その他') {
          var po = el('input'); po.type = 'text'; po.maxLength = 40; po.placeholder = '場所を書いてください'; po.value = d.pickOther || '';
          po.oninput = function () { d.pickOther = po.value; };
          s1.appendChild(po);
        } else if ((d.pick || '自宅') === '自宅') s1.appendChild(el('p', 'hint', '登録してある住所に迎えに行きます'));
        s1.appendChild(el('label', 't', '到着の希望時刻'));
        s1.appendChild(mkSel(data.arriveOpts, d.arrive || (isT(d.shift) ? d.shift : ''), isT(d.shift) ? null : '出勤時刻に合わせる', function (v) { d.arrive = v; }));
        card.appendChild(s1);
      }
      if (d.back) {
        var s2 = el('div', 'sub');
        s2.appendChild(el('label', 't', '帰りの送り先'));
        s2.appendChild(mkSel(data.dropOpts, d.drop || '自宅', null, function (v) { d.drop = v; render(); }));
        if ((d.drop || '自宅') === 'その他') {
          var dof = el('input'); dof.type = 'text'; dof.maxLength = 40; dof.placeholder = '送り先を書いてください'; dof.value = d.dropOther || '';
          dof.oninput = function () { d.dropOther = dof.value; };
          s2.appendChild(dof);
        }
        var ac = el('div', 'chips'); ac.style.marginTop = '8px';
        ac.appendChild(chip('アフター ' + (d.after ? 'あり' : 'なし'), d.after, function () { d.after = !d.after; }));
        s2.appendChild(ac);
        if (d.after) s2.appendChild(el('p', 'hint', 'アフターの日は 3:00 までの帰りになります'));
        card.appendChild(s2);
      }
      if (d.hair) {
        var s3 = el('div', 'sub');
        s3.appendChild(el('label', 't', 'ヘアメイクの希望時間'));
        s3.appendChild(mkSel(hairChoices(d), d.hairTime, 'おまかせ', function (v) { d.hairTime = v; }));
        var hasPlan = d.plans.some(function (p) { return String(p.n || '').trim(); });
        if (hasPlan) { s3.appendChild(el('span', 'prio', '優先')); s3.appendChild(el('p', 'hint', '同伴・来店予定の日は優先で入れます')); }
        card.appendChild(s3);
      }
    }

    card.appendChild(el('label', 't', '連絡(キャンセル・変更など)'));
    var nt = el('input'); nt.type = 'text'; nt.maxLength = 100; nt.placeholder = '店に伝えたいことがあれば'; nt.value = d.note || '';
    nt.oninput = function () { d.note = nt.value; };
    card.appendChild(nt);
    box.appendChild(card);
  });
}

// 画面の入力は再描画しても保持される (data に持つ)。空の予定行は保存しない (サーバー側でも除く)
var saving = false;
document.getElementById('save').onclick = function () {
  if (saving) return;
  saving = true;
  var btn = this, msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = '保存中…'; msg.className = ''; msg.textContent = '';
  var payload = data.days.map(function (d) {
    return { date: d.date, shift: d.shift, go: d.go, back: d.back, hair: d.hair,
      leave: d.leave, pick: d.pick, pickOther: d.pickOther, arrive: d.arrive, drop: d.drop, dropOther: d.dropOther, after: d.after, hairTime: d.hairTime, note: d.note,
      plans: d.plans.filter(function (p) { return String(p.n || '').trim(); }) };
  });
  google.script.run.withSuccessHandler(function () {
    saving = false; btn.disabled = false; btn.textContent = '保存';
    msg.className = 'ok'; msg.textContent = '保存しました';
    data.days.forEach(function (d) { d.plans = d.plans.filter(function (p) { return String(p.n || '').trim(); }); });
    render();
  }).withFailureHandler(function (e) {
    saving = false; btn.disabled = false; btn.textContent = '保存';
    msg.className = 'ng'; msg.textContent = '保存できませんでした。もう一度押してください。 (' + (e && e.message ? e.message : e) + ')';
  }).savePage(TOKEN, payload);
};
// ホーム画面への追加案内: 端末に合う方だけ出す。閉じたら覚える。ホーム画面から開いた時は出さない
(function () {
  var card = document.getElementById('a2hs');
  var standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var closed = false;
  try { closed = localStorage.getItem('a2hsClosed') === '1'; } catch (e) {}
  if (standalone || closed) return;
  var ua = navigator.userAgent || '';
  var and = /Android/.test(ua);
  var ios = !and && (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
  document.getElementById('a2hsIos').hidden = and && !ios;
  document.getElementById('a2hsAnd').hidden = ios && !and;
  card.hidden = false;
  document.getElementById('a2hsX').onclick = function () {
    card.hidden = true;
    try { localStorage.setItem('a2hsClosed', '1'); } catch (e) {}
  };
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    var go = document.getElementById('a2hsGo');
    go.hidden = false;
    go.onclick = function () { go.hidden = true; ev.prompt(); };
  });
})();
init();
</script>
</body></html>
