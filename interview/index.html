:root{--pri:#1a73e8;--priL:#e8f0fe;--priD:#174ea6}
body{font-family:'Noto Sans JP','Roboto',sans-serif;background:#f0f4f9;color:#202124;font-size:16px;max-width:680px;padding:12px 16px 90px}

.pg>h2{background:#fff;border-top:10px solid var(--pri);border-radius:14px;box-shadow:0 1px 2px rgba(60,64,67,.15);padding:18px;margin:8px 0;font-size:22px}
.item,.card{border:0;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(60,64,67,.15)}
.card{outline:2px solid var(--priL)}

button,.btn{font-family:inherit;border:0;background:transparent;color:var(--pri);border-radius:20px;font-weight:500}
button.pri,.btn.pri{background:var(--pri);color:#fff;border-radius:24px;padding:8px 28px}
button.warn{background:#fce8e6;color:#c5221f}
.chip{border:1px solid #dadce0;background:#fff;color:#3c4043;border-radius:16px;min-height:40px;font-weight:400}
.chip.on{background:var(--priL);border-color:var(--priL);color:var(--priD);font-weight:500}
.chip.on::before{content:'\2713\00a0'}
.prog{background:none!important;position:relative;padding:0 0 12px;font-size:14px;color:#5f6368}
.prog::before,.prog::after{content:'';position:absolute;left:0;bottom:0;height:4px;border-radius:2px}
.prog::before{right:0;background:#dadce0}.prog::after{width:var(--w,0);background:var(--pri)}
.bar{background:rgba(240,244,249,.96);border:0;padding:10px 0}

.badge{background:var(--priL);color:var(--priD)}
.consent{border:0;background:#f8f9fa}
.ferr{color:#d93025}

body.ap{--priD:#048a3c;color:#222;font-size:16px;max-width:560px;padding:12px 16px 100px}

.ap input:focus,.ap select:focus,.ap textarea:focus{border:2px solid var(--pri);padding:7px}
.ap .q label.t{font-weight:700;font-size:16px}

.ap .prog::before{background:#dfe2e6}
.ap .bar{background:rgba(245,246,248,.96);gap:10px}
.ap .nav button{flex:1;min-height:52px;margin:0;border-radius:12px;font-size:17px;font-weight:700}
.ap #pn,.ap button.pri{background:var(--pri);color:#fff;border-radius:12px;padding:8px 16px}
.ap #pb{background:#fff;border:2px solid var(--pri);color:#048a3c}
.ap #pb[style*="hidden"]{display:none}
.ap #sub{min-height:54px;width:100%;border-radius:12px;font-size:18px}
.ap .consent{background:#fff;border:1px solid #e3e5e8;border-radius:12px;font-size:15px}
.ap #photobtn,.ap #gen_chk{background:#fff;border:2px solid var(--pri);color:#048a3c;border-radius:12px;width:100%;min-height:48px;margin:6px 0 0}

.ap .done h2{margin:0 0 12px}

      var c = r[Number(b.getAttribute('data-i'))], stopped = c.state === '停止';
      b.onclick = function () {
        ask(c.name + ' さんへのお断りメールを' + (stopped ? '再開' : '停止') + 'します。よろしいですか？', function () {
          run('setRejectState', [c.id, stopped ? 'resume' : 'stop'], function () { msg(stopped ? '再開しました' : '停止しました'); showReject(); });
        });
      };
    });
  });
}

if (MODE === 'staff' || MODE === 'tainyu') startStaff(); else if (MODE === 'reject') showReject(); else startApply();
</script></body></html>
