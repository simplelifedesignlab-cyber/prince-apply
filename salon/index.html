<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>美容室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.4;background:#fff;color:#1A1A1A;overflow-wrap:anywhere}
button,select,input{font-family:inherit}
.page{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
/* 1 ページ目 */
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px 20px}
.ch h1{margin:0;font-size:30px;font-weight:900;white-space:nowrap}
.ch .r{display:flex;align-items:center;gap:4px}
.tb{height:36px;padding:0 12px;border:1.5px solid #1A1A1A;background:#fff;border-radius:18px;font-size:14px;font-weight:700;cursor:pointer;color:#1A1A1A}
.lg{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.lg span{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:1px 8px}
.lg .ov2{color:#B91C1C;background:#fff;border:1.5px solid #B91C1C;padding:0 7px}
.lg .t{font-size:12px;color:#6B6B6B;background:none;font-weight:400;padding:0;align-self:center}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ECECEC}
.dow div{text-align:center;font-size:12px;font-weight:700;padding:5px 0;color:#6B6B6B}
.dow div:first-child{color:#D92D20}.dow div:last-child{color:#1D5BD8}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(108px,auto);flex-grow:1}
.cell{display:flex;flex-direction:column;gap:2px;padding:3px 2px;border-right:1px solid #F1F1F1;border-bottom:1px solid #F1F1F1;min-width:0;overflow:hidden;background:#fff;cursor:pointer;color:#1A1A1A}
.cell.today{background:#FAFAFA}
.cell .n{display:inline-flex;align-items:center;height:22px;padding-left:4px;font-size:12px;font-weight:700}
.cell.today .n{justify-content:center;width:22px;padding:0;margin-left:2px;border-radius:11px;background:#1A1A1A;color:#fff;font-weight:900}
.bar{display:block;font-size:11px;font-weight:700;line-height:17px;height:17px;padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;color:#fff}
.bar.o{background:#fff!important;color:#B91C1C;box-shadow:inset 0 0 0 1.5px #B91C1C}
.cell.mu .bar{opacity:.45}
.tdyX{position:sticky;bottom:0;margin:8px 12px 14px;min-height:56px;border:0;border-radius:16px;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer;text-align:left;width:calc(100% - 24px)}
.tdy b{font-size:16px;font-weight:700;display:block}
.tdy small{font-size:13px;color:#D0D0D0}
/* 2026-11-26 タブ・当日一覧・週間予約・週間シフト */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}.top h1{margin:0;font-size:26px;font-weight:900}.top .tb{display:inline-flex;align-items:center;text-decoration:none}
.tabs{display:flex;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ECECEC;margin-top:6px}
.tabs button{flex:1;height:48px;border:0;background:#fff;font-size:15px;font-weight:700;color:#6B6B6B;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:#1A1A1A;border-bottom-color:#1A1A1A}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px 20px}.nav b{font-size:20px;font-weight:900}.nav .r{display:flex;align-items:center;gap:4px}
.lh{margin:14px 16px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lh b{font-size:17px;font-weight:900}.lh small{font-size:12px;color:#6B6B6B}
.lr{display:flex;align-items:center;gap:10px;width:100%;min-height:60px;padding:6px 12px 6px 16px;border:0;border-bottom:1px solid #EDEDED;background:#fff;text-align:left;cursor:pointer;color:#1A1A1A;font-size:16px}
.lr .tm{width:46px;flex-shrink:0;font-size:15px;font-weight:700;color:#4A4A4A}
.lr.ovr{background:#FEF2F2}
.lr .go{flex-shrink:0;color:#9A9A9A}
.lnone{padding:14px 16px;font-size:14px;color:#8A8A8A;border-bottom:1px solid #EDEDED}
.wp{margin:10px 0 18px}.wp h3{margin:0;padding:8px 16px 6px;font-size:16px;font-weight:900}.wp h3 small{font-size:12px;color:#6B6B6B;font-weight:400;margin-left:6px}
.dow.mw div:first-child{color:#6B6B6B}.dow.mw div:last-child{color:#D92D20}.dow.mw div:nth-child(6){color:#1D5BD8}
.wp .grid{grid-auto-rows:minmax(96px,auto);flex-grow:0}
.cell .fr{font-size:11px;color:#6B6B6B;padding-left:3px}.cell .sf{font-size:11px;color:#6B6B6B;padding-left:3px}.cell.today .n{background:#1A1A1A}
.sgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ECECEC}
.sd{display:flex;flex-direction:column;gap:3px;min-height:110px;padding:4px 3px;border:0;border-right:1px solid #F1F1F1;border-bottom:1px solid #F1F1F1;background:#fff;cursor:pointer;text-align:left;color:#1A1A1A;min-width:0;overflow:hidden}
.sd:disabled{cursor:default;opacity:.45}
.sd .n{font-size:13px;font-weight:700}.sd.today{background:#FAFAFA}.sd.today .n{color:#fff;background:#1A1A1A;border-radius:11px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.chip{display:block;font-size:12px;font-weight:700;line-height:17px;padding:1px 4px;border-radius:4px;background:#1A1A1A;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip small{font-weight:400;opacity:.8;font-size:10px}
.shnone{font-size:12px;color:#B0B0B0}
.sdt{font-size:13px;color:#6B6B6B;padding:0 20px 8px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #EDEDED}
.srow>b{font-size:16px;font-weight:700}
.sseg{display:flex;gap:6px;flex-wrap:wrap}
.sseg button{min-height:44px;padding:0 12px;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid #CFCFCF;background:#fff;color:#1A1A1A}
.sseg button.on{border:0;background:#1A1A1A;color:#fff}
.rw.hl{box-shadow:inset 0 0 0 2px #1A1A1A;background:#F3F3F3}
@media (max-width:640px){
 .sgrid{display:block}
 .sd{flex-direction:row;align-items:center;gap:10px;min-height:56px;width:100%;border-right:0;padding:6px 16px}
 .sd .n{flex-shrink:0;width:72px}.sd .cs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
}
/* 2 ページ目 */
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 0 4px}
.back{height:44px;display:flex;align-items:center;gap:2px;padding:0 10px;font-size:15px;font-weight:700;color:#1A1A1A;border:0;background:none;cursor:pointer}
.dt{display:flex;align-items:baseline;gap:8px;padding:0 20px 10px;flex-wrap:wrap}
.dt b{font-size:28px;font-weight:900}
.dt span{font-size:13px;color:#6B6B6B}
.cn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px 12px}
.cn div{border-radius:10px;border:1px solid #E5E5E5;padding:6px 8px;display:flex;flex-direction:column}
.cn small{font-size:12px;color:#6B6B6B}.cn b{font-size:20px;font-weight:900}
.rows{border-top:1px solid #EDEDED}
.rw{display:flex;align-items:center;gap:10px;height:var(--rh,64px);padding:0 12px 0 16px;border-bottom:1px solid #EDEDED}
.rw .tm{width:46px;flex-shrink:0;font-size:15px;font-weight:700;color:#4A4A4A}
.rw.ovr{background:#FEF2F2;box-shadow:inset 0 0 0 2px #B91C1C}
.em{flex-grow:1;min-width:0;height:100%;max-height:48px;border-radius:10px;border:1.5px dashed #BDBDBD;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;text-align:left}
.em:disabled{opacity:.5;cursor:default}
.em .l{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.em .l b{font-size:15px;font-weight:700;color:#4A4A4A}
.em .l small{font-size:12px;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.em .p{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#1A1A1A;flex-shrink:0}
.fl{flex-grow:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.fl .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.fl .nm b{font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fl .sb{font-size:12px;color:#6B6B6B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .sb.r{color:#B91C1C;font-weight:700}
.tg{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;flex-shrink:0}
.tg.dou{background:#DBEAFE;color:#1E40AF}.tg.pri{background:#FFE7A3;color:#7A4F00}.tg.sat{background:#EDE9FE;color:#6D28D9}.tg.man{background:#EDEDED;color:#4A4A4A}
.sbtn{flex-shrink:0;min-width:92px;height:44px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.sbtn.s0{border:1.5px solid #1A1A1A;background:#fff;color:#1A1A1A}
.sbtn.s1{border:0;background:#DCFCE7;color:#15803D}
.sbtn.s2{border:0;background:#FEF3C7;color:#B45309}
.msg{padding:26px 16px;text-align:center;font-size:16px;color:#666}
.err{color:#d93025}
.sp{margin:14px 16px 6px;height:52px;border:1.5px solid #1A1A1A;border-radius:14px;background:#fff;font-size:16px;font-weight:700;cursor:pointer;color:#1A1A1A;width:calc(100% - 32px)}
.upd{font-size:13px;color:#8A92A6;text-align:center;margin:10px 0 24px}
.note{font-size:13px;color:#B91C1C;margin:6px 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1A1A;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:90%;z-index:30}
/* 下から開く画面 */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh .t1{font-size:18px;font-weight:900;display:block}
.sh .t2{font-size:13px;color:#6B6B6B;display:block}
.sh .x{background:#F2F2F2}
.sheet label{font-size:13px;font-weight:700;color:#4A4A4A}
.sheet select,.sheet input{height:48px;border-radius:12px;border:1px solid #CFCFCF;background:#fff;padding:0 10px;font-size:16px;width:100%;color:#1A1A1A}
.sheet input{border:1.5px solid #1A1A1A;padding:0 12px}
.sg{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.sg button{height:44px;padding:0 14px;border-radius:22px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid #CFCFCF;background:#fff;color:#1A1A1A}
.sg button.on{border:0;background:#1A1A1A;color:#fff}
.sg .no{font-size:13px;color:#6B6B6B;align-self:center}
.big{height:52px;border:0;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;background:#1A1A1A;color:#fff}
.big:disabled{background:#E4E4E4;color:#6B6B6B;cursor:default}
.dn{height:56px;border:0;border-radius:14px;background:#15803D;color:#fff;font-size:17px;font-weight:900;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.two button{height:52px;border-radius:14px;background:#fff;font-size:16px;font-weight:700;cursor:pointer}
.nsh{color:#B45309;border:1.5px solid #B45309}.cnl{color:#4A4A4A;border:1.5px solid #6B6B6B}
.sm{font-size:12px;color:#6B6B6B}
.rs{height:44px;border:0;background:transparent;color:#4A4A4A;font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer}
.hint{font-size:12px;color:#6B6B6B;margin-top:-4px}
</style></head><body>
<div class="page">
<div id="hd">
  <div class="top"><a class="tb" id="toPortal" href="../staff/" hidden>← 黒服ポータル</a><h1>美容室</h1></div>
  <div class="tabs" id="tabs"><button data-t="list">当日</button><button data-t="week">週間予約</button><button data-t="shift">週間シフト</button></div>
</div>
<!-- 当日 (一覧) -->
<div id="vList" hidden>
  <div class="nav"><b id="lTitle">&nbsp;</b><div class="r"><button class="ib" id="lPrev" aria-label="前の日" style="border:1.5px solid #1A1A1A">‹</button><button class="tb" id="lToday">今日</button><button class="ib" id="lNext" aria-label="次の日" style="border:1.5px solid #1A1A1A">›</button></div></div>
  <div class="cn" id="lCn"></div>
  <div id="lNote"></div>
  <div id="lBody"><div class="msg">読み込み中...</div></div>
  <button class="sp" id="lOpen">この日の予約画面を開く (空き枠・特別枠)</button>
  <div class="upd" id="lUpd"></div>
</div>
<!-- 週間予約 -->
<div id="vWeek" hidden>
  <div class="nav"><b id="wTitle">&nbsp;</b><div class="r"><button class="ib" id="wPrev" aria-label="前の週" style="border:1.5px solid #1A1A1A">‹</button><button class="tb" id="wToday">今週</button><button class="ib" id="wNext" aria-label="次の週" style="border:1.5px solid #1A1A1A">›</button></div></div>
  <div class="lg"><span style="background:#C2410C">19時</span><span style="background:#15803D">20時</span><span style="background:#1D4ED8">21時</span><span style="background:#7C3AED">22時</span><span class="ov2">あふれ</span><span class="t">数字 = 人数 · 日を押すとその日の予約画面</span></div>
  <div id="wNote"></div>
  <div id="wBody"><div class="msg">読み込み中...</div></div>
  <div class="upd" id="wUpd"></div>
</div>
<!-- 週間シフト -->
<div id="vShift" hidden>
  <div class="nav"><b id="sTitle">&nbsp;</b><div class="r"><button class="ib" id="sPrev" aria-label="前の週" style="border:1.5px solid #1A1A1A">‹</button><button class="tb" id="sToday">今週</button><button class="ib" id="sNext" aria-label="次の週" style="border:1.5px solid #1A1A1A">›</button></div></div>
  <div class="sdt">日付を押して、その日に出勤する美容師を選びます (過ぎた日は変えられません)</div>
  <div class="dow mw" id="sDow"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div>
  <div id="sBody"><div class="msg">読み込み中...</div></div>
  <div class="upd" id="sUpd"></div>
</div>
<!-- 2 ページ目: その日の詳細 -->
<div id="vDay" hidden>
  <div class="dh">
    <button class="back" id="dBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg><span id="dBackT">戻る</span></button>
    <div style="display:flex">
      <button class="ib" id="dPrev" aria-label="前の日"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <button class="ib" id="dNext" aria-label="次の日"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
  </div>
  <div class="dt"><b id="dTitle">&nbsp;</b><span id="dSub"></span></div>
  <div class="cn"><div><small>予約</small><b id="nB">-</b></div><div><small style="color:#15803D">対応済</small><b id="nD">-</b></div><div><small style="color:#B45309">来なかった</small><b id="nN">-</b></div><div><small>空き</small><b id="nF">-</b></div></div>
  <div id="dNote"></div>
  <div class="rows" id="dRows"><div class="msg">読み込み中...</div></div>
  <button class="sp" id="dSpecial" hidden>特別枠 (撮影など・時刻を選んで入れる)</button>
  <div class="upd" id="dUpd"></div>
</div>
</div>
<!-- 空きに入れる -->
<div class="ov" id="ovAdd" hidden><div class="sheet" id="shAdd" role="dialog" aria-modal="true">
  <div class="sh"><span class="t1" id="aTitle"></span><button class="ib x" id="aClose" aria-label="閉じる"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
  <div id="aTimeBox" hidden><label for="aTime">時刻 (15:00 から 30 分きざみ)</label><select id="aTime"></select></div>
  <label for="aStore">店舗</label><select id="aStore"></select>
  <label for="aName">名前 (最初の文字を打つと候補が出ます)</label><input id="aName" placeholder="例: あ" autocomplete="off" maxlength="30">
  <div class="sg" id="aSug"></div>
  <label for="aPlan">予定</label><select id="aPlan"><option>なし</option><option>同伴</option><option>優先</option><option>撮影</option></select>
  <div id="aFeeBox" hidden><label for="aFee">美容室費</label><select id="aFee"><option>無料</option><option>有料</option></select><div class="hint" id="aFeeH"></div></div>
  <button class="big" id="aOk" disabled>名前を選ぶと確定できます</button>
</div></div>
<!-- 対応を記録 -->
<div class="ov" id="ovSt" hidden><div class="sheet" id="shSt" role="dialog" aria-modal="true">
  <div class="sh"><span><span class="t1" id="sName"></span><span class="t2" id="sSub"></span></span><button class="ib x" id="sClose" aria-label="閉じる"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
  <label for="sSty">担当</label><select id="sSty"></select>
  <div class="hint" id="sHint"></div>
  <button class="dn" id="sDone">対応した</button>
  <div class="two"><button class="nsh" id="sNo">来なかった</button><button class="cnl" id="sCancel">キャンセル</button></div>
  <span class="sm">キャンセルにすると、この枠は空きに戻り、ほかの子を入れられます。</span>
  <button class="rs" id="sReset">未対応に戻す</button>
</div></div>
<!-- 出勤する美容師を選ぶ -->
<div class="ov" id="ovSh" hidden><div class="sheet" id="shSh" role="dialog" aria-modal="true">
  <div class="sh"><span><span class="t1" id="shT"></span><span class="t2">出勤する美容師を選びます (場所を押す・もう一度押すと取り消し)</span></span><button class="ib x" id="shClose" aria-label="閉じる"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
  <div id="shBody"></div>
  <button class="big" id="shOk">決定</button>
</div></div>
<div class="toast" id="toast" hidden></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyAasZtWwNfYKyYRbV41yncBNdbBrtXHzcXknU-aG6-xHuo7xWtdg8NoxWDxhkwTzBq/exec";
var STORES = [{id:'RegentClub千歳',s:'RC千歳'},{id:'328',s:'328'},{id:'WAVE千歳',s:'WAVE千歳'},{id:'花もみじ千歳',s:'花もみじ千歳'}];
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// 鍵なし (2026-11-26 H)。黒服ポータルから来た時 (?as=staff) だけ、黒服の鍵 (ivKey・同じ origin の localStorage) を付ける = 「入れた人」が 黒服 になる。鍵は URL にも画面にも出さない
var KEY='', VIA='';
try{
  var u0=new URL(location.href),a0=u0.searchParams.get('as'),ch=false;
  if(u0.searchParams.get('k')){u0.searchParams.delete('k');ch=true;} // 古い URL の ?k= は読み捨てる
  if(a0==='staff'){try{sessionStorage.setItem('salonAs','staff');}catch(e){}u0.searchParams.delete('as');ch=true;}
  if(ch)history.replaceState(null,'',u0.pathname+u0.search+u0.hash);
  try{VIA=sessionStorage.getItem('salonAs')==='staff'?'staff':'';}catch(e){}
  if(VIA==='staff')KEY=localStorage.getItem('ivKey')||'';
}catch(e){}
if(VIA==='staff')$('toPortal').hidden=false;
function api(fn,args){
  return fetch(EXEC,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],k:KEY})}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.needKey)throw new Error('読み込めませんでした (黒服の鍵が古い可能性があります。黒服ポータルを開き直してください)');
    if(!j||!j.ok)throw new Error(j&&j.error||'失敗しました');return j.result;});
}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
var DOWS=['日','月','火','水','木','金','土'];
var HC={19:'#C2410C',20:'#15803D',21:'#1D4ED8',22:'#7C3AED'}, HCX='#475569';
var SHORT={};STORES.forEach(function(s){SHORT[s.id]=s.s;});
function bizLocal(){return ymd(new Date(Date.now()-5*3600000));} // 朝 5 時までは前の日 (サーバーの today が来るまでの仮)
var today=bizLocal(), daySeq=0, day='', dayData=null, pushed=false, busy=false, list=[], focusKey='', tab='list';
function monOfS(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function mdw(s){var p=parse(s);return (p.getMonth()+1)+'/'+p.getDate()+' ('+DOWS[p.getDay()]+')';}
function entKey(e){return [e.place,e.time,e.store,e.gen,e.special?'s':''].join('|');}
function placeShort(p){return String(p||'').replace(/千歳|店内/g,'').replace(/\s+/g,'');}
function sErr(id,e){$(id).innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>';}

// ---------- 当日 (一覧) ----------
// 2026-11-26 H: 出勤簿のように、その日の予約が上から一覧で出る。行を押すと 予約画面 (対応した・来なかった・担当) へ。並びは 時刻 → 同伴 → 優先 (来店) → 店番
var listDay='', listData=null, listSeq=0;
function rankOf(e){return e.tag==='同伴'?0:e.tag==='優先'?1:2;}
function storeIdx(e){for(var i=0;i<STORES.length;i++)if(STORES[i].id===e.store)return i;return 9;}
function sortE(a,b){return a.time<b.time?-1:a.time>b.time?1:rankOf(a)-rankOf(b)||storeIdx(a)-storeIdx(b)||(a.gen<b.gen?-1:a.gen>b.gen?1:0);}
function loadList(){
  var my=++listSeq;if(!listDay)listDay=today;
  $('lTitle').textContent=mdw(listDay)+(listDay===today?' 今日':'');
  $('lBody').innerHTML='<div class="msg">読み込み中...</div>';
  api('getSalonSlots',[listDay]).then(function(r){if(my!==listSeq)return;listData=r;today=r.today||today;renderList();}).catch(function(e){if(my===listSeq)sErr('lBody',e);});
}
function lineHtml(e,i,multiPlace){
  var tags='';
  if(e.tag)tags+='<span class="tg '+(e.tag==='同伴'?'dou':e.tag==='優先'?'pri':'sat')+'">'+esc(e.tag==='優先'?'来店':e.tag)+'</span>';
  if(e.manual)tags+='<span class="tg man">手入力</span>';
  var sub=[SHORT[e.store]||e.store||''];
  sub.push(e.entry==='キャスト'?'希望時間':e.entry+'入力');
  if(e.tag==='撮影'&&e.fee)sub.push('美容室費 '+e.fee);
  if(e.by&&e.status==='済')sub.push('担当 '+e.by);
  var st=stLabel(e.status);
  return '<button type="button" class="lr'+(e.over?' ovr':'')+'" data-i="'+i+'"><span class="tm">'+esc(e.time)+'</span><span class="fl"><span class="nm"><b>'+esc(e.gen)+'</b>'+tags+'</span><span class="sb'+(e.over?' r':'')+'">'+(e.over?'定員を超えています · ':'')+esc(sub.join(' · '))+'</span></span><span class="sbtn '+st[0]+'" style="cursor:inherit">'+st[1]+'</span><svg class="go" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>';
}
function renderList(){
  var r=listData,h='',ll=[];
  $('lUpd').textContent='最終更新 '+r.updated;
  $('lNote').innerHTML=r.error?'<div class="note">枠を読み込めませんでした: '+esc(r.error)+'</div>':'';
  $('lOpen').textContent=r.canBook?'この日の予約画面を開く (空き枠・特別枠)':'この日の予約画面を開く';
  $('lCn').innerHTML='<div><small>予約</small><b>'+r.counts.booked+'</b></div><div><small style="color:#15803D">対応済</small><b>'+r.counts.done+'</b></div><div><small style="color:#B45309">来なかった</small><b>'+r.counts.noshow+'</b></div><div><small>空き</small><b>'+r.counts.free+'</b></div>';
  if(!r.reserve){$('lBody').innerHTML='<div class="msg">予約はまだ始まっていません</div>';return;}
  var groups=r.places.map(function(pl){return {name:pl.place,staff:pl.staff,items:[]};}),spx=[];
  r.rows.forEach(function(e){
    if(e.kind!=='booked')return;
    var g=null;groups.forEach(function(x){if(x.name===e.place)g=x;});
    if(!g){g={name:e.place,staff:0,items:[]};groups.push(g);}
    g.items.push(e);
  });
  r.special.forEach(function(e){spx.push(e);});
  groups.forEach(function(g){
    var duty=(r.onDuty||[]).filter(function(x){return x.place===g.name;}).map(function(x){return x.name+' '+x.start+'-'+x.end;}).join('、');
    h+='<div class="lh"><b>'+esc(g.name)+'</b><small>美容師 '+g.staff+' 人'+(duty?' · 出勤 '+esc(duty):'')+' · 予約 '+g.items.length+'</small></div>';
    if(!g.items.length)h+='<div class="lnone">予約はありません</div>';
    g.items.sort(sortE).forEach(function(e){ll.push(e);h+=lineHtml(e,ll.length-1);});
  });
  if(spx.length){
    h+='<div class="lh"><b>特別枠 (撮影など)</b><small>予約 '+spx.length+'</small></div>';
    spx.sort(sortE).forEach(function(e){ll.push(e);h+=lineHtml(e,ll.length-1);});
  }
  if(!groups.length&&!spx.length)h='<div class="msg">表示する枠がありません</div>';
  $('lBody').innerHTML=h;
  [].forEach.call($('lBody').querySelectorAll('.lr'),function(b){b.onclick=function(){var e=ll[+b.getAttribute('data-i')];focusKey=entKey(e);openDay(listDay);};});
}
$('lPrev').onclick=function(){listDay=shift(listDay||today,-1);loadList();};
$('lNext').onclick=function(){listDay=shift(listDay||today,1);loadList();};
$('lToday').onclick=function(){listDay=today;loadList();};
$('lOpen').onclick=function(){focusKey='';openDay(listDay||today);};

// ---------- 週間予約 ----------
// 場所ごとの 1 週間 (月〜日) を、下へ縦に並べる。日を押すとその日の予約画面
var weekFrom='', weekData=null, weekSeq=0;

  var my=++weekSeq;if(!weekFrom)weekFrom=monOfS(today);

  r.places.forEach(function(pl){
    h+='<div class="wp"><h3>'+esc(pl.place)+'<small>'+esc((pl.stores||[]).map(function(x){return SHORT[x]||x;}).join('・'))+'</small></h3><div class="dow mw"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div><div class="grid">';

      h+='<div class="cell'+(d===r.today?' today':'')+'" data-d="'+d+'" role="button" tabindex="0" aria-label="'+esc(pl.place)+' '+p.getDate()+'日 '+x.n+'人'+(over?' あふれあり':'')+'"><span class="n">'+p.getDate()+'</span>'+bars+'<span class="sf">'+(x.staff?'美容師 '+x.staff+' 人':'休み')+'</span>'+(r.reserve===false?'':'<span class="fr">空き '+x.free+'</span>')+'</div>';
    }
    h+='</div></div>';
  });
  if(!r.places.length)h='<div class="msg">場所が登録されていません</div>';
  $('wBody').innerHTML=h;
  $('wUpd').textContent='最終更新 '+r.updated;
  [].forEach.call($('wBody').querySelectorAll('.cell'),function(el){
    var go=function(){focusKey='';openDay(el.getAttribute('data-d'));};

$('wPrev').onclick=function(){weekFrom=shift(weekFrom,-7);loadWeek();};
$('wNext').onclick=function(){weekFrom=shift(weekFrom,7);loadWeek();};
$('wToday').onclick=function(){weekFrom=monOfS(today);loadWeek();};

// ---------- 週間シフト ----------
// 日付を押す -> 出勤する美容師が自分の名前を選ぶ (他の人の分も触れる)。時刻は場所のふだんの時刻 (すでに入っている人の時刻は変えない)
var shFrom='', shData=null, shSeq=0, shDay='', shDraft={}, shSaving=false;
function loadShift(){
  var my=++shSeq;if(!shFrom)shFrom=monOfS(today);
  $('sTitle').textContent=mdw(shFrom).replace(/ \(.\)/,'')+' 〜 '+mdw(shift(shFrom,6)).replace(/ \(.\)/,'');
  $('sBody').innerHTML='<div class="msg">読み込み中...</div>';
  api('getHairShiftBoard',[shFrom]).then(function(r){if(my!==shSeq)return;shData=r;today=r.today||today;renderShift();}).catch(function(e){if(my===shSeq)sErr('sBody',e);});
}
function renderShift(){
  var r=shData,h='<div class="sgrid">';
  for(var i=0;i<7;i++){
    var d=shift(r.from,i),p=parse(d),past=d<r.today,cs=(r.days[d]||[]).slice().sort(function(a,b){return a.place<b.place?-1:a.place>b.place?1:a.name<b.name?-1:1;});
    var chips=cs.length?cs.map(function(x){return '<span class="chip">'+esc(x.name)+' <small>'+esc(placeShort(x.place))+'</small></span>';}).join(''):'<span class="shnone">入力なし</span>';
    h+='<button type="button" class="sd'+(d===r.today?' today':'')+'" data-d="'+d+'"'+(past?' disabled':'')+'><span class="n">'+(p.getDate())+'<span style="font-weight:400;font-size:12px;color:#6B6B6B"> ('+DOWS[p.getDay()]+')</span></span><span class="cs" style="display:flex;flex-direction:column;gap:3px;min-width:0">'+chips+'</span></button>';
  }
  $('sBody').innerHTML=h+'</div>';
  $('sUpd').textContent='最終更新 '+r.updated;
  [].forEach.call($('sBody').querySelectorAll('.sd'),function(el){el.onclick=function(){openSh(el.getAttribute('data-d'));};});
}
function openSh(d){
  shDay=d;shDraft={};
  (shData.days[d]||[]).forEach(function(x){shDraft[x.name]=x.place;});
  $('shT').textContent=mdw(d)+' の出勤';
  drawSh();$('ovSh').hidden=false;
}
function drawSh(){
  var r=shData,h='';
  if(!r.stylists.length)h='<div class="msg">美容師が未登録です (Prince App の「美容師」タブに名前と有効のチェックを入れてください)</div>';
  r.stylists.forEach(function(n,i){
    h+='<div class="srow"><b>'+esc(n)+'</b><div class="sseg">'+r.places.map(function(pl,j){return '<button type="button" data-n="'+i+'" data-p="'+j+'"'+(shDraft[n]===pl.place?' class="on"':'')+'>'+esc(placeShort(pl.place))+'</button>';}).join('')+'<button type="button" data-n="'+i+'" data-p="-1"'+(shDraft[n]?'':' class="on"')+'>休み</button></div></div>';
  });
  $('shBody').innerHTML=h;
  [].forEach.call($('shBody').querySelectorAll('button'),function(b){b.onclick=function(){
    var n=r.stylists[+b.getAttribute('data-n')],j=+b.getAttribute('data-p');
    if(j<0)delete shDraft[n];else shDraft[n]=r.places[j].place;
    drawSh();
  };});
  $('shOk').disabled=shSaving||!r.stylists.length;$('shOk').textContent=shSaving?'反映中...':'決定';
}
$('shOk').onclick=function(){
  if(shSaving)return;shSaving=true;drawSh();
  var as=Object.keys(shDraft).map(function(n){return {name:n,place:shDraft[n]};});
  api('setHairShiftDay',[shDay,as]).then(function(r){shData=r;shSaving=false;$('ovSh').hidden=true;renderShift();toast('反映しました');}).catch(function(e){shSaving=false;drawSh();window.alert(e.message||e);});
};
$('shClose').onclick=function(){$('ovSh').hidden=true;};
$('ovSh').onclick=function(e){if(e.target===$('ovSh'))$('ovSh').hidden=true;};
$('sPrev').onclick=function(){shFrom=shift(shFrom,-7);loadShift();};
$('sNext').onclick=function(){shFrom=shift(shFrom,7);loadShift();};
$('sToday').onclick=function(){shFrom=monOfS(today);loadShift();};

// ---------- 画面の切り替え ----------
// #d=日付 = その日の予約画面 / #t=list|week|shift = タブ (何も無ければ 当日)
function openDay(d){pushed=true;history.pushState(null,'','#d='+d);route();}
function setTab(t){history.replaceState(null,'',location.pathname+location.search+'#t='+t);route();}
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){setTab(b.getAttribute('data-t'));};});
function route(){
  var m=/^#d=(\d{4}-\d{2}-\d{2})$/.exec(location.hash),t=/^#t=(list|week|shift)$/.exec(location.hash);
  closeSheets();$('ovSh').hidden=true;
  ['vList','vWeek','vShift','vDay'].forEach(function(id){$(id).hidden=true;});
  if(m){$('hd').hidden=true;$('vDay').hidden=false;day=m[1];window.scrollTo(0,0);loadDay();return;}
  tab=t?t[1]:'list';
  $('hd').hidden=false;
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.className=b.getAttribute('data-t')===tab?'on':'';});
  $(tab==='list'?'vList':tab==='week'?'vWeek':'vShift').hidden=false;
  if(tab==='list')loadList();else if(tab==='week')loadWeek();else loadShift();
}
window.addEventListener('popstate',route);
$('dBack').onclick=function(){if(pushed){pushed=false;history.back();}else{history.replaceState(null,'',location.pathname+location.search+'#t=list');route();}};
function stepDay(n){day=shift(day,n);history.replaceState(null,'',location.pathname+location.search+'#d='+day);loadDay();}
$('dPrev').onclick=function(){stepDay(-1);};
$('dNext').onclick=function(){stepDay(1);};
function loadDay(){
  var my=++daySeq, p=parse(day);
  $('dTitle').textContent=(p.getMonth()+1)+'/'+p.getDate()+' '+DOWS[p.getDay()];
  $('dRows').innerHTML='<div class="msg">読み込み中...</div>';
  api('getSalonSlots',[day]).then(function(r){if(my===daySeq)renderDay(r);}).catch(function(e){if(my===daySeq)$('dRows').innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>';});
}
function stLabel(s){return s==='済'?['s1','対応済']:s==='来ず'?['s2','来なかった']:['s0','未対応'];}
function renderDay(r){
  dayData=r;today=r.today||today;
  var multi=r.places.length>1, staffN=0;r.places.forEach(function(p){staffN+=p.staff;});
  var duty=(r.onDuty||[]).map(function(x){return x.name+' '+x.start+'-'+x.end;}).join('、'), sub0=r.reserve&&r.places.length?'美容師 '+staffN+' 人 · 1 時間 最大 '+r.hourCap+' 人':'';
  $('dSub').textContent=sub0+(duty?(sub0?' · ':'')+'出勤 '+duty:''); // 出勤の美容師 (美容師シフト・表示だけ 2026-11-21)
  $('nB').textContent=r.counts.booked;$('nD').textContent=r.counts.done;$('nN').textContent=r.counts.noshow;$('nF').textContent=r.counts.free;
  $('dNote').innerHTML=r.error?'<div class="note">枠を読み込めませんでした: '+esc(r.error)+'</div>':'';
  $('dUpd').textContent='最終更新 '+r.updated;
  $('dSpecial').hidden=!(r.reserve&&r.canBook);
  list=r.special.concat(r.rows);
  if(!r.reserve){$('dRows').innerHTML='<div class="msg">予約はまだ始まっていません</div>';return;}
  if(!list.length){$('dRows').innerHTML='<div class="msg">'+(r.canBook?'この日は美容師の出勤がありません':'この日の枠はありません (予約できるのは今日から 14 日先まで)')+'</div>';return;}
  var h='';
  list.forEach(function(e,i){
    if(e.kind==='free'){
      h+='<div class="rw"><span class="tm">'+esc(e.time)+'</span><button class="em" data-i="'+i+'"'+(r.canBook?'':' disabled')+'><span class="l"><b>空き</b>'+((e.note||multi)?'<small>'+(e.note?esc(e.note)+' さんはキャンセル':'')+(e.note&&multi?' · ':'')+(multi?esc(e.place):'')+'</small>':'')+'</span>'+
        (r.canBook?'<span class="p"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>入れる</span>':'')+'</button></div>';
      return;
    }
    var tags='';
    if(e.tag)tags+='<span class="tg '+(e.tag==='同伴'?'dou':e.tag==='優先'?'pri':'sat')+'">'+esc(e.tag)+'</span>';
    if(e.manual)tags+='<span class="tg man">手入力</span>';
    var sub=[];
    if(e.special)sub.push('特別枠');
    sub.push(SHORT[e.store]||e.store||'');
    if(multi&&!e.special)sub.push(e.place);
    if(e.tag==='撮影'&&e.fee)sub.push('美容室費 '+e.fee);
    if(e.by&&e.status==='済')sub.push('担当 '+e.by);
    if(e.manual)sub.push('入れた人 '+e.entry);
    var st=stLabel(e.status);
    h+='<div class="rw'+(e.over?' ovr':'')+'" data-k="'+esc(entKey(e))+'"><span class="tm">'+esc(e.time)+'</span><div class="fl"><span class="nm"><b>'+esc(e.gen)+'</b>'+tags+'</span>'+
      '<span class="sb'+(e.over?' r':'')+'">'+(e.over?'定員を超えています · ':'')+esc(sub.join(' · '))+'</span></div>'+
      '<button class="sbtn '+st[0]+'" data-i="'+i+'" aria-label="'+esc(e.gen)+' の対応を記録">'+st[1]+'</button></div>';
  });
  $('dRows').innerHTML=h;
  fitRows();
  if(focusKey){ // 一覧から来た時: 押した行を目立たせて見える所へ
    [].forEach.call(document.querySelectorAll('#dRows .rw[data-k]'),function(el){if(el.getAttribute('data-k')===focusKey){el.classList.add('hl');el.scrollIntoView({block:'center'});}});
    focusKey='';
  }
  [].forEach.call(document.querySelectorAll('#dRows .em'),function(el){el.onclick=function(){openAdd(list[+el.getAttribute('data-i')],false);};});
  [].forEach.call(document.querySelectorAll('#dRows .sbtn'),function(el){el.onclick=function(){openSt(list[+el.getAttribute('data-i')]);};});
}
// 1 画面に収まるように行の高さを決める (48〜64px)
function fitRows(){
  var n=document.querySelectorAll('#dRows .rw').length;if(!n)return;
  var top=$('dRows').getBoundingClientRect().top+window.pageYOffset, avail=window.innerHeight-top-110, rh=Math.max(48,Math.min(64,Math.floor(avail/n)));
  $('dRows').style.setProperty('--rh',rh+'px');
}
window.addEventListener('resize',fitRows);
var toastT=0;
// 【注意】で始まる返事 (給料引き(日別)の更新失敗など) は 3.5 秒で消えるトーストにせず、アラートで止めて見せる
function toast(m){if(!m)return;if(m.indexOf('【注意】')>=0)window.alert(m);var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3500);}
// 書き込みは 1 つずつ。終わったら返ってきた最新の一覧で描き直す (一覧に戻った時は取り直す)
function act(fn){
  if(busy)return;
  busy=true;document.body.style.opacity='.6';
  fn().then(function(r){if(r&&r.rows){closeSheets();renderDay(r);toast(r.msg);}}).catch(function(e){window.alert(e.message||e);}).then(function(){busy=false;document.body.style.opacity='';});
}
function closeSheets(){$('ovAdd').hidden=true;$('ovSt').hidden=true;}

// ---------- 空きに入れる ----------
var add={slot:null,special:false,picked:null}, castAll=null, castLoading=false, castErr='';
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96);}).replace(/\s+/g,'');}
$('aStore').innerHTML='<option value="">店舗を選ぶ (全部から探す)</option>'+STORES.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.s)+'</option>';}).join('');
(function(){var o='';for(var m=15*60;m<=22*60+30;m+=30)o+='<option>'+pad(Math.floor(m/60))+':'+pad(m%60)+'</option>';$('aTime').innerHTML=o;})();
function openAdd(slot,special){
  add={slot:slot,special:special,picked:null};
  $('aTitle').textContent=special?'特別枠に入れる':slot.time+' の空きに入れる';
  $('aTimeBox').hidden=!special;$('aStore').value='';$('aName').value='';$('aPlan').value='なし';$('aFee').value='無料';
  planChange();renderSug();$('ovAdd').hidden=false;
  if(!castAll&&!castLoading){
    castLoading=true;castErr='';
    api('getSalonCastAll',[]).then(function(r){castAll=r.casts;castLoading=false;renderSug();}).catch(function(e){castLoading=false;castErr=String(e&&e.message||e);renderSug();});
  }
}
function planChange(){
  var s=$('aPlan').value==='撮影';$('aFeeBox').hidden=!s;
  $('aFeeH').textContent=$('aFee').value==='無料'?'無料の予約は「対応した」にしても給料引きに載りません':'有料は今の済と同じく給料引きに載ります';
}
function renderSug(){
  var q=norm($('aName').value), st=$('aStore').value, pool=(castAll||[]).filter(function(c){return !st||c.store===st;});
  var hits=q?pool.filter(function(c){return norm(c.gen).indexOf(q)===0;}):pool, h='';
  if(!castAll&&castErr)h='<span class="no">名前の一覧を読み込めませんでした: '+esc(castErr)+'</span>';
  else if(!castAll)h='<span class="no">名前の一覧を読み込み中...</span>';
  else if(!hits.length)h='<span class="no">合う名前がありません</span>';
  else hits.slice(0,8).forEach(function(c,i){
    var on=add.picked&&add.picked.store===c.store&&add.picked.gen===c.gen;
    h+='<button type="button" data-k="'+esc(c.store)+'|'+esc(c.gen)+'"'+(on?' class="on"':'')+'>'+esc(c.gen)+(st?'':' · '+esc(SHORT[c.store]||c.store))+'</button>';
  });
  $('aSug').innerHTML=h;
  [].forEach.call(document.querySelectorAll('#aSug button'),function(b){b.onclick=function(){
    var k=b.getAttribute('data-k').split('|');add.picked={store:k[0],gen:k.slice(1).join('|')};$('aName').value=add.picked.gen;renderSug();
  };});
  var p=add.picked;
  $('aOk').disabled=!p;$('aOk').textContent=p?p.gen+' ('+(SHORT[p.store]||p.store)+') で確定':'名前を選ぶと確定できます';
}
$('aStore').onchange=function(){add.picked=null;renderSug();};
$('aName').oninput=function(){add.picked=null;renderSug();};
$('aPlan').onchange=planChange;$('aFee').onchange=planChange;
$('aClose').onclick=closeSheets;
$('ovAdd').onclick=function(e){if(e.target===$('ovAdd'))closeSheets();};
$('aOk').onclick=function(){
  var p=add.picked;if(!p)return;
  var plan=$('aPlan').value, fee=plan==='撮影'?$('aFee').value:'';
  act(function(){return api('bookSalonManual',[day,add.special?'':add.slot.place,add.special?$('aTime').value:add.slot.time,p.store,p.gen,'',plan,fee,add.special]);});
};
$('dSpecial').onclick=function(){openAdd(null,true);};

// ---------- 対応を記録 ----------
var cur=null;
function openSt(e){
  cur=e;
  $('sName').textContent=e.gen;
  $('sSub').textContent=e.time+' · '+(SHORT[e.store]||e.store)+(e.special?' · 特別枠':'');
  var names=dayData.stylists||[], def=e.by||lsGet('salonStylist')||'';
  if(names.indexOf(def)<0)def='';
  $('sSty').innerHTML='<option value="">担当を選ぶ</option>'+names.map(function(n){return '<option'+(n===def?' selected':'')+'>'+esc(n)+'</option>';}).join('');
  var free=e.tag==='撮影'&&e.fee==='無料';
  $('sHint').textContent=free?'撮影 (美容室費 無料): 給料引きには載りません。美容師の人数には数えるので、担当を選んでください':(names.length?'':'美容師が未登録です (Prince App の「美容師」タブに名前と有効のチェックを入れてください)');
  $('ovSt').hidden=false;
}
function doSt(a){
  if(!cur)return;
  var sty=$('sSty').value, free=cur.tag==='撮影'&&cur.fee==='無料';
  if(a==='done'&&!sty){window.alert('先に担当の美容師を選んでください');return;}
  if(a==='cancel'&&!window.confirm(cur.gen+' さんをキャンセルします。この枠は空きに戻ります。よろしいですか？'))return;
  var e=cur;
  if(a==='done'&&sty)lsSet('salonStylist',sty);
  act(function(){return api('setSalonSlot',[day,e.place,e.time,e.store,e.gen,a,sty]);});
}
$('sDone').onclick=function(){doSt('done');};
$('sNo').onclick=function(){doSt('noshow');};
$('sCancel').onclick=function(){doSt('cancel');};
$('sReset').onclick=function(){doSt('reset');};
$('sClose').onclick=closeSheets;
$('ovSt').onclick=function(e){if(e.target===$('ovSt'))closeSheets();};

route();
</script>
</body></html>
