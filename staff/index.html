<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2A44">
<title>黒服ポータル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--pri:#1F2A44;--priD:#2E4372;--priL:#E6E9F0;--pink:#2E4372;--pinkL:#E6E9F0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.5;background:#F4F5F7;color:#111;overflow-wrap:anywhere}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;flex:1}
#back{min-height:44px;font-size:16px;font-weight:700;background:#fff;color:var(--priD);border:0;border-radius:22px;padding:6px 14px;font-family:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 60px}
.upd{font-size:13px;color:#777;text-align:center;margin:14px 0}
.big{display:block;width:100%;min-height:76px;font-size:21px;font-weight:700;margin:0 0 12px;border:0;border-radius:16px;background:#fff;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.1);font-family:inherit;cursor:pointer;text-align:left;padding:10px 18px;border-left:10px solid var(--pri);text-decoration:none}
.big small{display:block;font-size:14px;font-weight:400;color:#777}
.big.pk{border-left-color:var(--pink)}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.st{min-height:60px;font-size:18px;font-weight:700;border:2px solid var(--pri);border-radius:14px;background:#fff;color:var(--priD);font-family:inherit;cursor:pointer}
.st.on{background:var(--pri);color:#fff}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;font-size:15px}
.st img{display:block;width:100%;height:52px;object-fit:contain;background:#fff;border-radius:8px}
.card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:8px;margin:8px 0}
.nav .t{flex:1;text-align:center;font-weight:700;font-size:17px}
.nb{min-height:44px;min-width:60px;font-size:16px;font-weight:700;border:1px solid #C3C8D1;border-radius:12px;background:#fff;font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin:8px 0}
.tab{flex:1;min-height:48px;font-size:17px;font-weight:700;border:2px solid var(--pink);border-radius:12px;background:#fff;color:#1F2A44;font-family:inherit;cursor:pointer}
.tab.on{background:var(--pink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.dy{min-height:56px;font-size:14px;border:1px solid #C3C8D1;border-radius:10px;background:#fff;font-family:inherit;cursor:pointer;line-height:1.3}
.dy.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #e1e4e8;padding:4px 3px;text-align:center;white-space:nowrap}
th{background:var(--priL);position:sticky;top:0}
td.nm{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.c-abs{background:#f8c9c9;color:#b71c1c;font-weight:700}.c-off{background:#e0e0e0;color:#777}.c-und{background:#fff3b0}.c-on{background:#d8f7e3;font-weight:700}
.c-miss{outline:2px solid #e53935;outline-offset:-2px;color:#e53935;font-weight:700}
tr.sum td{background:var(--pinkL);font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #eee;font-size:17px}
.row:last-child{border:0}
.row .s{font-size:14px;color:#666}
.pri{background:var(--pinkL)}
.tag{display:inline-block;background:var(--pink);color:#fff;border-radius:10px;padding:0 8px;font-size:13px;font-weight:700;margin-left:6px}
.cnt{font-size:20px;font-weight:700;color:var(--priD);margin:6px 0}
.bars{display:flex;align-items:flex-end;gap:2px;height:130px;margin:10px 0 2px;border-bottom:2px solid #ccc}
.bar{flex:1;background:var(--pri);min-width:3px;border-radius:3px 3px 0 0}
.grp{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;min-width:0}
.grp .bar{min-width:1px;border-radius:2px 2px 0 0}
.grp .b1{background:var(--pri)}.grp .b2{background:var(--pink)}
.lg{display:flex;gap:14px;font-size:13px;color:#555;margin:8px 0 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sm{font-size:16px;font-weight:700;margin:2px 0;line-height:1.7}
.sm span{white-space:nowrap}
.note{font-size:12px;color:#777;margin:6px 0 0}
.bl{display:flex;justify-content:space-between;font-size:12px;color:#777}
.msg{padding:30px 10px;text-align:center;font-size:18px;color:#666}
.err{color:#d93025}
.rk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee;font-size:18px}
.rk b{width:34px;height:34px;border-radius:50%;background:var(--priL);color:var(--priD);display:flex;align-items:center;justify-content:center;flex:none}
.rk:nth-child(-n+3) b{background:var(--pink);color:#fff}
.rk span{flex:1}.rk em{font-style:normal;font-weight:700}
.lk{cursor:pointer}tr.lk td.nm{color:#1F2A44}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:12px 4px 4px}.hd b{font-size:22px}.hd span{font-size:14px;color:#777}
.sec{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.sec h3{margin:0;padding:9px 14px;font-size:14px;color:#1F2A44;background:var(--pinkL)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #f1f1f1;font-size:16px}
.li span small{display:block;font-size:12px;color:#888}
.li b{white-space:nowrap}
.li.tot{background:#fafafa}.li.tot b{color:#1F2A44}
.li.big2 b{font-size:24px;color:#1F2A44}
.sec.net h3{background:var(--pink);color:#fff}
details.pay{margin:10px 0}details.pay summary{cursor:pointer;font-weight:700;padding:10px 4px;color:#1F2A44}
/* ===== 2026-10-31 スタイリッシュ案: 白と細線・影なし・小さめの角丸 ===== */
header{padding:10px 16px 12px}
header .ht{flex:1;min-width:0}
header .en{font-size:10px;letter-spacing:.32em;color:#AEB7CC;line-height:1.4}
header h1{font-size:16px;font-weight:500;letter-spacing:.06em}
#back{border-radius:4px;font-size:14px;font-weight:500;min-height:40px}
.card,.sec{border-radius:6px;box-shadow:none;border:1px solid #E3E6EC}
.sec h3{font-size:11px;font-weight:500;letter-spacing:.14em;color:#5A6275}
.st{border-radius:4px;border-width:1px;font-weight:500}
.tab{border-radius:4px;border-width:1px;font-weight:500}
.nb,.dy{border-radius:4px}
th{font-size:11px;letter-spacing:.14em;color:#5A6275;font-weight:500}
th,td{border-color:#E3E6EC}
.row,.rk,.li{border-color:#EEF0F4}
.upd{color:#8A92A6}
#app{counter-reset:menu}
.big{counter-increment:menu;position:relative;min-height:64px!important;font-size:16px!important;font-weight:500;margin:0!important;width:100%!important;border:0;border-bottom:1px solid #EEF0F4;border-radius:0;box-shadow:none;background:#fff;padding:10px 44px 10px 56px}
:not(.big)+.big{border-top:1px solid #EEF0F4}
.big small{font-size:12px;color:#5A6275}
.big::before{content:counter(menu,decimal-leading-zero);position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:11px;color:#8A92A6;letter-spacing:.06em}
.big::after{content:"";position:absolute;right:22px;top:50%;width:7px;height:7px;border-top:1px solid #8A92A6;border-right:1px solid #8A92A6;transform:translateY(-50%) rotate(45deg)}
.pg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
.pg-f{min-height:56px;border:1px solid #C3C8D1;border-radius:4px;background:#fff;font:inherit;font-size:15px;cursor:pointer;color:#1F2A44;padding:6px}
.pg-f.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pg-f small{display:block;font-size:11px;opacity:.7}
.pg-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.pg-p{aspect-ratio:1/1;border:2px solid transparent;border-radius:4px;background:#EEF0F4;padding:0;overflow:hidden;cursor:pointer;font:inherit;font-size:11px;color:#5A6275}
.pg-p img{width:100%;height:100%;object-fit:cover;display:block}
.pg-p.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.pg-in{padding:12px}
.pg-ta{width:100%;min-height:110px;font:inherit;font-size:16px;padding:10px;border:1px solid #C3C8D1;border-radius:4px;resize:vertical;background:#fff;color:#111}
.pg-b{display:block;width:100%;min-height:48px;font:inherit;font-size:16px;font-weight:500;border:1px solid var(--pri);border-radius:4px;background:var(--pri);color:#fff;cursor:pointer;margin-top:10px}
.pg-b.sub{background:#fff;color:var(--priD)}
.pg-b:disabled{opacity:.5;cursor:default}
.pg-msg{padding:10px 12px;margin:8px 0;border:1px solid #E3E6EC;border-radius:4px;background:#fff;font-size:15px}
.pg-msg.err{color:#d93025;border-color:#d93025}
.pg-cnt{font-size:12px;color:#8A92A6;text-align:right}
.pg-tx{white-space:pre-wrap;font-size:15px;padding:10px 12px}
.dv td.dvc{min-width:44px;height:46px;cursor:pointer;font-size:18px}.dv td.cand{color:#B9C0CE;font-weight:400}
.pg-row{display:flex;gap:8px;padding:0 12px 12px}.pg-row .pg-b{margin-top:0}
</style></head><body>
<header><div class="in"><div class="ht"><div class="en">PRINCE CHITOSE</div><h1 id="ttl">黒服ポータル</h1></div><button id="back" hidden>← TOP</button></div></header>
<div class="wrap" id="app"></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyAasZtWwNfYKyYRbV41yncBNdbBrtXHzcXknU-aG6-xHuo7xWtdg8NoxWDxhkwTzBq/exec";
var INTERVIEW = 'https://simplelifedesignlab-cyber.github.io/prince-apply/interview/?mode=staff';
var STORES = [{id:'RegentClub千歳',s:'RC千歳',l:'regent'},{id:'328',s:'328',l:'328'},{id:'WAVE千歳',s:'WAVE千歳',l:'wave'},{id:'花もみじ千歳',s:'花もみじ千歳',l:'hanamomiji'}];
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 黒服用の鍵は ?k= -> localStorage (面接画面と同じ ivKey を共有)。2026-11-02
var KEY='';
try{
  var u0=new URL(location.href),k0=u0.searchParams.get('k');
  if(k0){localStorage.setItem('ivKey',k0);u0.searchParams.delete('k');history.replaceState(null,'',u0.pathname+u0.search+u0.hash);}
  KEY=localStorage.getItem('ivKey')||'';
}catch(e){}
function post_(fn,args){
  return fetch(EXEC,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],k:KEY})}).then(function(r){return r.json();});
}
function api(fn,args){
  return post_(fn,args).then(function(j){
    if(!j||!j.needKey)return j;
    var k=window.prompt('黒服用のキーを入力してください');
    if(!k)throw new Error('黒服用のキーが必要です');
    KEY=k.trim();
    return post_(fn,args).then(function(j2){
      if(j2&&j2.needKey){try{localStorage.removeItem('ivKey');}catch(e){}throw new Error('キーが違います');}
      try{localStorage.setItem('ivKey',KEY);}catch(e){}
      return j2;
    });
  }).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||'取得に失敗しました');return j.result;});
}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var store = lsGet('staffStore'); if(!STORES.some(function(s){return s.id===store;})) store=null;
var seq = 0; // 古い応答を捨てる
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
var weekStart = ymd(monday(new Date()));
var selDay = ymd(new Date());
var month = ymd(new Date()).slice(0,7);
var rankTab = 'sales';

var VIEWS = {
  roster:{t:'在籍一覧',run:vRoster}, shift:{t:'シフト管理',run:vShift}, trans:{t:'送迎管理',run:vTrans},
  hair:{t:'ヘアメイク管理',run:vHair}, sales:{t:'売上管理',run:vSales}, rank:{t:'ランキング',run:vRank}, cast:{t:'キャスト明細',run:vCast}, post:{t:'投稿生成',run:vPost}
};
var selCast = lsGet('staffCast') || '';
function openCast(g){selCast=g;lsSet('staffCast',g);go('cast');}
function bindCasts(){[].forEach.call(document.querySelectorAll('[data-g]'),function(el){el.onclick=function(){openCast(el.getAttribute('data-g'));};});}
function go(v){location.hash=v||'';}
function route(){
  var v=location.hash.replace('#','');
  $('back').hidden=!VIEWS[v];
  $('back').textContent=v==='cast'?'← 売上':'← TOP';
  if(!VIEWS[v]){$('ttl').textContent='黒服ポータル';top_();return;}
  $('ttl').textContent=VIEWS[v].t;
  var el=$('app');
  el.innerHTML='<div class="stores" id="stores"></div><div id="body"></div><div class="upd" id="upd"></div>';
  $('stores').innerHTML=STORES.map(function(s){return '<button class="st'+(s.id===store?' on':'')+'" data-s="'+esc(s.id)+'"><img src="../logo/'+s.l+'.png" alt=""><span>'+esc(s.s)+'</span></button>';}).join('');
  [].forEach.call(document.querySelectorAll('.st'),function(b){b.onclick=function(){store=b.getAttribute('data-s');lsSet('staffStore',store);route();};});
  if(!store){$('body').innerHTML='<div class="msg">店舗を選んでください</div>';return;}
  $('body').innerHTML='<div class="msg">読み込み中...</div>';
  VIEWS[v].run();
}
$('back').onclick=function(){go(location.hash==='#cast'?'sales':'');};
window.addEventListener('hashchange',route);

function top_(){
  $('app').innerHTML=
    '<button class="big" data-v="roster">在籍一覧<small>キャストの名簿</small></button>'+
    '<button class="big" data-v="shift">シフト管理<small>1週間の出勤表</small></button>'+
    '<button class="big" data-v="trans">送迎管理<small>行き・帰りの一覧</small></button>'+
    '<button class="big" data-v="hair">ヘアメイク管理<small>人数と金額</small></button>'+
    '<button class="big pk" data-v="sales">売上管理<small>日別売上と明細</small></button>'+
    '<button class="big pk" data-v="rank" style="min-height:56px;font-size:18px;margin-left:24px;width:calc(100% - 24px)">ランキング<small>売上・本数・同伴</small></button>'+
    '<button class="big" data-v="post">投稿生成<small>お知らせ文を作ってストック</small></button>'+
    '<a class="big" href="'+INTERVIEW+'" target="_blank" rel="noopener">面接管理<small>面接の画面を開く</small></a>'+
    '<div class="upd">黒服ポータル</div>';
  [].forEach.call(document.querySelectorAll('button.big'),function(b){b.onclick=function(){go(b.getAttribute('data-v'));};});
}
function fin(my,res,html){ if(my!==seq)return; $('body').innerHTML=html; $('upd').textContent='最終更新 '+(res&&res.updated||''); }
function fail(my,e){ if(my!==seq)return; $('body').innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>'; }
function yen(n){return Number(n||0).toLocaleString('ja-JP')+'円';}

function vRoster(){
  var my=++seq;
  api('getRoster',[store]).then(function(r){
    var h='<div class="cnt">'+r.count+'人</div><div class="card">'+(r.casts.length?r.casts.map(function(c){
      return '<div class="row"><span>'+(c.ban?'<b>'+esc(c.ban)+'</b> ':'')+esc(c.gen)+'</span><span class="s">'+(c.joined?esc(c.joined)+'〜':'')+(c.weekly?' 週'+esc(c.weekly):'')+'</span></div>';
    }).join(''):'<div class="msg">在籍はいません</div>')+'</div>';
    fin(my,r,h);
  }).catch(function(e){fail(my,e);});
}

var DOWS=['日','月','火','水','木','金','土'];
function weekNav(then){
  return '<div class="nav"><button class="nb" id="pw">← 前</button><div class="t" id="wt"></div><button class="nb" id="nw">次 →</button></div>';
}
function bindWeek(w){
  var a=parse(w.weekStart),b=parse(w.days[6].date);
  $('wt').textContent=(a.getMonth()+1)+'/'+a.getDate()+' 〜 '+(b.getMonth()+1)+'/'+b.getDate();
  function mv(n){var d=parse(weekStart);d.setDate(d.getDate()+n);weekStart=ymd(d);selDay=weekStart;route();}
  $('pw').onclick=function(){mv(-7);};$('nw').onclick=function(){mv(7);};
}
function loadWeek(render){
  var my=++seq;
  api('getWeek',[store,weekStart]).then(function(w){ if(my!==seq)return; fin(my,w,weekNav()+render(w)); bindWeek(w); bindDays(w);}).catch(function(e){fail(my,e);});
}
function bindDays(w){
  [].forEach.call(document.querySelectorAll('.dy'),function(b){b.onclick=function(){selDay=b.getAttribute('data-d');route();};});
}
function dayBtns(w){
  if(!w.days.some(function(d){return d.date===selDay;})) selDay=w.days[0].date;
  return '<div class="days">'+w.days.map(function(d){return '<button class="dy'+(d.date===selDay?' on':'')+'" data-d="'+d.date+'">'+esc(d.label)+'<br>'+d.dow+'</button>';}).join('')+'</div>';
}

function vShift(){
  loadWeek(function(w){
    var sums=w.days.map(function(){return 0;}), miss=0;
    var rows=w.casts.map(function(c){
      var tds=w.days.map(function(d,i){
        var x=c.days[d.date], s=x?x.shift:'';
        if(x&&x.absent)return '<td class="c-abs">欠</td>';
        if(!s){ if(!c.submitted){return '<td class="c-miss">未</td>';} return '<td></td>'; }
        if(s==='休み')return '<td class="c-off">休</td>';
        if(s==='未定')return '<td class="c-und">未定</td>';
        sums[i]++; return '<td class="c-on">'+esc(s)+(x.att?' ✔':'')+'</td>';
      }).join('');
      if(!c.submitted)miss++;
      return '<tr><td class="nm">'+esc(c.gen)+'</td>'+tds+'</tr>';
    }).join('');
    var head='<tr><th>名前</th>'+w.days.map(function(d){return '<th>'+esc(d.label)+'<br>'+d.dow+'</th>';}).join('')+'</tr>';
    var sum='<tr class="sum"><td class="nm">出勤人数</td>'+sums.map(function(n){return '<td>'+n+'</td>';}).join('')+'</tr>';
    return (miss?'<div class="cnt" style="color:#e53935">未提出 '+miss+'人</div>':'')+
      '<div class="card sc"><table>'+head+(rows||'<tr><td colspan="8">在籍はいません</td></tr>')+sum+'</table></div>'+
      '<div class="upd">赤枠＝未提出　黄＝未定　灰＝休み　赤＝当欠　✔＝出勤済み</div>';
  });
}
function exText(x,skipKeys){
  if(!x||!x.ex)return '';
  return Object.keys(x.ex).filter(function(k){return !skipKeys||skipKeys.indexOf(k)<0;}).map(function(k){return esc(k)+' '+esc(x.ex[k]);}).join(' / ');
}
function vTrans(){
  loadWeek(function(w){
    function list(key,label){
      var arr=w.casts.filter(function(c){var x=c.days[selDay];return x&&x[key]&&!x.absent;});
      var areas={};
      arr.forEach(function(c){var x=c.days[selDay];var a=x.ex&&(x.ex['方面']||x.ex['乗車市町村']);if(a)areas[a]=(areas[a]||0)+1;});
      var sm=Object.keys(areas).length?'<div class="s" style="font-size:14px;color:#666">'+Object.keys(areas).map(function(a){return esc(a)+' '+areas[a]+'人';}).join(' / ')+'</div>':'';
      return '<div class="card"><div class="cnt">'+label+' '+arr.length+'人</div>'+sm+

// ---- 明細の部品: sec(見出し, 行) / 行 = {l:見出し, v:値, s:補足, t:合計行, big:大きく} ----
function sec(title,rows,cls){
  return '<div class="sec'+(cls?' '+cls:'')+'"><h3>'+esc(title)+'</h3>'+rows.map(function(x){
    return '<div class="li'+(x.t?' tot':'')+(x.big?' big2':'')+'"><span>'+esc(x.l)+(x.s?'<small>'+esc(x.s)+'</small>':'')+'</span><b>'+esc(x.v)+'</b></div>';
  }).join('')+'</div>';
}
function yn(n){return '¥'+Math.round(Number(n||0)).toLocaleString('ja-JP');}
// 給与計算の項目 -> 表示。件数・時間・率は円にしない
var PAY_ORDER=['勤務','売上・指名','バック','支給','控除'];
var PAY_TOT=['日給計','バック計','総支給額','控除額'];
function payVal(sec,l,v){
  if(l==='%')return Math.round(v*100)+'%';
  if(l==='出勤')return v+'日';
  if(l==='H'||/time$/.test(l))return v+'時間';
  if(sec==='売上・指名'&&l!=='売上')return v+'件';
  return yn(v);
}
function payLabel(sec,l){
  if(/^[ABC]$/.test(l))return (sec==='バック'?'バック ':'件数 ')+l;
  if(l==='H')return '時間';
  if(/^[A-D]time$/.test(l))return '時間'+l.charAt(0);
  if(l==='控除額')return '経費の小計';
  if(l==='%')return '給料÷売上';
  return l;
}
// 控除: 経費 (共済費・送迎費など) -> 経費の小計 (= Excel の控除額) -> 厚生費・所得税・前渡金 -> 差し引く合計 (= 総支給額 − 差引支給額)
var PAY_AFTER=/^(厚生費|所得税|前渡金)/;
function paySecs(items){
  var g={},net=null,gross=null;
  items.forEach(function(x){
    if(x[1]==='差引支給額'){net=x[2];return;}
    if(x[1]==='総支給額')gross=x[2];
    (g[x[0]]=g[x[0]]||[]).push({l:payLabel(x[0],x[1]),v:payVal(x[0],x[1],x[2]),t:PAY_TOT.indexOf(x[1])>=0,raw:x[1]});
  });
  if(g['控除']){
    var c=g['控除'],sub=c.filter(function(x){return x.raw==='控除額';});
    var ex=c.filter(function(x){return x.raw!=='控除額'&&!PAY_AFTER.test(x.raw);}),af=c.filter(function(x){return PAY_AFTER.test(x.raw);});
    g['控除']=ex.concat(sub,af);
    if(gross!=null&&net!=null)g['控除'].push({l:'差し引く合計',v:yn(gross-net),t:1});
  }
  var h=PAY_ORDER.filter(function(k){return g[k];}).map(function(k){return sec(k,g[k]);}).join('');
  if(net!=null)h+=sec('差引支給額',[{l:'今月の時点',v:yn(net),big:1}],'net');
  return h;
}
// 途中集計 (18 時のメールと同じ数字) を、明細と同じ部品で
function progSec(r){
  if(r.monthOnly)return sec('今月の進み具合',[{l:r.m+'月の合計',v:yn(r.total),s:'この店は月の合計だけで、日別がありません',big:1}]);
  var md=r.m+'/'+r.d, rows=[{l:'今月の合計',s:r.m+'/1〜'+md,v:yn(r.total),big:1},{l:'最新日の売上',s:md,v:r.yesterday==null?'お休み':yn(r.yesterday)}];
  rows.push(r.ratio==null?{l:'先月とくらべて',s:'先月の同じ期間のデータがありません',v:'—'}:{l:'先月とくらべて',s:r.pm+'/1〜'+r.pm+'/'+r.pd+' '+yn(r.prevTotal),v:(r.ratio>=100?'↑ ':'↓ ')+Math.round(r.ratio)+'%'});
  if(r.goal){var rm=Math.max(0,Math.round(r.goal-r.total));rows.push({l:'目標 '+yn(r.goal),s:rm>0?'あと '+yn(rm):'達成',v:Math.round(r.total/r.goal*100)+'%'});}
  return sec('今月の進み具合',rows);
}

  if(P.msg)h+='<div class="pg-msg'+(P.err?' err':'')+'">'+esc(P.msg)+'</div>';
  h+=P.tab==='new'?pNewHtml():pStockHtml();
  $('body').innerHTML=h; $('upd').textContent='';
  pBind();
}
function pOn(sel,fn){[].forEach.call(document.querySelectorAll(sel),fn);}
function pBind(){
  pOn('[data-pt]',function(b){b.onclick=function(){ if(P.busy)return; P.tab=b.getAttribute('data-pt'); P.msg=''; if(P.tab==='stock')P.stock=null; vPost(); };});
  pOn('[data-pf]',function(b){b.onclick=function(){
    var f=b.getAttribute('data-pf'); if(P.busy||f===P.folder)return;
    P.folder=f; P.photoId=''; P.photoName=''; P.text=''; P.msg=''; pRender(); pLoadPhotos();
  };});
  pOn('[data-pp]',function(b){b.onclick=function(){
    var id=b.getAttribute('data-pp'); if(P.busy)return;
    if(P.photoId===id){P.photoId='';P.photoName='';}
    else{P.photoId=id;var ph=(P.photos||[]).filter(function(p){return p.id===id;})[0];P.photoName=ph?ph.name:'';}
    pRender();
  };});
  var n=$('pnote'); if(n)n.oninput=function(){P.note=n.value;};
  var ti=$('ptitle'); if(ti)ti.oninput=function(){P.title=ti.value;};
  var ti2=$('ptitle2'); if(ti2)ti2.oninput=function(){P.title2=ti2.value;};
  var t2=$('ptext2'); if(t2)t2.oninput=function(){P.text2=t2.value;$('pcnt2').textContent=t2.value.length+' / 1500字';};
  var t=$('ptext'); if(t)t.oninput=function(){P.text=t.value;$('pcnt').textContent=t.value.length+' / 1500字';};
  var f=$('pfile'); if(f)f.onchange=function(){ if(f.files&&f.files[0])pUpload(f.files[0]); f.value=''; };
  var g=$('pgen'); if(g)g.onclick=pGen;
  var s=$('psave'); if(s)s.onclick=pSave;
  pOn('[data-pc]',function(b){b.onclick=function(){
    var s0=P.stock[+b.getAttribute('data-pc')]; if(!s0)return;
    pCopy(s0.text).then(function(){b.textContent='コピーしました';setTimeout(function(){b.textContent='本文コピー';},1500);}).catch(function(){pMsg('コピーできませんでした。本文を長押しして選んでください',true);pRender();});
  };});
  pOn('[data-px]',function(b){b.onclick=function(){
    var s0=P.stock[+b.getAttribute('data-px')]; if(!s0||P.busy)return;
    if(!window.confirm('このストックを取り消しますか？'))return;
    pRun('cancel',function(){return api('cancelPost',[s0.id]);},function(){pMsg('取り消しました',false);P.stock=null;pLoadStock();});
  };});
}
function pCopy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text);
  return new Promise(function(ok,ng){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy')?ok():ng(); }catch(e){ng(e);} document.body.removeChild(ta);
  });
}
function pGen(){
  if(!P.folder)return;
  var me=P; if(me.busy)return;
  me.busy='gen'; me.msg=''; pRender();
  Promise.all([api('generatePost',[store,P.folder,P.photoId,P.note,'Google']),api('generatePost',[store,P.folder,P.photoId,P.note,'ポータル'])]).then(function(rs){
    var r=rs[0],r2=rs[1];
    if(me!==P)return; me.busy=''; me.title=r.title||''; me.text=r.text; me.title2=r2.title||''; me.text2=r2.text; r.cut=r.cut||r2.cut; me.cut=!!r.cut; pMsg(r.cut?'1500字を超えたため途中で切りました。手直ししてください':'',r.cut); pRender();
  }).catch(function(e){ if(me!==P)return; me.busy=''; pMsg(e.message||String(e),true); pRender(); });
}
function pSave(){
  var text=P.text.trim();
  if(!text){pMsg('本文が空です',true);pRender();return;}
  var text2=P.text2.trim();
  if(!text2){pMsg('ポータルの本文が空です',true);pRender();return;}
  if(text.length>1500||text2.length>1500){pMsg('本文は1500字までです',true);pRender();return;}
  var folder=P.folder, pid=P.photoId, note=P.note, items=[{media:'Google',title:P.title.trim(),text:text},{media:'ポータル',title:P.title2.trim(),text:text2}];
  pRun('save',function(){return api('savePost',[store,folder,pid,note,items]);},function(r){
    P.title=''; P.text=''; P.title2=''; P.text2=''; P.note=''; P.photoId=''; P.photoName=''; pMsg('ストックに入れました'+(r.warn?' ('+r.warn+')':''),!!r.warn);
    if(folder!=='メインランダム'){P.folders=null;pLoadFolders();pLoadPhotos();}
  });
}
// 端末で長辺 1600px の JPEG に縮小してから送る (interview の写真処理と同じ canvas 方式)
function pResize(file){
  return new Promise(function(ok,ng){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){
      var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.85));
    };
    im.onerror=function(){URL.revokeObjectURL(url);ng(new Error('この写真は読めませんでした (JPEG か PNG を選んでください)'));};
    im.src=url;
  });
}
function pUpload(file){
  var folder=P.folder; if(!folder||P.busy)return;
  var me=P; me.busy='up'; me.msg='写真を送っています...'; pRender();
  pResize(file).then(function(d){return api('uploadPostPhoto',[store,folder,d,file.name]).then(function(r){return {r:r,d:d};});}).then(function(x){
    if(me!==P)return; me.busy='';
    if(me.folder===folder){ me.photos=[{id:x.r.id,name:x.r.name,thumb:x.d}].concat(me.photos||[]); me.photoTotal=(me.photoTotal||0)+1; me.photoId=x.r.id; me.photoName=x.r.name; }
    pMsg('写真を追加しました',false); pRender();
  }).catch(function(e){ if(me!==P)return; me.busy=''; pMsg(e.message||String(e),true); pRender(); });
}
route();
</script></body></html>
