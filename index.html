    $('d_s' + i).onchange = function () {
      if (!this.value) { setSel('d_e' + i, ''); setSel('d_r' + i, ''); } else if (!$('d_e' + i).value) setSel('d_e' + i, 'Last');
    };
    $('d_e' + i).onchange = function () { if (!$('d_s' + i).value) setSel('d_e' + i, ''); };
    $('d_r' + i).onchange = function () { if (!$('d_s' + i).value) setSel('d_r' + i, ''); };
    if (i > 0) $('d_c' + i).onclick = function () {

    };
  });
  var gy = $('f_geny'), gconv = function () { var v = kata(gy.value); if (v !== gy.value) gy.value = v; };
  gy.addEventListener('input', function (e) { if (!e.isComposing) gconv(); });
  gy.addEventListener('compositionend', gconv);
  gy.addEventListener('change', function () {
    gconv();
    var y = gy.value.trim(), w = $('gen_warn');
    if (!y) { w.textContent = ''; return; }
    google.script.run.withSuccessHandler(function (r) {
      if (gy.value.trim() !== y) return;
      w.textContent = r ? '同じ読みのお名前の方が在籍しています。別のお名前も考えておいてください' : '';

}
function setSel(id, v) {
  var s = $(id);
  if (v && !Array.prototype.some.call(s.options, function (o) { return o.value === v || o.text === v; })) { var o = document.createElement('option'); o.text = v; s.add(o); }
  s.value = v;
}
function lookupZip(z) {
  $('zipst').textContent = '住所を検索中...';
  google.script.run.withSuccessHandler(function (r) {
    if ($('f_zip').value !== z) return;
    if (!r) { $('zipst').textContent = '自動入力できませんでした。手入力してください。'; return; }
    $('zipst').textContent = '住所を自動入力しました (修正できます)';
    if (PREFS.indexOf(r.pref) >= 0) setSel('f_pref', r.pref);
    var city = r.city, m = /^札幌市(.+区)$/.exec(city);
    $('f_cityo').value = '';
    if (r.pref === '北海道') {
      if (m) { setSel('f_city', '札幌市'); setSel('f_ward', m[1]); }

    } else $('f_cityo').value = city;

  }).withFailureHandler(function () { $('zipst').textContent = '自動入力できませんでした。手入力してください。'; }).lookupZip(z);
}
function socialUrl(v, base) {
  v = (v || '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  return base + v.replace(/^@/, '');
}
function infoCollect() {
  var d = {};
  d.furigana = kata($('f_furigana').value.trim()); d.name = $('f_name').value.trim();
  var y = $('f_by').value, m = $('f_bm').value, dd = $('f_bd').value;
  d.birth = (y && m && dd) ? y + '-' + pad2(m) + '-' + pad2(dd) : '';
  d.tel = fmtTel($('f_tel').value); d.email = $('f_email').value.trim();
  var z = $('f_zip').value.replace(/\D/g, '');
  d.zip = z.length === 7 ? z.slice(0, 3) + '-' + z.slice(3) : z;
  d.pref = $('f_pref').value;
  var city;
  if (d.pref === '北海道') {
    var c = $('f_city').value;
    city = c === '札幌市' ? '札幌市' + $('f_ward').value : c === 'その他' ? $('f_cityo').value.trim() : c;
  } else city = $('f_cityo').value.trim();
  d.city = city; d.town = $('f_town').value.trim(); d.building = $('f_building').value.trim();
  d.address = d.pref + d.city + d.town + d.building;
  WEEK.forEach(function (w, i) {
    var st = $('d_s' + i).value, en = $('d_e' + i).value, rd = $('d_r' + i).value;
    d['wd' + i] = st ? st + '～' + (en || 'Last') + (rd ? ' 送迎希望' : '') : '';
  });
  var wx = document.querySelector('#wdx_box .chip.on');
  d.wdx = wx ? wx.getAttribute('data-v') : '';
  d.genWish = $('f_gen').value.trim(); d.genWishYomi = kata($('f_geny').value.trim());
  d.insta = socialUrl($('f_insta').value, 'https://www.instagram.com/');
  d.tiktok = socialUrl($('f_tiktok').value, 'https://www.tiktok.com/@');
  d.sns = $('f_sns').value.trim();
  return d;
}
// strict=true: 応募者入力 (必須あり) / false: 黒服画面 (形式の確認だけ)
function infoValidate(d, strict) {
  var errs = [];
  function e(k, t) { errs.push([k, t]); }
  if (strict) {
    if (!d.furigana) e('furigana', 'フリガナを入力してください');
    if (!d.name) e('name', '氏名を入力してください');
    if (!d.birth) e('birth', '生年月日を選んでください');
    if (!d.tel) e('tel', 'TELを入力してください');
    if (!d.email) e('email', 'Emailを入力してください');
    if (d.genWish && !d.genWishYomi) e('genWishYomi', '源氏名の読み方（カタカナ）を入力してください');
    if (!d.city || (d.pref === '北海道' && $('f_city').value === '')) e('city', '市区町村を選んでください');
    if (!d.town) e('town', '町名・番地を入力してください');
  }
  if (d.birth) {
    var p = d.birth.split('-');
    if (ageOf(+p[0], +p[1], +p[2]) < 18) e('birth', '18歳未満の方は登録できません');
  }
  if (d.tel && d.tel.replace(/\D/g, '').length < 10) e('tel', 'TELの桁数が足りません');
  if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) e('email', 'Emailの形式が正しくありません');
  if (d.zip && d.zip.replace(/\D/g, '').length !== 7) e('zip', '郵便番号は7桁です');
  if (d.pref === '北海道' && $('f_city').value === '札幌市' && !$('f_ward').value) e('city', '区を選んでください');
  if (strict) {
    var any = false;
    WEEK.forEach(function (w, i) { if (d['wd' + i]) any = true; });
    if (!any && !d.wdx) e('wk', '出勤できる曜日を選ぶか、「不定期」「未定」を選んでください');
  }
  return errs;
}
function showErrors(errs) {
  document.querySelectorAll('.ferr').forEach(function (x) { x.textContent = ''; });
  document.querySelectorAll('.bad').forEach(function (x) { x.classList.remove('bad'); });
  errs.forEach(function (x) { setErr(x[0], x[1]); });
  if (errs.length) { var w = $('w_' + errs[0][0]); if (w) w.scrollIntoView({ block: 'center' }); msg('入力を確認してください', true); }
}

// ================= 選択式の質問部品 (応募者入力 / 黒服画面で共用) =================
function qid(c) { return 'cq_' + c.f + '_' + c.qi; }
function splitNote(s) {
  s = s || '';
  var i = s.lastIndexOf('補足: ');
  if (i >= 0 && (i === 0 || s.charAt(i - 1) === ' ')) return [s.slice(0, i).trim(), s.slice(i + 4)];
  return [s.trim(), ''];
}
function decodeQ(c, s) {
  var sn = splitNote(s), m = sn[0], vals = [];
  if (c.parts.length > 1) {
    var seg = m ? m.split(' / ') : [];
    c.parts.forEach(function (p) {
      var v = '';
      seg.forEach(function (x) { if (x.indexOf(p.l + ': ') === 0) v = x.slice(p.l.length + 2); });
      vals.push(p.k === 'm' ? (v ? v.split('、') : []) : v);
    });
  } else vals.push(c.parts[0].k === 'm' ? (m ? m.split('、') : []) : m);
  return { vals: vals, note: sn[1] };
}
function chipsHtml(opts, arr, mode) {
  var o = opts.slice();
  arr.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); });
  return '<div class="chips" data-m="' + mode + '">' + o.map(function (v) {
    return '<button type="button" class="chip' + (arr.indexOf(v) >= 0 ? ' on' : '') + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
  }).join('') + '</div>';
}
function selHtml(opts, v) {
  var f = false, h = '<select class="ps"><option value="">選択</option>';
  opts.forEach(function (o) { var s = o === v; if (s) f = true; h += '<option' + (s ? ' selected' : '') + '>' + esc(o) + '</option>'; });
  if (v && !f) h += '<option selected>' + esc(v) + '</option>';
  return h + '</select>';
}
function qHtml(c, s) {
  var d = decodeQ(c, s), h = '<div class="q cqb" id="' + qid(c) + '"' + (c.showIf ? ' data-si="' + c.showIf.f + ':' + c.showIf.qi + '" data-sv="' + esc(c.showIf.v) + '"' : '') + '><label class="t">' + esc(c.label) + '</label>';
  c.parts.forEach(function (p, pi) {
    var v = d.vals[pi];
    h += '<div class="pt" data-pi="' + pi + '">' + (p.l ? '<div class="pl">' + esc(p.l) + '</div>' : '');
    if (p.k === 'm') h += chipsHtml(p.o, v, 'm');
    else if (p.k === 's') h += chipsHtml(p.blank ? ['未入力'].concat(p.o) : p.o, v ? [v] : (p.blank ? ['未入力'] : []), 's');
    else if (p.k === 'sel') h += selHtml(p.o, v);
    else h += '<input type="text" class="pt_t" value="' + esc(v) + '">';
    h += '</div>';
  });
  if (c.note) h += '<input type="text" class="nt" placeholder="補足 (あれば)" value="' + esc(d.note) + '">';
  return h + '</div>';
}
function qRead(c) {
  var w = $(qid(c)), out = [];
  if (!w) return null;
  c.parts.forEach(function (p, pi) {
    var pt = w.querySelector('.pt[data-pi="' + pi + '"]'), v;
    if (p.k === 'sel') v = pt.querySelector('select').value;
    else if (p.k === 't') v = pt.querySelector('input').value.trim();
    else {
      var on = [].map.call(pt.querySelectorAll('.chip.on'), function (b) { return b.getAttribute('data-v'); });
      v = p.k === 'm' ? on.join('、') : (on[0] || '');
      if (v === '未入力') v = ''; // 「未入力」ボタンは空欄と同じ
    }
    out.push(v);
  });
  var s = c.parts.length > 1 ? c.parts.map(function (p, i) { return out[i] ? p.l + ': ' + out[i] : ''; }).filter(Boolean).join(' / ') : out[0];
  var n = c.note ? w.querySelector('.nt').value.trim() : '';
  return n ? (s ? s + ' ' : '') + '補足: ' + n : s;
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.chip');
  if (!b) return;
  var box = b.parentNode;
  if (box.getAttribute('data-m') === 'x') return;
  if (box.getAttribute('data-m') === 's') {
    var was = b.classList.contains('on');
    [].forEach.call(box.children, function (x) { x.classList.remove('on'); });
    if (!was) b.classList.add('on');
  } else b.classList.toggle('on');
  syncShow();
});
function syncShow() {
  if ($('jdbox')) { var jo = document.querySelector('#jchips .chip.on'); $('jdbox').style.display = jo && jo.getAttribute('data-v') === '1日体験' ? '' : 'none'; }
  [].forEach.call(document.querySelectorAll('[data-si]'), function (w) {
    var c = CASTQ.filter(function (x) { return x.f + ':' + x.qi === w.getAttribute('data-si'); })[0];
    w.style.display = qRead(c) === w.getAttribute('data-sv') ? '' : 'none';
  });
}
function castBlocks(page, vals) {
  return CASTQ.filter(function (c) { return c.page === page; }).map(function (c) { return qHtml(c, vals[c.f + ':' + c.qi]); }).join('');
}
function castAll() { var m = {}; CASTQ.forEach(function (c) { var s = qRead(c); if (s) m[c.f + ':' + c.qi] = s; }); return m; }

// ================= ページ送り =================
var PG = { i: 0, pages: [], opt: {} };
function pagerInit(box, pages, opt) {
  PG = { i: 0, pages: pages, opt: opt };
  $(box).innerHTML = '<div id="prog" class="prog"></div>' + pages.map(function (p, i) {
    return '<div class="pg" id="pg' + i + '" style="display:none"><h2>' + esc(p.t) + '</h2>' + p.h + '</div>';
  }).join('') + '<div class="bar nav"><button id="pb">戻る</button>' + (opt.extra || '') + '<button class="pri" id="pn">次へ</button></div>';
  if (opt.bind) opt.bind();
  $('pb').onclick = function () { pgGo(PG.i - 1); };
  $('pn').onclick = function () {
    var er = opt.check ? opt.check(PG.i) : [];
    showErrors(er);
    if (er.length) return;
    pgGo(PG.i + 1);
  };
  pgGo(0);
}
function pgGo(i) {
  if (i < 0 || i >= PG.pages.length) return;
  PG.i = i;
  PG.pages.forEach(function (p, k) { $('pg' + k).style.display = k === i ? 'block' : 'none'; });
  var n = PG.pages.length;
  $('prog').textContent = (i + 1) + '/' + n + '　' + PG.pages[i].t;
  $('prog').style.setProperty('--w', Math.round((i + 1) / n * 100) + '%');
  $('pb').style.visibility = i ? 'visible' : 'hidden';
  $('pn').style.display = i === n - 1 ? 'none' : '';
  msg('');
  syncShow();
  if (PG.opt.onShow) PG.opt.onShow(i);
  window.scrollTo(0, 0);
}

// ================= まとめ表示 (確認ページ・黒服画面のカード) =================
var CARD_KEYS = ['jikyu:3', 'jikyu:4', 'jikyu:12', 'jikyu:6', 'jikyu:7', 'jikyu:8', 'jikyu:9', 'jikyu:11', 'kyujin:2', 'kyujin:5'];
function summaryHtml(full) {
  var d = infoCollect(), cast = castAll(), rows = [];
  var age = '';
  if (d.birth) { var p = d.birth.split('-'); age = '　満' + ageOf(+p[0], +p[1], +p[2]) + '歳'; }
  rows.push(['氏名', (d.furigana ? d.furigana + '　' : '') + d.name + age]);
  rows.push(['生年月日', d.birth]);
  rows.push(['TEL / Email', d.tel + (d.email ? ' / ' + d.email : '')]);
  rows.push(['住所', (d.zip ? '〒' + d.zip + ' ' : '') + d.address]);
  var wd = [];
  WEEK.forEach(function (w, i) { if (d['wd' + i]) wd.push(w + ' ' + d['wd' + i]); });
  if (d.wdx) wd.push(d.wdx);
  rows.push(['出勤希望', wd.join('　')]);
  if (d.genWish) rows.push(['源氏名希望', d.genWish + (d.genWishYomi ? ' (' + d.genWishYomi + ')' : '')]);
  rows.push(['SNS', [d.insta, d.tiktok, d.sns].filter(Boolean).join('　')]);
  CASTQ.forEach(function (c) {
    var k = c.f + ':' + c.qi;
    if (cast[k] && (full || CARD_KEYS.indexOf(k) >= 0)) rows.push([c.label, cast[k]]);
  });
  return '<div class="sum">' + rows.filter(function (r) { return r[1] && String(r[1]).trim(); }).map(function (r) {
    return '<div class="sr"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>';
  }).join('') + '</div>';
}

// ================= 応募者入力 (本人・iPad) =================
var PAGE_OF = { furigana: 0, name: 0, birth: 0, tel: 0, email: 0, zip: 0, pref: 0, city: 0, town: 0, building: 0, wd0: 4, wd1: 4, wd2: 4, wd3: 4, wd4: 4, wd5: 4, wd6: 4, wk: 4, consent: 6 };
// 起動時に店舗リスト (スプレッドシートの「プルダウン」タブ) を取り、「応募するお店」の選択肢を差し替えてから開く。取れなければ埋め込み値のまま
function startApply() {
  var done = false;
  function go(names) {
    if (done) return; done = true;
    if (names && names.length) {
      var c = CASTQ.filter(function (x) { return x.f === 'kyujin' && x.qi === 5; })[0];
      if (c) c.parts[0].o = names.concat(['希望無し']);
    }
    showApply();
  }
  setTimeout(function () { go(null); }, 4000);
  try { google.script.run.withSuccessHandler(go).withFailureHandler(function () { go(null); }).getStores(); } catch (e) { go(null); }
}
function showApply() {
  var S = infoSecs({}, 1), bykey = {};
  S.forEach(function (s) { bykey[s.t] = s.h; });
  var pages = [
    { t: '基本情報', h: '<div class="small"><span class="req">*</span> は必須です。それ以外は答えられるものだけでOKです。</div>' +
      ['基本情報', '連絡先', '住所'].map(function (t) { return '<div class="sec"><h3>' + t + '</h3>' + bykey[t] + '</div>'; }).join('') },
    { t: 'これまでのお仕事', h: '<div class="small">当てはまるものをタップしてください。わからない所は飛ばしてOKです。</div>' + castBlocks('work', {}) },
    { t: 'お店選び', h: castBlocks('shop', {}) },
    { t: 'あなたについて', h: castBlocks('me', {}) },
    { t: '出勤希望', h: bykey['出勤希望'] },
    { t: 'SNS', h: bykey['SNS'] },
    { t: '同意', h: '<h3>個人情報の取り扱い</h3><div class="consent">' + esc(CONSENT.join('\n')) + '</div>' +
      '<div class="q" id="w_consent"><label class="opt big"><input type="checkbox" id="consent">上記に同意します <span class="req">*</span></label><div class="ferr" id="e_consent"></div></div>' },
    { t: '確認', h: '<div class="small">内容を確認して、よければ「送信」を押してください。直す場合は「戻る」で戻れます。</div><div id="sumbox"></div><button class="pri big" id="sub" style="width:100%">送信</button>' }
  ];
  pagerInit('app', pages, {
    bind: infoBind,
    check: function (i) { return applyErrs().filter(function (e) { return PAGE_OF[e[0]] === i; }); },
    onShow: function (i) { if (i === 7) $('sumbox').innerHTML = summaryHtml(true); }
  });
  $('sub').onclick = submitApply;
}
function applyErrs() {
  var d = infoCollect(), errs = infoValidate(d, true);
  if (!$('consent').checked) errs.push(['consent', '個人情報の取り扱いへの同意にチェックしてください']);
  return errs;
}
function submitApply() {
  var errs = applyErrs();
  if (errs.length) {
    var pg = 7; errs.forEach(function (e) { pg = Math.min(pg, PAGE_OF[e[0]] == null ? 7 : PAGE_OF[e[0]]); });
    pgGo(pg); showErrors(errs); return;
  }
  var d = infoCollect();
  d.consent = true; d.cast = castAll();
  $('sub').disabled = true;
  run('submitApplicant', [d], function () {
    msg('');
    $('app').innerHTML = '<h2 class="big">入力ありがとうございました。</h2><p class="big">スタッフにお声がけください。</p>';
    window.scrollTo(0, 0);
  }, function () { $('sub').disabled = false; });
}

startApply();
