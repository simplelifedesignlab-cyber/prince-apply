// 保存済みの値 v を プルダウン(s) / 手入力(m) / 選択肢にない文字(x) に振り分ける
function manSplit(kind, v, opts) {
  v = String(v == null ? '' : v);
  if (!v) return { s: '', m: '', x: '' };
  if (opts.indexOf(v) >= 0) return { s: v, m: '', x: '' };
  var r = MAN[kind].re.exec(v);
  if (r) return { s: '', m: r[1].replace(/,/g, ''), x: '' };
  return { s: v, m: '', x: v };
}
function manJoin(kind, s, m) {

}

  return '<div class="mpair" data-kind="' + kind + '" style="display:flex;gap:6px;align-items:center"><select ' + selAttrs + ' style="flex:1"><option value="">--</option>' +
    opts.map(function (o) { return '<option' + (o === p.s ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') +
    (p.x ? '<option selected>' + esc(p.x) + '</option>' : '') + '</select>' +
    '<input type="text" inputmode="numeric" class="man" ' + (manAttrs || '') + ' placeholder="手入力" value="' + esc(p.m) + '" style="width:7em"><span>' + MAN[kind].unit + '</span></div>';
}
function pairVal(w) { // w = .mpair 要素

function qRead(c) {

// 希望面接日時: 選んだお店 (希望無しなら全店) の空き枠をサーバから取る。取り直した時は前の選択を残す
var SLOTS = [], DOW = ['日', '月', '火', '水', '木', '金', '土'];
function slotDate(d) { var p = d.split('-'); return +p[1] + '/' + +p[2] + '(' + DOW[new Date(+p[0], p[1] - 1, +p[2]).getDay()] + ')'; }

// 面接写真: 撮影 → 長辺 1280px の JPEG に縮小 → すぐ Drive へアップロード (成功するまで「送信」は押せない)。撮り直しは同じボタン
var PHOTO = '', PHOTO_ID = '', CONSENTED = false;
function photoPick(f) {
  if (!f) return;
  var im = new Image(), u = URL.createObjectURL(f);
  im.onload = function () {
    var k = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    PHOTO = c.toDataURL('image/jpeg', 0.85); PHOTO_ID = '';
    URL.revokeObjectURL(u);
    $('photoprev').src = PHOTO; $('photoprev').style.display = 'block';
    $('photobtn').textContent = '撮り直す';
    setErr('photo', '');
    var st = $('photost'), mine = PHOTO;
    st.style.color = '#555'; st.textContent = '写真をアップロード中…'; $('sub').disabled = true; $('photobtn').disabled = true;
    google.script.run.withSuccessHandler(function (id) {
      $('photobtn').disabled = false;
      if (PHOTO !== mine) return; // アップロード中に撮り直された
      PHOTO_ID = id; $('sub').disabled = false;
      st.style.color = '#1a7f37'; st.textContent = '写真をアップロードしました。よければ「送信」を押してください。';
    }).withFailureHandler(function (e) {
      $('photobtn').disabled = false;
      if (PHOTO !== mine) return;
      st.style.color = '#c00'; st.textContent = 'アップロードに失敗しました。もう一度撮影してください: ' + (e && e.message || e);
    }).uploadPhoto(mine);
  };
  im.onerror = function () { URL.revokeObjectURL(u); setErr('photo', '写真を読み込めませんでした。もう一度撮影してください'); };
  im.src = u;
}
function applyErrs() {

  if (!PHOTO_ID) errs.push(['photo', PHOTO ? '写真のアップロードが終わるまでお待ちください' : '面接写真を撮影してください']);
  if (!$('slot_d').value || !$('slot_t').value) errs.push(['slot', '希望面接日時を選んでください']);

// ================= 必須欄の「未入力が分かる」表示 (応募者画面だけ) =================
// 必須で空の欄はピンク、入力されたら白に戻す (入力のたびに切り替え)。判定は送信前の検証 (applyErrs) と同じものを使う
var RQ_KEYS = ['hDisease', 'hBase', 'hMental', 'hAllergy', 'hAgree', 'store', 'name', 'birth', 'height', 'weight', 'tel', 'email', 'city', 'town', 'genWish', 'genWishYomi', 'wk', 'photo', 'slot'], RQ_BLK = ['store', 'wk', 'photo', 'slot'], RQ_ON = false;

  ['input', 'change', 'click'].forEach(function (ev) { document.addEventListener(ev, function () { setTimeout(rqPaint, 0); }); });
  RQ_ON = true; rqPaint();

function rqPaint() {

  var bad = {};
  try {
    applyErrs().forEach(function (e) {
      // 「確認ボタンを押す」「アップロード待ち」は未入力ではないのでピンクにしない
      if (/確認」ボタン|お待ちください/.test(e[1])) return;
      bad[e[0]] = 1;

  RQ_KEYS.forEach(function (k) {
    var w = $('w_' + k); if (!w) return;

      var empty = c.value.trim() === '' && c.offsetParent !== null;

}
// ================= 入力の途中保存 (下書き・応募者画面だけ) =================
// 入力のたびにブラウザの localStorage へ保存し、開き直したら復元して続きのページから再開する。写真と面接枠は復元しない。
// 個人情報が端末に残るので 24 時間で期限切れ (開いたときに消す)。送信成功で消す。localStorage が使えなくても普通に動く
var DRAFT_KEY = 'prince_apply_draft_v1', DRAFT_TTL = 24 * 3600 * 1000, DRAFT_ON = false, DRAFT_T = 0;
function draftLs(fn) { try { return fn(window.localStorage); } catch (e) { return null; } } // 使えない (プライベートモードなど) ときは何もしない
function draftFields() {
  return [].filter.call(document.querySelectorAll('#app input, #app select, #app textarea'), function (el) {
    return el.type !== 'file' && el.type !== 'button' && ['slot_d', 'slot_t'].indexOf(el.id) < 0;
  });
}
function draftSave() {
  if (!DRAFT_ON) return;
  clearTimeout(DRAFT_T);
  DRAFT_T = setTimeout(function () {
    if (!DRAFT_ON) return;
    var f = draftFields().map(function (el) { return el.type === 'checkbox' || el.type === 'radio' ? el.checked : el.value; });
    var c = [].map.call(document.querySelectorAll('#app .chips'), function (box) {
      return [].filter.call(box.children, function (b) { return b.classList.contains('on'); }).map(function (b) { return b.getAttribute('data-v'); });
    });
    draftLs(function (ls) { ls.setItem(DRAFT_KEY, JSON.stringify({ t: Date.now(), p: PG.i, f: f, c: c })); });
  }, 300);
}
function draftClear() {
  DRAFT_ON = false; clearTimeout(DRAFT_T);
  draftLs(function (ls) { ls.removeItem(DRAFT_KEY); });
}
function draftInit() {
  var raw = draftLs(function (ls) { return ls.getItem(DRAFT_KEY); }), dr = null;
  try { dr = raw ? JSON.parse(raw) : null; } catch (e) { dr = null; }
  var fs = draftFields(), boxes = document.querySelectorAll('#app .chips');
  // 期限切れ・画面の作りが変わった下書きは捨てる
  if (dr && (!dr.t || Date.now() - dr.t > DRAFT_TTL || !dr.f || dr.f.length !== fs.length || !dr.c || dr.c.length !== boxes.length)) { draftLs(function (ls) { ls.removeItem(DRAFT_KEY); }); dr = null; }
  if (dr) {
    fs.forEach(function (el, i) { if (el.type === 'checkbox' || el.type === 'radio') el.checked = !!dr.f[i]; else el.value = dr.f[i]; });
    [].forEach.call(boxes, function (box, i) {
      [].forEach.call(box.children, function (b) { b.classList[dr.c[i].indexOf(b.getAttribute('data-v')) >= 0 ? 'add' : 'remove']('on'); });
    });
    syncCity(); syncAge(); syncShow();
    pgGo(Math.max(0, Math.min(dr.p || 0, 6))); // 同意ページ (6) まで。それより先は同意を押し直してもらう
  }
  $('app').insertAdjacentHTML('beforeend', '<div class="small" style="text-align:center;margin:16px 0 24px"><a href="#" id="draft_reset">入力を最初からやり直す</a></div>');
  $('draft_reset').onclick = function (e) { e.preventDefault(); draftClear(); location.reload(); };
  DRAFT_ON = true;
  ['input', 'change', 'click'].forEach(function (ev) { document.addEventListener(ev, draftSave); });
}
var SENDING = false;
function submitApply() {
  if (SENDING) return; // 2 回押しで二重登録しない
  var errs = applyErrs();
  if (errs.length) {
    var pg = 7; errs.forEach(function (e) { pg = Math.min(pg, PAGE_OF[e[0]] == null ? 7 : PAGE_OF[e[0]]); });
    pgGo(pg); showErrors(errs);
    if ($('sendst')) $('sendst').textContent = '入力が足りない所があります: ' + errs.map(function (e) { return e[1]; }).join(' / ');
    return;
  }
  var d = infoCollect();
  d.consent = true; d.cast = castAll(); d.photoId = PHOTO_ID;
  d.slot = { date: $('slot_d').value, time: $('slot_t').value };
  SENDING = true;
  $('sub').disabled = true;
  $('sub').innerHTML = '<span class="spin"></span>送信中…';
  $('sendst').textContent = '';
  // 写真はアップロード済み (file ID)。サーバが写真を確かめられた時だけ申込みを確定する
  google.script.run.withSuccessHandler(function () {
    draftClear();
    msg('');
    $('app').innerHTML = '<div class="done"><div class="ck">&#10003;</div><h2 style="font-size:24px;line-height:1.6">お疲れ様でした。<br>情報を店舗へ送信しました。<br>このページは閉じてください。</h2>' +
      '<p class="small" style="color:#C2336A">面接写真を保存しました。</p></div>';
    window.scrollTo(0, 0);
  }).withFailureHandler(function (e) {
    SENDING = false; $('sub').disabled = false; $('sub').textContent = '送信';
    var t = '送信できませんでした: ' + (e && e.message || e);
    $('sendst').textContent = t; msg(t, true);
    loadSlots();
  }).submitApplicant(d);
}

startApply();
</script></body></html>
