<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2A44">
<title>ヘアメイク入力</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--pri:#1F2A44;--priD:#2E4372;--priL:#E6E9F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:17px;line-height:1.5;background:#F4F5F7;color:#111;overflow-wrap:anywhere}
header{background:var(--pri);color:#fff;padding:10px 16px 12px}
header .in{max-width:560px;margin:0 auto}
header .en{font-size:10px;letter-spacing:.32em;color:#AEB7CC;line-height:1.4}
header h1{margin:0;font-size:18px;font-weight:500;letter-spacing:.06em}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 110px}
.nav{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.nb{min-height:52px;flex:none;width:72px;font:inherit;font-size:15px;font-weight:700;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#111;cursor:pointer}
.nb:disabled{opacity:.4;cursor:default}
.nav input[type=date]{flex:1;min-height:52px;font:inherit;font-size:18px;font-weight:700;text-align:center;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#111;min-width:0}
.card{background:#fff;border:1px solid #E3E6EC;border-radius:8px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-size:21px}
.link{font:inherit;font-size:14px;min-height:44px;padding:0 10px;border:0;background:none;color:#5A6275;text-decoration:underline;cursor:pointer}
.att{min-height:52px;min-width:104px;font:inherit;font-weight:700;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#5A6275;cursor:pointer}
.att.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lb{font-size:16px;font-weight:700;margin:0 0 8px}
.lb2{font-size:16px;font-weight:700;margin:14px 0 8px}
.st2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stb{min-height:56px;font:inherit;font-weight:700;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#111;cursor:pointer}
.stb.on{background:var(--pri);border-color:var(--pri);color:#fff}
select,input[type=text]{width:100%;min-height:56px;font:inherit;font-size:18px;padding:0 12px;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#111}
.add{width:100%;min-height:56px;margin-top:12px;font:inherit;font-size:18px;font-weight:700;border:1px solid var(--priD);border-radius:6px;background:#fff;color:var(--priD);cursor:pointer}
.add:disabled{opacity:.4;cursor:default}
.who{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #EEF0F4}
.who .s{flex:none;width:84px;font-size:13px;color:#5A6275}
.who .g{flex:1;font-size:18px;font-weight:700}
.who button{flex:none;width:52px;height:48px;font:inherit;font-size:14px;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#5A6275;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--pri);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar .t{font-size:19px;font-weight:700}
.sv{min-height:56px;min-width:150px;font:inherit;font-size:18px;font-weight:700;border:1px solid var(--pri);border-radius:6px;background:var(--pri);color:#fff;cursor:pointer}
.sv.clean{background:#fff;color:#5A6275;border-color:#C3C8D1}
.sv:disabled{cursor:default}
.pick button{display:block;width:100%;min-height:64px;margin-top:10px;font:inherit;font-size:20px;font-weight:700;border:1px solid #C3C8D1;border-radius:6px;background:#fff;color:#111;cursor:pointer}
.hd{font-size:12px;font-weight:500;letter-spacing:.14em;color:#5A6275;margin:20px 4px 6px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:16px}
th,td{border:1px solid #E3E6EC;padding:8px 10px;text-align:right}
th{background:var(--priL);color:#5A6275;font-weight:500;font-size:13px}
.msg{padding:26px 10px;text-align:center;font-size:18px;color:#666}
.err{color:#d93025}
.note{font-size:14px;color:#5A6275;margin:8px 2px 0}
.upd{font-size:13px;color:#8A92A6;text-align:center;margin:14px 0}
</style></head><body>
<header><div class="in"><div class="en">PRINCE CHITOSE</div><h1>ヘアメイク 入力</h1></div></header>
<div class="wrap">
  <div class="nav" id="navw"><button class="nb" id="pd">← 前の日</button><input type="date" id="dt"><button class="nb" id="nd">次の日 →</button></div>
  <div id="body"><div class="msg">読み込み中...</div></div>
  <div id="wkw"><div class="hd" id="wkh"></div><div id="wk"></div></div>
  <div class="upd" id="upd"></div>
</div>
<div class="bar" id="bar" style="display:none"><div class="in"><span class="t" id="tot"></span><button class="sv" id="sv"></button></div></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyAasZtWwNfYKyYRbV41yncBNdbBrtXHzcXknU-aG6-xHuo7xWtdg8NoxWDxhkwTzBq/exec";
var STORES = [{id:'RegentClub千歳',s:'リージェント'},{id:'328',s:'328'},{id:'WAVE千歳',s:'WAVE'},{id:'花もみじ千歳',s:'花もみじ'}];
var OTHER = '__other__';
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shortOf(id){for(var i=0;i<STORES.length;i++)if(STORES[i].id===id)return STORES[i].s;return id;}
// 鍵は美容室アプリと同じ salonKey (?k= -> localStorage)
var KEY='';
try{
  var u0=new URL(location.href),k0=u0.searchParams.get('k');
  if(k0){localStorage.setItem('salonKey',k0);u0.searchParams.delete('k');history.replaceState(null,'',u0.pathname+u0.search+u0.hash);}
  KEY=localStorage.getItem('salonKey')||'';
}catch(e){}
function post_(fn,args){
  return fetch(EXEC,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],k:KEY})}).then(function(r){return r.json();});
}
function api(fn,args){
  return post_(fn,args).then(function(j){
    if(!j||!j.needKey)return j;
    var k=window.prompt('美容室用のキーを入力してください');
    if(!k)throw new Error('美容室用のキーが必要です');
    KEY=k.trim();
    return post_(fn,args).then(function(j2){
      if(j2&&j2.needKey){try{localStorage.removeItem('salonKey');}catch(e){}throw new Error('キーが違います');}
      try{localStorage.setItem('salonKey',KEY);}catch(e){}
      return j2;
    });
  }).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||'失敗しました');return j.result;});
}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function shift(s,n){var p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n,12);return ymd(d);}
// 営業日: 朝 5 時までは前の日として開く
function today(){return ymd(new Date(Date.now()-5*3600000));}
var openDay=today(), day=openDay, cur=null, draft=null, seq=0, saving=false;
var me=''; try{me=localStorage.getItem('hairName')||'';}catch(e){}
var addStore='', addGen='', addFree='', roster={};

function mine(){for(var i=0;i<cur.stylists.length;i++)if(cur.stylists[i].name===me)return cur.stylists[i];return null;}
function setMe(n){me=n;try{if(n)localStorage.setItem('hairName',n);else localStorage.removeItem('hairName');}catch(e){}}
function pickView(){
  $('navw').style.display='none';$('wkw').style.display='none';$('bar').style.display='none';$('upd').textContent='';
  if(!cur.stylists.length){$('body').innerHTML='<div class="msg err">美容師が未登録です (Prince App の「美容師」タブに名前と有効のチェックを入れてください)</div>';return;}
  $('body').innerHTML='<div class="card pick"><div class="lb">自分の名前を押してください</div>'+cur.stylists.map(function(p,i){return '<button data-i="'+i+'">'+esc(p.name)+'</button>';}).join('')+'</div>';
  [].forEach.call(document.querySelectorAll('.pick button'),function(el){el.onclick=function(){setMe(cur.stylists[+el.getAttribute('data-i')].name);render();};});
}
function render(){
  var p=mine();
  if(!p){pickView();return;}
  $('navw').style.display='';$('wkw').style.display='';$('bar').style.display='';
  var v=draft||p, roll=roster[addStore], free=addGen===OTHER;
  var opts='';
  if(addStore&&roll){
    opts='<option value="">キャストを選ぶ</option>'+roll.map(function(g){return '<option value="'+esc(g)+'"'+(g===addGen?' selected':'')+'>'+esc(g)+'</option>';}).join('')+'<option value="'+OTHER+'"'+(free?' selected':'')+'>リストにない名前を入れる</option>';
  }
  $('body').innerHTML=
    '<div class="card"><div class="top"><b>'+esc(p.name)+'</b><button class="link" id="chg">名前を変える</button></div>'+
    '<div class="top" style="margin-top:8px"><span>今日の出勤</span><button class="att'+(v.on?' on':'')+'" id="att">'+(v.on?'出勤':'休み')+'</button></div></div>'+
    '<div class="card"><div class="lb">キャストを追加する</div>'+
    '<div class="st2">'+STORES.map(function(s){return '<button class="stb'+(addStore===s.id?' on':'')+'" data-s="'+esc(s.id)+'">'+esc(s.s)+'</button>';}).join('')+'</div>'+
    (addStore?(roll?'<div class="lb2">キャストの名前</div><select id="gen">'+opts+'</select>'+(free?'<input type="text" id="free" maxlength="30" placeholder="名前を入れる" style="margin-top:8px" value="'+esc(addFree)+'">':''):'<div class="note">名前を読み込み中...</div>'):'<div class="note">先にお店を押してください</div>')+
    '<button class="add" id="add">追加する</button></div>'+
    '<div class="card"><div class="lb">担当したキャスト '+v.casts.length+' 人</div>'+
    (v.casts.length?v.casts.map(function(c,i){return '<div class="who"><span class="s">'+esc(shortOf(c.store))+'</span><span class="g">'+esc(c.gen)+'</span><button class="del" data-i="'+i+'">消す</button></div>';}).join(''):'<div class="note">まだ入っていません</div>')+
    (p.extra?'<div class="note">このほかに、名前なしの分が '+p.extra+' 人あります</div>':'')+
    (new Date(day+'T12:00:00').getDay()===0?'<div class="note">日曜の分は週の集計 (月〜土) に入りません</div>':'')+'</div>';
  var w=cur.week, p0=w.start.split('-'), q0=w.end.split('-'), x={days:0,n:0};
  w.list.forEach(function(y){if(y.name===me)x=y;});
  $('wkh').textContent='今週の自分の集計 '+(+p0[1])+'/'+(+p0[2])+'(月) 〜 '+(+q0[1])+'/'+(+q0[2])+'(土)';
  $('wk').innerHTML='<table><tr><th>出勤日数</th><th>人数</th></tr><tr><td>'+x.days+'</td><td>'+x.n+'</td></tr></table>';
  $('upd').textContent='最終更新 '+cur.updated;
  $('nd').disabled=day>=today();
  $('tot').textContent='合計 '+(v.casts.length+p.extra)+' 人';
  var sv=$('sv'),dirty=!!draft;
  sv.className='sv'+(dirty?'':' clean');sv.disabled=!dirty;sv.textContent=dirty?'保存する':(p.saved?'保存済み':'未入力');
  function ed(){if(!draft)draft={on:p.on,casts:p.casts.slice()};return draft;}
  $('add').disabled=!(addStore&&addGen&&(!free||addFree.trim()));
  $('chg').onclick=function(){
    if(draft&&!window.confirm('保存していない入力があります。消して名前を変えますか？'))return;
    draft=null;setMe('');render();
  };
  $('att').onclick=function(){
    if(v.on&&(v.casts.length+p.extra)>0){window.alert('キャストが入っている日は「休み」にできません。先に「消す」を押してください');return;}
    var d=ed();d.on=!d.on;render();
  };
  [].forEach.call(document.querySelectorAll('.stb'),function(el){el.onclick=function(){
    var id=el.getAttribute('data-s');addStore=id;addGen='';addFree='';render();
    if(!roster[id])api('getSalonCasts',[id]).then(function(r){roster[id]=r.casts;if(addStore===id)render();}).catch(function(){roster[id]=[];if(addStore===id){addGen=OTHER;render();}});
  };});
  if($('gen'))$('gen').onchange=function(){addGen=$('gen').value;addFree='';render();};
  if($('free'))$('free').oninput=function(){addFree=$('free').value;$('add').disabled=!addFree.trim();};
  $('add').onclick=function(){
    var g=(free?addFree:addGen).replace(/[\s　]+/g,' ').trim();
    if(!g)return;
    if(v.casts.some(function(c){return c.store===addStore&&c.gen===g;})){window.alert(g+' さんはもう入っています');return;}
    var d=ed();d.casts=d.casts.concat([{store:addStore,gen:g}]);d.on=true;addGen='';addFree='';render();
  };
  [].forEach.call(document.querySelectorAll('.del'),function(el){el.onclick=function(){
    var d=ed(),i=+el.getAttribute('data-i');d.casts=d.casts.filter(function(c,j){return j!==i;});render();
  };});
  sv.onclick=function(){
    if(saving||!draft)return;
    var d=draft,my=seq;
    saving=true;sv.disabled=true;sv.textContent='保存中...';
    api('setHairDay',[day,me,d.on,d.casts]).then(function(res){
      if(my!==seq)return;
      if(draft===d)draft=null;
      cur=res;render();
    }).catch(function(e){window.alert('保存できませんでした: '+(e.message||e));render();}).then(function(){saving=false;});
  };
}
function load(){
  var my=++seq;
  $('dt').value=day;$('dt').max=today();
  $('body').innerHTML='<div class="msg">読み込み中...</div>';
  api('getHairDay',[day]).then(function(r){if(my===seq){cur=r;render();}}).catch(function(e){if(my===seq)$('body').innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>';});
}
function go(d){
  if(draft&&!window.confirm('保存していない入力があります。消して日付を変えますか？')){$('dt').value=day;return;}
  draft=null;day=d;load();
}
$('pd').onclick=function(){go(shift(day,-1));};
$('nd').onclick=function(){go(shift(day,1));};
$('dt').onchange=function(){if(/^\d{4}-\d{2}-\d{2}$/.test($('dt').value)&&$('dt').value<=today())go($('dt').value);else $('dt').value=day;};
// 開きっぱなしにしても、次の営業日には今日の画面へ戻す (入力途中なら動かさない)
setInterval(function(){var t=today();if(t!==openDay&&!draft&&!saving){openDay=t;day=t;load();}},60000);
load();
</script>
</body></html>
