<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F2A44">
<title>送迎シフト入力</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.4;background:#fff;color:#1F2A44;overflow-wrap:anywhere}
button,select,input{font-family:inherit}
[hidden]{display:none!important}
.page{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:110px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 6px 20px}
.ch h1{margin:0;font-size:26px;font-weight:900;white-space:nowrap}
.tb{height:36px;padding:0 12px;border:1.5px solid #1F2A44;background:#fff;border-radius:18px;font-size:14px;font-weight:700;cursor:pointer;color:#1F2A44}
.mn{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px}
.mn b{font-size:20px;font-weight:900}
.ib{width:44px;height:44px;border:1.5px solid #1F2A44;background:#fff;border-radius:22px;font-size:18px;font-weight:700;cursor:pointer;color:#1F2A44}
.sub{padding:0 20px 8px;font-size:13px;color:#6B6B6B}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #ECECEC}
.dow div{text-align:center;font-size:12px;font-weight:700;padding:5px 0;color:#6B6B6B}
.dow div:first-child{color:#D92D20}.dow div:last-child{color:#1D5BD8}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(100px,auto)}
.cell{display:flex;flex-direction:column;gap:2px;padding:3px 2px;border:0;border-right:1px solid #F1F1F1;border-bottom:1px solid #F1F1F1;min-width:0;overflow:hidden;background:#fff;cursor:pointer;color:#1F2A44;text-align:left}
.cell:disabled{cursor:default;opacity:.35}
.cell .n{display:inline-flex;align-items:center;height:22px;padding-left:4px;font-size:12px;font-weight:700}
.cell.today .n{justify-content:center;width:22px;padding:0;margin-left:2px;border-radius:11px;background:#1F2A44;color:#fff;font-weight:900}
.cell.empty{cursor:default;background:#fff}
.chip{display:block;font-size:11px;font-weight:700;line-height:15px;padding:1px 3px;border-radius:4px;background:#1F2A44;color:#fff;overflow:hidden;white-space:nowrap}
.chip.off{background:#fff;color:#6B6B6B;box-shadow:inset 0 0 0 1.5px #C9C9C9}
.chip.dr{background:#fff;color:#1F2A44;box-shadow:inset 0 0 0 1.5px #1F2A44}
.two{display:grid;grid-template-columns:1fr;gap:3px;margin-top:2px}
.tg{min-height:30px;font:inherit;font-size:11px;font-weight:700;border:1px solid #C3C8D1;border-radius:4px;background:#fff;color:#8A92A6;cursor:pointer;padding:0}
.tg.on{background:#1F2A44;border-color:#1F2A44;color:#fff}
.tg.dirty{border:2px dashed #D97706}
.tg:disabled{opacity:.35;cursor:default}
.cell{cursor:default}
.cell.on{background:#E6E9F0}
.msg{padding:26px 10px;text-align:center;font-size:17px;color:#666}
.err{color:#B91C1C}
.pick{padding:0 20px}
.pick .lb{font-size:16px;font-weight:700;margin:14px 0 4px}
.pick button{display:block;width:100%;min-height:60px;margin-top:10px;font-size:19px;font-weight:700;border:1.5px solid #1F2A44;border-radius:14px;background:#fff;color:#1F2A44;cursor:pointer}
.cell.dirty{background:#FFF4D6;outline:2px dashed #D97706;outline-offset:-2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #ECECEC;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:480px;margin:0 auto}
.bar button{display:block;width:100%;min-height:56px;font-size:19px;font-weight:900;border:0;border-radius:14px;background:#1F2A44;color:#fff;cursor:pointer}
.bar button:disabled{background:#E3E3E3;color:#9A9A9A;cursor:default}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.ovb{background:#fff;border-radius:18px;padding:26px 20px 18px;max-width:380px;width:100%;text-align:center}
.ovb .big{font-size:30px;font-weight:900;line-height:1.3;margin-bottom:10px}
.ovb .det{font-size:16px;margin-bottom:8px}
.ovb .bad{font-size:16px;font-weight:700;color:#B91C1C;margin-bottom:8px}
.ovb button{display:block;width:100%;min-height:52px;margin-top:10px;font-size:17px;font-weight:700;border:1.5px solid #1F2A44;border-radius:12px;background:#fff;color:#1F2A44;cursor:pointer}
.ovb button.pri{background:#1F2A44;color:#fff}
</style></head><body>
<div class="page">
  <div class="ch"><h1>送迎 シフト入力</h1><div><button class="tb" id="who" hidden></button></div></div>
  <div id="body"><div class="msg">読み込み中...</div></div>
</div>
<div class="bar" id="bar" hidden><div class="bar-in"><button id="dec" disabled>決定</button></div></div>
<div class="ov" id="ov" hidden><div class="ovb" id="ovb"></div></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyAasZtWwNfYKyYRbV41yncBNdbBrtXHzcXknU-aG6-xHuo7xWtdg8NoxWDxhkwTzBq/exec";
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 鍵は送迎用の鍵 sougeiKey (?k= -> localStorage)・名前は driverName
var KEY='';
try{
  var u0=new URL(location.href),k0=u0.searchParams.get('k');
  if(k0){localStorage.setItem('sougeiKey',k0);u0.searchParams.delete('k');history.replaceState(null,'',u0.pathname+u0.search+u0.hash);}
  KEY=localStorage.getItem('sougeiKey')||'';
}catch(e){}
function post_(fn,args){
  return fetch(EXEC,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],k:KEY})}).then(function(r){return r.json();});
}
function api(fn,args){
  return post_(fn,args).then(function(j){
    if(!j||!j.needKey)return j;
    var k=window.prompt('送迎用のキーを入力してください');
    if(!k)throw new Error('送迎用のキーが必要です');
    KEY=k.trim();
    return post_(fn,args).then(function(j2){
      if(j2&&j2.needKey){try{localStorage.removeItem('sougeiKey');}catch(e){}throw new Error('キーが違います');}
      try{localStorage.setItem('sougeiKey',KEY);}catch(e){}
      return j2;
    });
  }).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||'失敗しました');return j.result;});
}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return ymd(new Date(Date.now()-5*3600000));}
var DOW=['日','月','火','水','木','金','土'];
var me=''; try{me=localStorage.getItem('driverName')||'';}catch(e){}
var month=today().slice(0,7), cur=null, seq=0, names=null;
function setMe(n){me=n;try{if(n)localStorage.setItem('driverName',n);else localStorage.removeItem('driverName');}catch(e){}}
function addMonth(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5)-1+n;return ymd(new Date(y,m,1,12)).slice(0,7);}
function pickName(){
  cur=null;base={};$('bar').hidden=true;
  $('who').hidden=true;
  if(!names||!names.length){$('body').innerHTML='<div class="msg err">ドライバーが未登録です</div>';return;}
  $('body').innerHTML='<div class="pick"><div class="lb">自分の名前を押してください</div>'+names.map(function(n,i){return '<button data-i="'+i+'">'+esc(n)+'</button>';}).join('')+'</div>';
  [].forEach.call(document.querySelectorAll('.pick button'),function(el){el.onclick=function(){setMe(names[+el.getAttribute('data-i')]);load();};});
}
function render(){
  var c=cur,t=today(),p=c.first.split('-'),first=new Date(+p[0],+p[1]-1,1,12),lead=first.getDay(),last=+c.last.slice(8),h='';
  $('who').hidden=false;$('who').textContent=me+'　変更';
  h+='<div class="mn"><button class="ib" id="pm">‹</button><b>'+(+p[0])+'年'+(+p[1])+'月</b><button class="ib" id="nm">›</button></div>';
  h+='<div class="sub">出られる日の「朝」「帰り」をタップ。もう一度で取り消し。最後に下の「決定」を押すと反映されます。点線の枠はまだ決定していない日です。</div>';
  h+='<div class="dow">'+DOW.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div><div class="grid">';
  var dset={};dirtyKeys().forEach(function(x){dset[x]=1;});
  for(var i=0;i<lead;i++)h+='<div class="cell empty"></div>';
  for(var d=1;d<=last;d++){
    var k=c.month+'-'+pad(d),st=c.days[k]||{go:false,back:false},past=k<t,dis=(past||saving)?' disabled':'',bs=base[k]||{};
    h+='<div class="cell'+(k===t?' today':'')+(dset[k]?' dirty':'')+'"><span class="n">'+d+'</span><div class="two"><button class="tg'+(st.go?' on':'')+(!!st.go!==!!bs.go?' dirty':'')+'" data-d="'+k+'" data-w="go"'+dis+'>朝</button><button class="tg'+(st.back?' on':'')+(!!st.back!==!!bs.back?' dirty':'')+'" data-d="'+k+'" data-w="back"'+dis+'>帰</button></div></div>';
  }
  h+='</div>';
  $('body').innerHTML=h;barUpdate();
  $('pm').onclick=function(){guard(function(){month=addMonth(month,-1);load();});};
  $('nm').onclick=function(){guard(function(){month=addMonth(month,1);load();});};
  [].forEach.call(document.querySelectorAll('.tg'),function(el){el.onclick=function(){toggle(el.getAttribute('data-d'),el.getAttribute('data-w'));};});
}
function sig(st){return st?((st.go?1:0)+''+(st.back?1:0)):'00';}

// 決定ボタン方式 (2026-11-21 H 指示): タップは画面上だけ・下の「決定」でまとめて保存・保存したら「反映しました」を大きく出す
// base = サーバーに保存済みの状態 / cur.days = 画面の状態。違う日 = 未決定 (点線の枠)。保存は 1 日ずつ順に呼ぶ (失敗した日だけ未決定のまま残す)
var base={}, saving=false;
function clone(x){return JSON.parse(JSON.stringify(x));}
function snap(){base=clone(cur.days);}
function dirtyKeys(){
  if(!cur)return [];
  var seen={},r=[];
  Object.keys(cur.days).concat(Object.keys(base)).forEach(function(k){if(seen[k])return;seen[k]=1;if(sig(cur.days[k])!==sig(base[k]))r.push(k);});
  return r.sort();
}
function dayList(ks){return ks.map(function(k){return (+k.slice(8))+'日';}).join('・');}
function showOv(h,btns){
  $('ovb').innerHTML=h+btns.map(function(b,i){return '<button data-i="'+i+'"'+(b.pri?' class="pri"':'')+'>'+esc(b.t)+'</button>';}).join('');
  [].forEach.call($('ovb').querySelectorAll('button'),function(el){el.onclick=function(){var b=btns[+el.getAttribute('data-i')];$('ov').hidden=true;if(b.f)b.f();};});
  $('ov').hidden=false;
}
function barUpdate(){
  var n=dirtyKeys().length;
  $('bar').hidden=false;$('dec').disabled=(n===0||saving);
  $('dec').textContent=saving?'反映中...':(n?'決定（'+n+' 件）':'決定');
}
// 未決定の変更があるまま 月・名前を変える時は止める (画面内の確認)
function guard(f){
  if(saving)return;
  var n=dirtyKeys().length;
  if(!n){f();return;}
  showOv('<div class="big">決定していない変更があります</div><div class="det">'+n+' 件がまだ保存されていません。</div>',[{t:'戻って決定する',pri:true},{t:'変更を捨てて移る',f:f}]);
}
window.addEventListener('beforeunload',function(e){if(saving||dirtyKeys().length){e.preventDefault();e.returnValue='';return '';}});
$('dec').onclick=function(){decide();};
function decide(){
  if(saving)return;
  var ks=dirtyKeys();
  if(!ks.length)return;
  saving=true;render();
  var m=month,ok=[],ng=[],last=null,i=0;
  (function next(){
    if(i>=ks.length)return fin();
    var d=ks[i++];
    api('setSougeiShiftDays',[me,[{date:d,go:!!(cur.days[d]&&cur.days[d].go),back:!!(cur.days[d]&&cur.days[d].back)}]]).then(function(r){
      ok.push(d);last=r;
      if(cur.days[d])base[d]=clone(cur.days[d]);else delete base[d];
    }).catch(function(){ng.push(d);}).then(next);
  })();
  function fin(){
    saving=false;
    if(!ng.length&&last&&last.month===m){cur=last;snap();}
    render();
    var mm=(+m.slice(5))+'月';
    var h=ng.length&&!ok.length?'<div class="big">反映できませんでした</div>':(ng.length?'<div class="big">一部だけ反映しました</div>':'<div class="big">反映しました</div>');
    if(ok.length)h+='<div class="det">'+mm+' '+ok.length+' 件（'+esc(dayList(ok))+'）</div>';
    if(ng.length)h+='<div class="bad">'+esc(dayList(ng))+'は反映できませんでした。もう一度決定を押してください。</div>';
    showOv(h,[{t:'OK',pri:true}]);
  }
}
function toggle(d,w){
  if(saving)return;
  var st=cur.days[d]||{go:false,back:false,goT:'',backT:''};
  st[w]=!st[w];cur.days[d]=st;
  render();
}
$('who').onclick=function(){guard(function(){setMe('');pickName();});};
function load(){
  var my=++seq;cur=null;base={};$('bar').hidden=true;
  api('getSougeiShiftMonth',[me,month]).then(function(r){
    if(my!==seq)return;
    names=r.drivers;
    if(!me||names.indexOf(me)<0){setMe('');pickName();return;}
    cur=r;snap();render();
  }).catch(function(e){if(my===seq)$('body').innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>';});
}
load();
</script>
</body></html>
