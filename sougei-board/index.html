<style>:root{--pri:#1F2A44;--priD:#2E4372;--priL:#E6E9F0;--bg:#F4F5F7;--line:#C3C8D1;--tx:#1a1a1a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:16px;line-height:1.4;background:#fff;color:var(--tx);overflow-wrap:anywhere}
button,select,input{font-family:inherit}
[hidden]{display:none!important}
.page{max-width:820px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}.top h1{margin:0;font-size:26px;font-weight:900}
.tb{height:36px;padding:0 12px;border:1.5px solid var(--pri);background:#fff;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer;color:var(--pri);display:inline-flex;align-items:center;text-decoration:none}
.ib{width:44px;height:44px;border:1.5px solid var(--pri);background:#fff;border-radius:4px;font-size:18px;font-weight:700;cursor:pointer;color:var(--pri);flex-shrink:0}
.tabs{display:flex;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--priL);margin-top:6px}
.tabs button{flex:1;height:48px;border:0;background:#fff;font-size:15px;font-weight:700;color:#6B7285;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px 20px}.nav b{font-size:20px;font-weight:900}.nav .r{display:flex;align-items:center;gap:4px}
.sum{display:flex;gap:8px;padding:6px 16px 6px;flex-wrap:wrap;align-items:center}
.sum .k{border:1px solid var(--priL);border-radius:4px;padding:5px 10px;display:flex;flex-direction:column;min-width:78px}
.sum .k small{font-size:12px;color:#6B7285}.sum .k b{font-size:20px;font-weight:900}
.sum .k.un b{color:#B91C1C}
.lw{margin:4px 16px 8px;padding:8px 12px;border-radius:4px;background:var(--bg);font-size:13px;color:#4A5370}.lw b.ok{color:#15803D}.lw b.no{color:#B91C1C}
.lh{margin:16px 16px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.lh b{font-size:18px;font-weight:900}.lh small{font-size:12px;color:#6B7285}
.lr{display:flex;align-items:stretch;width:100%;border-bottom:1px solid var(--priL);background:#fff;color:var(--pri);font-size:16px}
.lr.cx{opacity:.55}
.lr.d{background:#F0FDF4}.lr.n{background:#FFF7ED}.lr.c{background:var(--bg)}
.lr.pend{opacity:.5;pointer-events:none}
.rt{flex-shrink:0;width:104px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.whoBar{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:10px 12px;border-radius:4px;background:var(--bg)}.whoBar label{font-size:13px;font-weight:900;flex-shrink:0}.whoBar select{flex:1;min-width:0;height:44px;font-size:16px;font-weight:700;border-radius:4px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);padding:0 8px}
.wbox{margin:8px 16px 0}.wbox input{width:100%;height:44px;font-size:16px;padding:0 12px;border:1.5px solid var(--line);border-radius:4px;margin:8px 0}
.wsub{margin:6px 16px 0;font-size:12px;font-weight:700;color:#6B7285}
.sg{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.sg button{height:44px;padding:0 14px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--pri)}
.sg .no{font-size:13px;color:#6B7285;align-self:center}
.ab{flex-shrink:0;height:52px;border:1.5px solid var(--pri);border-radius:4px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:var(--pri);width:100%}
.ab.pr{border:0;background:var(--pri);color:#fff}
.lr .tm{width:58px;flex-shrink:0;font-size:15px;font-weight:700;color:#4A5370}
.lr .fl{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.lr .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lr .nm b{font-size:17px;font-weight:900}
.lr .sb{font-size:12px;color:#6B7285;white-space:normal}
.lr .dr{text-align:right;font-size:13px;font-weight:700}.lr .dr small{display:block;font-size:12px;font-weight:400;color:#6B7285}
.lr .dr.un{color:#B91C1C}
.tg{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;flex-shrink:0}
.tg.ex{background:#EDE9FE;color:#6D28D9}.tg.dou{background:#DCFCE7;color:#15803D}.tg.vis{background:var(--priL);color:var(--priD)}.tg.sh{background:var(--priL);color:#4A5370}.tg.cx{background:#FEE2E2;color:#B91C1C}
.lnone{padding:14px 16px;font-size:14px;color:#8A92A6;border-bottom:1px solid var(--priL)}
.msg{padding:26px 16px;text-align:center;font-size:16px;color:#666}.err{color:#B91C1C}
.upd{font-size:13px;color:#8A92A6;text-align:center;margin:14px 0 24px}
.note{font-size:13px;color:#B91C1C;margin:6px 20px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--priL)}
.dow div{text-align:center;font-size:12px;font-weight:700;padding:5px 0;color:#6B7285}
.dow div:nth-child(6){color:#1D5BD8}.dow div:last-child{color:#D92D20}
.sgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--priL)}
.sd{display:flex;flex-direction:column;gap:3px;min-height:120px;padding:4px 3px;border:0;border-right:1px solid var(--priL);border-bottom:1px solid var(--priL);background:#fff;cursor:pointer;text-align:left;color:var(--pri);min-width:0;overflow:hidden}
.sd:disabled{cursor:default;opacity:.45}
.sd .n{font-size:13px;font-weight:700}.sd.today{background:var(--bg)}.sd.today .n{color:#fff;background:var(--pri);border-radius:4px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.sd .cs{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:block;font-size:12px;font-weight:700;line-height:17px;padding:1px 4px;border-radius:4px;background:var(--pri);color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip small{font-weight:400;opacity:.85;font-size:10px}
.chip.l{background:var(--priL);color:var(--pri)}.chip.r{background:#FEE2E2;color:#B91C1C}
.shnone{font-size:12px;color:#B0B6C6}
.sdt{font-size:13px;color:#6B7285;padding:0 20px 8px}
.dh{display:flex;align-items:center;padding:10px 8px 0 4px}
.back{height:44px;display:flex;align-items:center;gap:2px;padding:0 10px;font-size:15px;font-weight:700;color:var(--pri);border:0;background:none;cursor:pointer}
.dt{padding:0 20px 10px}.dt b{font-size:26px;font-weight:900}.dt .s{display:block;font-size:13px;color:#6B7285}
.kv{margin:0 16px;border-top:1px solid var(--priL)}

.fm{margin:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.fm label{font-size:13px;font-weight:700;color:#4A5370}
.fm select{height:52px;border-radius:4px;border:1.5px solid var(--pri);background:#fff;padding:0 12px;font-size:17px;width:100%;color:var(--pri)}
.big{height:52px;border:0;border-radius:4px;font-size:16px;font-weight:900;cursor:pointer;background:var(--pri);color:#fff;width:100%}
.big:disabled{background:#E3E6EE;color:#8A92A6;cursor:default}
.hint{font-size:12px;color:#6B7285}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:#fff;border-radius:4px;padding:10px 16px;font-size:14px;max-width:90%;z-index:30}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:4px 4px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh .t1{font-size:18px;font-weight:900;display:block}.sh .t2{font-size:13px;color:#6B7285;display:block}
.sh .x{background:var(--bg);border:0}
.sheet .big{position:sticky;bottom:-24px;box-shadow:0 -10px 10px #fff;flex-shrink:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--priL)}
.srow>b{font-size:16px;font-weight:700}
.sseg{display:flex;gap:6px}
.sseg button{min-height:44px;min-width:72px;padding:0 14px;border-radius:4px;font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--pri)}
.sseg button.on{border:0;background:var(--pri);color:#fff}
@media (max-width:640px){
 #sDow{display:none}
 .sgrid{display:block}
 .sd{flex-direction:row;align-items:center;gap:10px;min-height:56px;width:100%;border-right:0;padding:6px 16px}
 .sd .n,.sd.today .n{flex-shrink:0;width:72px;height:auto;display:block;background:none;color:var(--pri);border-radius:0;font-weight:900}
 .sd.today{background:var(--bg)}
 .rt{width:96px}
}

body{background:var(--bg)}

.cn div:first-child{border-left:0}
.cn div small{font-size:11px;color:#6B7285;white-space:normal;line-height:1.25;letter-spacing:0}

.cn.sm4 div b{font-size:24px}.cn.sm4 .op{flex:0 0 18px;border:0;padding:8px 0;align-items:center;justify-content:center;font-weight:900;color:#6B7285;font-size:16px}

.sumMsg{margin:0 16px 4px;font-size:14px;font-weight:900}.sumMsg.ng{color:#B91C1C}.sumMsg.ok{color:#15803D}
.sumSty{margin:0 16px 8px;font-size:13px;color:#4A4A4A}

.tgs{display:flex;gap:6px;flex-shrink:0}
.tgb{width:74px;height:46px;padding:0;border-radius:4px;border:1.5px solid var(--line);background:#fff;color:#6B7285;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tgb.hm.on{background:#15803D;border-color:#15803D;color:#fff}
.tgb.cl.on{background:#C2410C;border-color:#C2410C;color:#fff}
.lr{padding:8px 10px 8px 16px;gap:8px;align-items:center}
.lr.d{background:#F0FDF4}.lr.n{background:#FFF4EC}
.lr .tm{width:auto;min-width:44px;white-space:nowrap;font-size:14px}.lr .tm small{display:block;font-size:11px;font-weight:400;color:#6B7285}

.lr .dr{text-align:left;display:block}.lr .dr small{display:inline;margin-left:6px}

<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyAasZtWwNfYKyYRbV41yncBNdbBrtXHzcXknU-aG6-xHuo7xWtdg8NoxWDxhkwTzBq/exec";
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 鍵なし (2026-11-26 H)。古い URL の ?k= は読み捨てる。?as=staff = 黒服ポータルから来た印 (戻るリンク・入れた人 = 黒服)
var KEY='',STAFF=false;
try{
  var u0=new URL(location.href),ch=false;
  if(u0.searchParams.get('k')){u0.searchParams.delete('k');ch=true;}
  if(u0.searchParams.get('as')==='staff'){try{sessionStorage.setItem('sgAs','staff');}catch(e){}u0.searchParams.delete('as');ch=true;}
  if(ch)history.replaceState(null,'',u0.pathname+u0.search+u0.hash);
  if(sessionStorage.getItem('sgAs')==='staff'){STAFF=true;$('toPortal').hidden=false;KEY=localStorage.getItem('ivKey')||'';} // 黒服ポータルから来た時だけ黒服の鍵を付ける = 「入れた人」が 黒服 になる (鍵は URL にも画面にも出さない)
}catch(e){}
function api(fn,args){
  return fetch(EXEC,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[],k:KEY})}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.needKey&&KEY){KEY='';return api(fn,args);} // 黒服の鍵が古い時は鍵なしでやり直す (送迎の画面は鍵なしで動く)
    if(!j||!j.ok)throw new Error(j&&j.error||'失敗しました');return j.result;});
}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
var DOWS=['日','月','火','水','木','金','土'];
function bizLocal(){return ymd(new Date(Date.now()-5*3600000));}
function monOfS(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function mdw(s){var p=parse(s);return (p.getMonth()+1)+'/'+p.getDate()+' ('+DOWS[p.getDay()]+')';}
function md(s){return mdw(s).replace(/ \(.\)/,'');}
function sErr(id,e){$(id).innerHTML='<div class="msg err">読み込めませんでした<br><small>'+esc(e.message||e)+'</small></div>';}
var toastT=0;
function toast(m){if(!m)return;var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},3500);}
var today=bizLocal();
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function carNo(no){return String(no||'').replace(/^\s*(NO\.?|No\.?|no\.?|ＮＯ|№)\s*/,'').replace(/\s*番\s*$/,'');}

// ---------- 当日 (一覧) ----------
// 2026-11-26 H: 当日の送迎が出勤簿のように上から一覧で出る。行き / 帰り・乗る子・時刻・乗る場所・ドライバー・車 NO。行を押すと処理の画面 (ドライバーの付け替え・LINE WORKS の状態)。並びは 時刻 → 同伴 → 来店 → 店番
var listDay='', board=null, listSeq=0, rows={};
function rkey(x){return x.dir+'|'+x.store+'|'+x.name;}
function tmOf(x){return x.dir==='go'?(x.pick||x.time||''):(x.time||'');}
function banN(x){var n=parseInt(x.ban,10);return isNaN(n)?9999:n;}
function sortX(a,b){var ta=tmOf(a),tb=tmOf(b);if(ta!==tb)return !ta?1:!tb?-1:ta<tb?-1:1;var ra=a.dohan?0:a.visit?1:2,rb=b.dohan?0:b.visit?1:2;return ra-rb||banN(a)-banN(b)||(a.name<b.name?-1:a.name>b.name?1:0);}
function loadList(){
  var my=++listSeq;if(!listDay)listDay=today;
  $('lTitle').textContent=mdw(listDay)+(listDay===today?' 今日':'');
  $('lBody').innerHTML='<div class="msg">読み込み中...</div>';
  api('getSougeiBoard',[listDay]).then(function(r){if(my!==listSeq)return;setBoard(r);renderList();}).catch(function(e){if(my===listSeq)sErr('lBody',e);});
}
function setBoard(r){board=r;rows={};r.go.concat(r.back,r.cancelled).forEach(function(x){rows[rkey(x)]=x;});}
function drvOf(name){var o=null;(board.drivers||[]).forEach(function(d){if(d.name===name)o=d;});return o;}
function stOf(x){return x.ride==='済'?'hm':(x.ride==='乗らず'||x.ride==='キャンセル')?'cl':'';}
function hmLbl(x){return x.dir==='go'?'乗せた':'送った';}
// 札: 右に 2 ボタン [乗せた/送った] [キャンセル]。1 回押すと ON・もう 1 回で OFF (reset)。乗らず も キャンセル ON として出す
function btnsHtml(x){var st=stOf(x);return '<span class="tgs"><button type="button" class="tgb hm'+(st==='hm'?' on':'')+'" data-w="hm" aria-pressed="'+(st==='hm')+'">'+hmLbl(x)+'</button><button type="button" class="tgb cl'+(st==='cl'?' on':'')+'" data-w="cl" aria-pressed="'+(st==='cl')+'">キャンセル</button></span>';}
function lineHtml(x,cx){
  var tags='';
  if(x.extra)tags+='<span class="tg ex">予定外</span>';
  if(x.dohan)tags+='<span class="tg dou">同伴</span>';else if(x.visit)tags+='<span class="tg vis">来店</span>';
  if(x.after)tags+='<span class="tg vis">アフター</span>';
  if(x.cancel)tags+='<span class="tg cx">'+esc(x.cancel)+'</span>';
  var tm=x.dir==='go'?(x.pick||x.time||'—'):(x.time||'—'),tmS=x.dir==='go'&&x.pick?'迎え':'';
  var pl=x.place==='自宅'?('自宅'+(x.town?' '+x.town:'')):(x.place||'');
  var d=drvOf(x.driver),st=stOf(x);
  var dr=cx?'<span class="dr">送迎なし</span>':x.ride?'<span class="dr">'+esc(x.rideBy||'')+(x.rideAt?'<small>'+esc(x.rideAt)+'</small>':'')+'</span>':x.driver?'<span class="dr">'+esc(x.driver)+(d&&d.no?'<small>車 NO.'+esc(carNo(d.no))+'</small>':'')+'</span>':x.bin==='店スタッフ'&&x.dir==='back'?'<span class="dr">店スタッフ</span>':'<span class="dr un">ドライバー未定</span>';
  var main='<span class="tm">'+esc(tm)+(tmS?'<small>'+tmS+'</small>':'')+'</span><span class="fl"><span class="nm"><b>'+esc(x.name)+'</b>'+tags+'</span><span class="sb">'+esc(x.shop)+(x.ban?' '+esc(x.ban)+'番':'')+(pl?' · '+esc(pl):'')+(x.bin?' · '+esc(x.bin):'')+'</span>'+dr+'</span>';
  var rc=cx?'':'<span class="rc">'+btnsHtml(x)+(STAFF&&!x.extra?'<button type="button" class="dtl" aria-label="'+esc(x.name)+' の詳細">詳細</button>':'')+'</span>';
  return '<div class="lr'+(cx?' cx':(st==='hm'?' d':st==='cl'?' n':''))+'" data-k="'+esc(rkey(x))+'">'+main+rc+'</div>';
}
// 集計: 予定 = 乗せた(送った) + キャンセル + まだ。予定 = その便の札の総数 (予定外を含む・送迎なし扱いは数えない)。ドライバー別 = 済の札の rideBy
function sumRow(lbl,list,ok){
  var n=list.length,hm=0,cl=0;
  list.forEach(function(x){var st=stOf(x);if(st==='hm')hm++;else if(st==='cl')cl++;});
  return {n:n,hm:hm,cl:cl,rest:n-hm-cl,html:'<div class="cn sm4"><div><small>'+lbl+' 予定</small><b>'+n+'</b></div><div class="op">＝</div><div><small style="color:#15803D">'+ok+'</small><b>'+hm+'</b></div><div class="op">＋</div><div><small style="color:#C2410C">キャンセル</small><b>'+cl+'</b></div><div class="op">＋</div><div><small>まだ</small><b>'+(n-hm-cl)+'</b></div></div>'};
}
function summaryHtml(r){
  var g=sumRow('行き',r.go,'乗せた'),b=sumRow('帰り',r.back,'送った'),rest=g.rest+b.rest,by={};
  [[r.go,'go'],[r.back,'back']].forEach(function(p){p[0].forEach(function(x){if(stOf(x)==='hm'){var k=x.rideBy||'ドライバー不明';(by[k]=by[k]||{go:0,back:0})[p[1]]++;}});});
  var names=Object.keys(by).sort(function(a,c){return (by[c].go+by[c].back)-(by[a].go+by[a].back)||(a<c?-1:1);});
  return g.html+b.html+'<div class="sumMsg '+(rest>0?'ng':'ok')+'">'+(rest>0?'まだ押していない子が '+rest+' 人います':'全員 押しました')+'</div>'+
    '<div class="sumSty">'+(names.length?names.map(function(k){return esc(k)+'　行き '+by[k].go+'・帰り '+by[k].back;}).join(' / '):'ドライバー別: まだいません')+'</div>'+
    (STAFF?'<div class="sumSty">車 未定 '+r.undecided+'</div>':'');
}
function renderList(){
  var r=board,h='';
  $('lUpd').textContent='最終更新 '+r.updated;
  $('lNote').innerHTML=r.notes&&r.notes.length?'<div class="note">'+r.notes.map(esc).join(' / ')+'</div>':'';
  fillDrv();
  $('lWalk').hidden=listDay>today;
  $('lSum').innerHTML=summaryHtml(r);
  [['go','行き',r.go],['back','帰り',r.back]].forEach(function(s){
    h+='<div class="lh"><b>'+s[1]+'</b><small>'+s[2].length+' 人</small></div>';
    if(!s[2].length)h+='<div class="lnone">'+s[1]+'の送迎はありません</div>';
    s[2].slice().sort(sortX).forEach(function(x){h+=lineHtml(x,false);});
  });
  if(r.cancelled.length){h+='<div class="lh"><b>当欠・欠勤</b><small>送迎なし '+r.cancelled.length+' 人</small></div>';r.cancelled.slice().sort(sortX).forEach(function(x){h+=lineHtml(x,true);});}
  $('lBody').innerHTML=h;
  [].forEach.call($('lBody').querySelectorAll('.lr:not(.cx)'),function(row){
    var k=row.getAttribute('data-k');
    [].forEach.call(row.querySelectorAll('.tgb'),function(b){b.onclick=function(){tog(rows[k],row,b.getAttribute('data-w'));};});
    var dt=row.querySelector('.dtl');if(dt)dt.onclick=function(){openRow(k);};
  });
  renderWalk();
}
// ---- ドライバー (あなたの名前)。1 回選ぶと端末が覚える。黒服が代わりに押す時もここで選ぶ ----
function fillDrv(){
  var sel=$('lDrv'),cur=sel.value||lsGet('sgDriver')||'',ds=(board&&board.drivers)||[],ok=false;
  ds.forEach(function(d){if(d.name===cur)ok=true;});
  sel.innerHTML='<option value="">選んでください</option>'+ds.map(function(d){return '<option value="'+esc(d.name)+'">'+esc(d.name)+(d.on?' ○':'')+'</option>';}).join('');
  sel.value=ok?cur:'';
}
$('lDrv').onchange=function(){if($('lDrv').value){lsSet('sgDriver',$('lDrv').value);$('lErr').hidden=true;}};
function needDrv(){
  var v=$('lDrv').value;
  if(!v){$('lErr').hidden=false;var sel=$('lDrv');sel.scrollIntoView({block:'center'});try{sel.focus({preventScroll:true});}catch(e){}return '';}
  $('lErr').hidden=true;lsSet('sgDriver',v);return v;
}
// ---- 書き込み (1 つずつ)。押した札はすぐ「処理中」にして、返事が来るまで押せない。失敗したら元に戻してエラー表示 ----
var rbusy=false;
function rowEl(k){var o=null;[].forEach.call($('lBody').querySelectorAll('.lr'),function(r){if(r.getAttribute('data-k')===k)o=r;});return o;}
function rideDo(row,fn,args){
  if(rbusy)return;rbusy=true;
  if(row){row.classList.add('pend');[].forEach.call(row.querySelectorAll('.tgb'),function(b){b.textContent='処理中…';});}
  api(fn,args).then(function(r){rbusy=false;setBoard(r);if(!$('vList').hidden)renderList();toast(r.saved?'記録しました':'すでに同じ記録です');}).catch(function(e){rbusy=false;if(!$('vList').hidden)renderList();window.alert(e.message||e);});
}
// 2 つのトグル: 乗せた(送った)=済 / キャンセル。ON をもう 1 回押すと reset・片方 ON 中にもう片方を押すとそのまま切り替え (サーバーに 1 回)
function tog(x,row,w){
  if(rbusy||!x)return;
  var cur=stOf(x),a,drv=$('lDrv').value;
  if(w===cur)a='reset';else if(w==='hm'){a='done';drv=needDrv();if(!drv)return;}else a='cancel';
  rideDo(row,'setSougeiRide',[listDay,x.dir,x.store,x.name,a,drv]);
}
// ---- 予定に無い子 (在籍一覧から頭文字で探す。押すと即その便に足して済) ----
var wDir='go',castAll=null,castLoading=false,castErr='',SHORT={'RegentClub千歳':'RC','328':'328','WAVE千歳':'WAVE','花もみじ千歳':'花もみじ'};
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96);}).replace(/\s+/g,'');}
function loadCast(){
  if(castAll||castLoading)return;
  castLoading=true;castErr='';
  api('getSalonCastAll',[]).then(function(r){castAll=r.casts;castLoading=false;renderWalk();}).catch(function(e){castLoading=false;castErr=String(e&&e.message||e);renderWalk();});
}
function renderWalk(){
  if($('lWalk').hidden)return;
  var q=norm($('wName').value),h='';
  [].forEach.call($('wDir').querySelectorAll('button'),function(b){b.className=b.getAttribute('data-d')===wDir?'on':'';});
  if(!q){$('wSug').innerHTML='';return;}
  if(!castAll&&castErr)h='<span class="no">名前の一覧を読み込めませんでした: '+esc(castErr)+'</span>';
  else if(!castAll)h='<span class="no">名前の一覧を読み込み中...</span>';
  else{
    var hits=castAll.filter(function(c){return norm(c.gen).indexOf(q)===0;});
    if(!hits.length)h='<span class="no">合う名前がありません</span>';
    else hits.slice(0,8).forEach(function(c){h+='<button type="button" data-k="'+esc(c.store)+'|'+esc(c.gen)+'">'+esc(c.gen)+' · '+esc(SHORT[c.store]||c.store)+'</button>';});
  }
  $('wSug').innerHTML=h;
  [].forEach.call($('wSug').querySelectorAll('button'),function(b){b.onclick=function(){
    if(rbusy)return;
    var k=b.getAttribute('data-k').split('|'),store=k[0],gen=k.slice(1).join('|'),ex=rows[wDir+'|'+store+'|'+gen];
    if(ex&&!ex.cancel){window.alert(gen+' さんは '+(wDir==='go'?'行き':'帰り')+'の一覧にいます。一覧の札を押してください');return;}
    var drv=needDrv();if(!drv)return;
    b.textContent='処理中…';b.disabled=true;
    $('wName').value='';
    rideDo(null,'addSougeiWalkin',[listDay,wDir,store,gen,drv]);
  };});
}
$('wName').oninput=function(){loadCast();renderWalk();};
$('wName').onfocus=loadCast;
[].forEach.call($('wDir').querySelectorAll('button'),function(b){b.onclick=function(){wDir=b.getAttribute('data-d');renderWalk();};});
$('lPrev').onclick=function(){listDay=shift(listDay||today,-1);loadList();};
$('lNext').onclick=function(){listDay=shift(listDay||today,1);loadList();};
$('lToday').onclick=function(){listDay=today;loadList();};

// ---------- 処理の画面 ----------
var curKey='', pushed=false, saving=false;
function openRow(k){curKey=k;pushed=true;history.pushState(null,'','#r='+encodeURIComponent(k));route();}
function renderRow(){
  var x=rows[curKey];
  if(!x){$('rName').textContent='見つかりません';$('rSub').textContent='一覧を読み直してください';$('rKv').innerHTML='';return;}
  $('rName').textContent=x.name;
  $('rSub').textContent=mdw(listDay)+' · '+(x.dir==='go'?'行き':'帰り')+' · '+x.shop+(x.ban?' '+x.ban+'番':'');
  var pl=x.place==='自宅'?('自宅'+(x.town?' '+x.town:'')):(x.place||'—'),kv=[];
  kv.push(['向き',x.dir==='go'?'行き (お迎え)':'帰り (お送り)']);
  kv.push([x.dir==='go'?'乗る場所':'送り先',pl]);
  kv.push([x.dir==='go'?'到着希望':'退勤',x.time||'—']);
  if(x.pick)kv.push(['お迎え時刻',x.pick]);
  kv.push(['便',(x.bin||'未定')+(x.order?' 順'+x.order:'')]);
  if(x.dohan)kv.push(['同伴','あり']);else if(x.visit)kv.push(['来店','あり']);
  if(x.after)kv.push(['アフター','あり']);
  if(x.by)kv.push(['最後に直した人',x.by]);
  $('rKv').innerHTML=kv.map(function(p){return '<div><span>'+esc(p[0])+'</span><b>'+esc(p[1])+'</b></div>';}).join('');
  var names=board.drivers.map(function(d){return d.name;});if(x.driver&&names.indexOf(x.driver)<0)names.unshift(x.driver);
  $('rDrv').innerHTML='<option value="">未定</option>'+names.map(function(n){var d=drvOf(n);return '<option value="'+esc(n)+'"'+(n===x.driver?' selected':'')+'>'+esc(n)+(d&&d.on?' ○':'')+(d&&d.no?' (車 NO.'+esc(carNo(d.no))+')':'')+'</option>';}).join('');
  $('rHint').textContent='○ = この日出勤の入力があるドライバー。保存すると出勤表の「送迎 当日」には 10 分以内に反映されます。';
  rChanged();
  var lw=board.lw||{};
  $('rLw').innerHTML='<b>LINE WORKS</b>　<b class="'+(lw.sent?'ok':'no')+'">'+(lw.sent?'送った':'まだ')+'</b>'+(lw.at&&lw.known?' ('+esc(lw.at)+' の記録)':'')+'<br><small>'+esc(lw.text||'')+'</small><br><small>ここからは LINE WORKS へ送りません。送迎ログは 16:30 の自動送信が書くので、手で確定した分は「まだ」と出ることがあります。</small>';
}
function rChanged(){
  var x=rows[curKey],ch=x&&$('rDrv').value!==x.driver;
  $('rSave').disabled=!ch||saving;$('rSave').textContent=saving?'保存中...':(ch?'保存する':'変更なし');
}
$('rDrv').onchange=rChanged;
$('rSave').onclick=function(){
  var x=rows[curKey];if(!x||saving)return;
  saving=true;rChanged();
  api('setSougeiAssigns',[listDay,[{dir:x.dir,store:x.store,name:x.name,driver:$('rDrv').value}]]).then(function(r){
    saving=false;setBoard(r);renderRow();toast('保存しました');
  }).catch(function(e){saving=false;rChanged();window.alert(e.message||e);});
};
$('rBack').onclick=function(){if(pushed){pushed=false;history.back();}else{history.replaceState(null,'',location.pathname+location.search+'#t=list');route();}};

// ---------- 週間 (送迎の予定) ----------
var weekFrom='', weekData=null, weekSeq=0;
function loadWeek(){
  var my=++weekSeq;if(!weekFrom)weekFrom=monOfS(today);
  $('wTitle').textContent=md(weekFrom)+' 〜 '+md(shift(weekFrom,6));
  $('wBody').innerHTML='<div class="msg">読み込み中...</div>';
  api('getSougeiWeek',[weekFrom]).then(function(r){if(my!==weekSeq)return;weekData=r;renderWeek();}).catch(function(e){if(my===weekSeq)sErr('wBody',e);});
}
function renderWeek(){
  var r=weekData,h='<div class="sgrid">';
  for(var i=0;i<7;i++){
    var d=shift(r.from,i),p=parse(d),x=r.days[d],ds=x.drivers.slice().sort(function(a,b){return a.name<b.name?-1:1;});
    h+='<button type="button" class="sd'+(d===r.today?' today':'')+'" data-d="'+d+'"><span class="n">'+p.getDate()+'<span style="font-weight:400;font-size:12px;color:#6B7285"> ('+DOWS[p.getDay()]+')</span></span><span class="cs">'+
      '<span class="chip l">行き '+x.nGo+' / 帰り '+x.nBack+'</span>'+(x.undecided?'<span class="chip r">未定 '+x.undecided+'</span>':(x.nGo+x.nBack?'<span class="shnone">ドライバー決定済み</span>':'<span class="shnone">送迎なし</span>'))+
      ds.map(function(y){return '<span class="chip">'+esc(y.name)+' <small>'+(y.go&&y.back?'朝・帰':y.go?'朝':'帰')+'</small></span>';}).join('')+(ds.length?'':'<span class="shnone">ドライバー出勤なし</span>')+'</span></button>';
  }
  $('wBody').innerHTML=h+'</div>'+(r.notes&&r.notes.length?'<div class="note">'+r.notes.map(esc).join(' / ')+'</div>':'');
  $('wUpd').textContent='最終更新 '+r.updated;
  [].forEach.call($('wBody').querySelectorAll('.sd'),function(el){el.onclick=function(){listDay=el.getAttribute('data-d');setTab('list');};});
}
$('wPrev').onclick=function(){weekFrom=shift(weekFrom,-7);loadWeek();};
$('wNext').onclick=function(){weekFrom=shift(weekFrom,7);loadWeek();};
$('wToday').onclick=function(){weekFrom=monOfS(today);loadWeek();};

// ---------- 週間シフト (ドライバー出勤) ----------
// 日付を押す -> 出られるドライバーを選ぶ (他の人の分も触れる)。朝 = 行き / 帰り の区別はそのまま
var shFrom='', shData=null, shSeq=0, shDay='', shDraft={}, shSaving=false;
function loadShift(){
  var my=++shSeq;if(!shFrom)shFrom=monOfS(today);
  $('sTitle').textContent=md(shFrom)+' 〜 '+md(shift(shFrom,6));
  $('sBody').innerHTML='<div class="msg">読み込み中...</div>';
  api('getSougeiShiftBoard',[shFrom]).then(function(r){if(my!==shSeq)return;shData=r;today=r.today||today;renderShift();}).catch(function(e){if(my===shSeq)sErr('sBody',e);});
}
function renderShift(){
  var r=shData,h='<div class="sgrid">';
  for(var i=0;i<7;i++){
    var d=shift(r.from,i),p=parse(d),past=d<r.today,cs=(r.days[d]||[]).slice().sort(function(a,b){return a.name<b.name?-1:1;});
    h+='<button type="button" class="sd'+(d===r.today?' today':'')+'" data-d="'+d+'"'+(past?' disabled':'')+'><span class="n">'+p.getDate()+'<span style="font-weight:400;font-size:12px;color:#6B7285"> ('+DOWS[p.getDay()]+')</span></span><span class="cs">'+
      (cs.length?cs.map(function(x){return '<span class="chip">'+esc(x.name)+' <small>'+(x.go&&x.back?'朝・帰':x.go?'朝':'帰')+'</small></span>';}).join(''):'<span class="shnone">入力なし</span>')+'</span></button>';
  }
  $('sBody').innerHTML=h+'</div>';
  $('sUpd').textContent='最終更新 '+r.updated;
  [].forEach.call($('sBody').querySelectorAll('.sd'),function(el){el.onclick=function(){openSh(el.getAttribute('data-d'));};});
}
function openSh(d){
  shDay=d;shDraft={};
  (shData.days[d]||[]).forEach(function(x){shDraft[x.name]={go:!!x.go,back:!!x.back};});
  $('shT').textContent=mdw(d)+' の出勤';
  drawSh();$('ovSh').hidden=false;
}
function drawSh(){
  var r=shData,h='';
  if(!r.drivers.length)h='<div class="msg">ドライバーが未登録です</div>';
  r.drivers.forEach(function(n,i){
    var c=shDraft[n]||{go:false,back:false};
    h+='<div class="srow"><b>'+esc(n)+'</b><div class="sseg"><button type="button" data-n="'+i+'" data-w="go"'+(c.go?' class="on"':'')+'>朝</button><button type="button" data-n="'+i+'" data-w="back"'+(c.back?' class="on"':'')+'>帰り</button></div></div>';
  });
  $('shBody').innerHTML=h;
  [].forEach.call($('shBody').querySelectorAll('button'),function(b){b.onclick=function(){
    var n=r.drivers[+b.getAttribute('data-n')],w=b.getAttribute('data-w'),c=shDraft[n]||{go:false,back:false};
    c[w]=!c[w];if(c.go||c.back)shDraft[n]=c;else delete shDraft[n];
    drawSh();
  };});
  $('shOk').disabled=shSaving||!r.drivers.length;$('shOk').textContent=shSaving?'反映中...':'決定';
}
$('shOk').onclick=function(){
  if(shSaving)return;shSaving=true;drawSh();
  var as=Object.keys(shDraft).map(function(n){return {name:n,go:shDraft[n].go,back:shDraft[n].back};});
  api('setSougeiShiftDay',[shDay,as]).then(function(r){shData=r;shSaving=false;$('ovSh').hidden=true;renderShift();toast('反映しました');}).catch(function(e){shSaving=false;drawSh();window.alert(e.message||e);});
};
$('shClose').onclick=function(){$('ovSh').hidden=true;};
$('ovSh').onclick=function(e){if(e.target===$('ovSh'))$('ovSh').hidden=true;};
$('sPrev').onclick=function(){shFrom=shift(shFrom,-7);loadShift();};
$('sNext').onclick=function(){shFrom=shift(shFrom,7);loadShift();};
$('sToday').onclick=function(){shFrom=monOfS(today);loadShift();};

// ---------- 画面の切り替え ----------
// #r=行 = 処理の画面 / #t=list|week|shift = タブ (何も無ければ 当日)
function setTab(t){history.replaceState(null,'',location.pathname+location.search+'#t='+t);route();}
[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.onclick=function(){setTab(b.getAttribute('data-t'));};});
function route(){
  var m=/^#r=(.+)$/.exec(location.hash),t=/^#t=(list|week|shift)$/.exec(location.hash);
  $('ovSh').hidden=true;
  ['vList','vWeek','vShift','vRow'].forEach(function(id){$(id).hidden=true;});
  if(m){
    $('hd').hidden=true;$('vRow').hidden=false;window.scrollTo(0,0);
    try{curKey=decodeURIComponent(m[1]);}catch(e){curKey=m[1];}
    if(board&&rows[curKey]){renderRow();return;}
    $('rName').textContent='読み込み中...';$('rSub').textContent='';$('rKv').innerHTML='';
    if(!listDay)listDay=today;
    api('getSougeiBoard',[listDay]).then(function(r){setBoard(r);if(!$('vRow').hidden)renderRow();}).catch(function(e){$('rName').textContent='読み込めませんでした';$('rSub').textContent=String(e.message||e);});
    return;
  }
  var tab=t?t[1]:'list';
  $('hd').hidden=false;
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.className=b.getAttribute('data-t')===tab?'on':'';});
  $(tab==='list'?'vList':tab==='week'?'vWeek':'vShift').hidden=false;
  if(tab==='list')loadList();else if(tab==='week')loadWeek();else loadShift();
}
window.addEventListener('popstate',route);
route();
</script>
